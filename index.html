<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spieltisch">
<meta name="theme-color" content="#0c2430">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<title>Spieltisch</title>
<style>
@font-face{font-family:"Bricolage Grotesque";src:url(fonts/bricolage.woff2) format("woff2");font-weight:200 800;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(fonts/atkinson-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Atkinson Hyperlegible";src:url(fonts/atkinson-700.woff2) format("woff2");font-weight:700;font-display:swap}
/* Layout: Startbildschirm wie ein iPad-Home-Bildschirm – Kopf mit Name und "Zuletzt gespielt",
   darunter die Spiele als Symbol-Kacheln, nach Art des Spiels in Regale sortiert. */
:root{
  color-scheme:dark;
  --sea:#0c2430; --sea-hi:#16404f; --ink:#e8f1ee; --ink2:#9db8b8; --line:rgba(170,215,215,.16); --akzent:#8fd3d1;
  --f-disp:"Bricolage Grotesque", ui-rounded, system-ui, sans-serif; --f-ui:"Atkinson Hyperlegible", -apple-system, system-ui, sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--sea);color:var(--ink)}
body{font-family:var(--f-ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;-webkit-text-size-adjust:100%;
  background:repeating-radial-gradient(circle at 50% 18%, transparent 0 46px, rgba(143,211,209,.045) 46px 47px),
  radial-gradient(ellipse 80% 60% at 50% 12%, var(--sea-hi) 0%, var(--sea) 70%) fixed}
a{color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent}
a:focus-visible{outline:3px solid var(--akzent);outline-offset:4px;border-radius:24px}
.wrap{max-width:1180px;margin:0 auto;padding-block:max(34px,calc(env(safe-area-inset-top,0px) + 22px)) max(40px,env(safe-area-inset-bottom,0px));
  padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:34px}
h1{font-family:var(--f-disp);font-weight:800;font-size:clamp(52px,7vw,92px);letter-spacing:-.05em;line-height:.88;margin:0}
.unter{color:var(--ink2);font-size:19px;margin:12px 0 0}
.zuletzt{display:flex;align-items:center;gap:14px;padding:12px 18px 12px 12px;border-radius:20px;border:1px solid var(--line);background:rgba(7,24,32,.6);max-width:100%}
.zuletzt .ic{width:56px;height:56px;border-radius:15px;flex:none}
.zuletzt small{display:block;color:var(--ink2);font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.zuletzt b{font-size:19px}
.zuletzt .pfeil{color:var(--akzent);font-size:24px;margin-left:6px}
section{margin-top:30px}
section h2{font-size:13px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink2);margin:0 0 16px;font-weight:700;display:flex;align-items:center;gap:12px}
section h2::after{content:"";flex:1;height:1px;background:var(--line)}
.regal{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:26px 18px}
.kachel{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;transition:transform .15s}
.kachel:active{transform:scale(.94)}
.ic{position:relative;width:104px;height:104px;border-radius:26px;background:var(--bg);display:grid;place-items:center;overflow:hidden;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22), inset 0 -2px 0 rgba(0,0,0,.18), 0 10px 24px rgba(0,0,0,.35)}
.ic::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 30% 20%, transparent 0 14px, rgba(255,255,255,.06) 14px 15px)}
.ic svg{position:relative;width:70%;height:70%}
.kachel .nm{font-weight:700;font-size:16px;line-height:1.15}
.kachel .sp{font-size:13px;color:var(--ink2);margin-top:-6px}
.laeuft{position:absolute;right:8px;top:8px;width:14px;height:14px;border-radius:50%;background:#f2c14e;box-shadow:0 0 0 3px rgba(12,36,48,.85)}
footer{margin-top:44px;color:var(--ink2);font-size:14px;line-height:1.5;max-width:70ch}
@media (max-width:520px){.regal{grid-template-columns:repeat(3,1fr);gap:22px 10px}.ic{width:84px;height:84px;border-radius:21px}}
@media (prefers-reduced-motion:reduce){.kachel{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Spieltisch</h1>
      <p class="unter" id="unter">18 Spiele für einen Tisch und ein iPad.</p>
    </div>
    <a class="zuletzt" id="zuletzt" hidden></a>
  </header>
  <main id="regale"></main>
  <footer>Alle Spiele laufen ohne Internet. Ein angefangenes Spiel bleibt gespeichert, auch wenn du zwischendurch ein anderes öffnest; der gelbe Punkt zeigt, wo noch eins läuft.</footer>
</div>
<script>
"use strict";
/* Jede Kachel: id = Dateiname in spiele/, laeuft = Schlüssel des gespeicherten Spiels. */
const S = 'stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"';
const DOT = (x, y, r = 3.4, f = '#1e2a30') => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"/>`;
const WUERFEL = (x, y, s, augen, rot = 0) => {
  const p = {1:[[.5,.5]],2:[[.27,.27],[.73,.73]],3:[[.27,.27],[.5,.5],[.73,.73]],4:[[.27,.27],[.73,.27],[.27,.73],[.73,.73]],5:[[.27,.27],[.73,.27],[.5,.5],[.27,.73],[.73,.73]],6:[[.27,.25],[.73,.25],[.27,.5],[.73,.5],[.27,.75],[.73,.75]]}[augen];
  return `<g transform="rotate(${rot} ${x + s / 2} ${y + s / 2})"><rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${s * .2}" fill="#fbf8f1"/>${p.map(([a, b]) => DOT(x + a * s, y + b * s, s * .085)).join('')}</g>`;
};
const KARTE = (x, y, w, fill, text, tfill = '#fff', rot = 0, size = 18) =>
  `<g transform="rotate(${rot} ${x + w / 2} ${y + w * .7})"><rect x="${x}" y="${y}" width="${w}" height="${w * 1.4}" rx="${w * .13}" fill="${fill}" stroke="rgba(255,255,255,.75)" stroke-width="2"/>${text ? `<text x="${x + w / 2}" y="${y + w * .84}" text-anchor="middle" font-family="Bricolage Grotesque, system-ui" font-weight="800" font-size="${size}" fill="${tfill}">${text}</text>` : ''}</g>`;

const SPIELE = [
  {regal: 'Karten', id: 'tiefpunkt', name: 'Tiefpunkt', sp: '2–6', bg: 'linear-gradient(160deg,#27317a,#152049)', laeuft: 'tiefpunkt.spiel.v1',
    svg: `${KARTE(12, 12, 30, '#1d4a6b', '')}${KARTE(28, 18, 30, '#27317a', '−2', '#fff', 10, 15)}`},
  {regal: 'Karten', id: 'letztekarte', name: 'Letzte Karte', sp: '2–8', bg: 'linear-gradient(160deg,#c9463b,#7c2420)',
    svg: `${KARTE(10, 16, 24, '#2f7fd1', '', '', -18)}${KARTE(20, 12, 24, '#3a9a57', '', '', -6)}${KARTE(30, 12, 24, '#e2b437', '', '', 6)}${KARTE(38, 16, 24, '#d8483c', '1', '#fff', 18, 16)}`},
  {regal: 'Karten', id: 'etappen', name: 'Zehn Etappen', sp: '2–6', bg: 'linear-gradient(160deg,#6b4bd6,#3a2780)',
    svg: `<path d="M8 54h12V42h12V30h12V18h12" ${S}/><text x="50" y="14" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="13" fill="#fff">10</text>`},
  {regal: 'Karten', id: 'stapelei', name: 'Stapelei', sp: '2–6', bg: 'linear-gradient(160deg,#df7a2e,#8f4515)',
    svg: `${KARTE(8, 22, 22, '#fbf8f1', '1', '#8f4515', 0, 15)}${KARTE(21, 15, 22, '#fbf8f1', '2', '#8f4515', 0, 15)}${KARTE(34, 8, 22, '#fbf8f1', '3', '#8f4515', 0, 15)}`},
  {regal: 'Karten', id: 'romme', name: 'Rommé', sp: '2–6', bg: 'linear-gradient(160deg,#2b8a6b,#145240)',
    svg: `${KARTE(12, 12, 28, '#fbf8f1', 'A♠', '#1e2a30', -10, 13)}${KARTE(26, 14, 28, '#fbf8f1', 'K♥', '#c0392b', 10, 13)}`},
  {regal: 'Karten', id: 'poker', name: 'Poker', sp: '2–8', bg: 'linear-gradient(160deg,#1e6b45,#0e3a25)',
    svg: `${KARTE(10, 10, 24, '#fbf8f1', 'A♦', '#c0392b', -12, 11)}${KARTE(24, 8, 24, '#fbf8f1', 'A♣', '#1e2a30', 8, 11)}<circle cx="44" cy="46" r="13" fill="#d8483c" stroke="#fff" stroke-width="3" stroke-dasharray="5 4"/><circle cx="44" cy="46" r="6" fill="#fff"/>`},
  {regal: 'Würfel', id: 'maexchen', name: 'Mäxchen', sp: '2–8', bg: 'linear-gradient(160deg,#a8325e,#5c1834)',
    svg: `<path d="M14 14h24l-4 34H18z" fill="#3b1222" stroke="#fff" stroke-width="2.5" stroke-linejoin="round" transform="rotate(-14 26 30)"/>${WUERFEL(30, 30, 18, 2, 12)}${WUERFEL(42, 40, 16, 1, -8)}`},
  {regal: 'Würfel', id: 'fuenferpasch', name: 'Fünferpasch', sp: '1–6', bg: 'linear-gradient(160deg,#d6493f,#7d1f1a)',
    svg: `${WUERFEL(6, 10, 18, 5, -8)}${WUERFEL(26, 6, 18, 5, 6)}${WUERFEL(44, 12, 16, 5, 12)}${WUERFEL(12, 34, 18, 5, 4)}${WUERFEL(34, 32, 18, 5, -10)}`},
  {regal: 'Brett', id: 'schach', name: 'Schach', sp: '2', bg: 'linear-gradient(160deg,#4a5a66,#232c33)',
    svg: `<path d="M22 54h22M24 50h18l-2-6H26zM27 44l1-12-5-6 3-8 6-4 6 2 4 6-2 3-5-1 3 18" fill="#fbf8f1" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><circle cx="34" cy="20" r="1.6" fill="#232c33"/>`},
  {regal: 'Brett', id: 'dame', name: 'Dame', sp: '2', bg: 'linear-gradient(160deg,#9b5a2c,#55301a)',
    svg: `<rect x="8" y="8" width="48" height="48" rx="4" fill="#e9d2a8"/><path d="M8 8h12v12H8zM32 8h12v12H32zM20 20h12v12H20zM44 20h12v12H44zM8 32h12v12H8zM32 32h12v12H32zM20 44h12v12H20zM44 44h12v12H44z" fill="#7a4524"/><circle cx="26" cy="26" r="8" fill="#1e2a30" stroke="#fff" stroke-width="2"/><circle cx="38" cy="38" r="8" fill="#f4efe4" stroke="#7a4524" stroke-width="2"/>`},
  {regal: 'Brett', id: 'muehle', name: 'Mühle', sp: '2', bg: 'linear-gradient(160deg,#5f7d2e,#2f4214)',
    svg: `<rect x="8" y="8" width="48" height="48" ${S}/><rect x="18" y="18" width="28" height="28" ${S}/><rect x="27" y="27" width="10" height="10" ${S}/><path d="M32 8v19M32 37v19M8 32h19M37 32h19" ${S}/>${DOT(8, 8, 5, '#fff')}${DOT(32, 8, 5, '#fff')}${DOT(56, 8, 5, '#fff')}${DOT(18, 46, 5, '#1e2a30')}`},
  {regal: 'Brett', id: 'halma', name: 'Halma', sp: '2–6', bg: 'linear-gradient(160deg,#2f8fb0,#174a60)',
    svg: `<path d="M32 4l7 12h14l-7 12 7 12H39l-7 12-7-12H11l7-12-7-12h14z" fill="rgba(255,255,255,.15)" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/>${DOT(32, 12, 3, '#f2c14e')}${DOT(48, 22, 3, '#ef7d6d')}${DOT(48, 42, 3, '#8ad69c')}${DOT(32, 52, 3, '#b9a0f4')}${DOT(16, 42, 3, '#6cc7d8')}${DOT(16, 22, 3, '#f49fc6')}${DOT(32, 32, 3.4, '#fff')}`},
  {regal: 'Brett', id: 'vierreihe', name: 'Vier in einer Reihe', sp: '2', bg: 'linear-gradient(160deg,#2c5bb8,#162f66)',
    svg: `<rect x="6" y="10" width="52" height="44" rx="6" fill="#1b3f8a" stroke="#fff" stroke-width="2"/>${[0, 1, 2, 3].map(r => [0, 1, 2, 3].map(c => DOT(15 + c * 11.3, 19 + r * 10.5, 4, (r === 3 && c < 3) || (r === 2 && c === 1) ? '#f2c14e' : (r === 3 && c === 3) || (r === 2 && c === 2) || (r === 1 && c === 2) ? '#ef7d6d' : '#0e2147')).join('')).join('')}`},
  {regal: 'Brett', id: 'schiffe', name: 'Schiffe versenken', sp: '2', bg: 'linear-gradient(160deg,#21738a,#0f3b48)',
    svg: `<path d="M8 24h48M8 40h48M24 8v48M40 8v48" stroke="rgba(255,255,255,.35)" stroke-width="2"/><path d="M10 34h30l-4 8H14z" fill="#fbf8f1"/><path d="M20 34v-8h10v8" fill="#fbf8f1"/><path d="M46 14l8 8M54 14l-8 8" stroke="#ef7d6d" stroke-width="3.5" stroke-linecap="round"/>`},
  {regal: 'Legen und Handeln', id: 'rheinbaron', name: 'Rheinbaron', sp: '2–6', bg: 'linear-gradient(160deg,#2e7d4f,#164229)',
    svg: `<path d="M12 30l14-12 14 12v20H12z" fill="#fbf8f1"/><path d="M22 50V38h8v12" fill="#d8483c"/><path d="M36 26l10-8 10 8v24H36z" fill="#f2c14e"/>${WUERFEL(6, 44, 13, 6, -10)}`},
  {regal: 'Legen und Handeln', id: 'zahlenromme', name: 'Zahlenrommé', sp: '2–4', bg: 'linear-gradient(160deg,#c58b2a,#6e4810)',
    svg: `${[['7', '#c0392b'], ['8', '#2c5bb8'], ['9', '#1e2a30']].map(([t, f], i) => `<rect x="${6 + i * 18}" y="18" width="16" height="24" rx="3" fill="#fbf8f1"/><text x="${14 + i * 18}" y="36" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="15" fill="${f}">${t}</text>`).join('')}<rect x="10" y="44" width="44" height="6" rx="3" fill="rgba(255,255,255,.35)"/>`},
  {regal: 'Worte und Teams', id: 'wortverbot', name: 'Wortverbot', sp: '4–12', bg: 'linear-gradient(160deg,#d64d8a,#7a1f4a)',
    svg: `<path d="M8 14h48v28H30l-12 10v-10H8z" fill="#fbf8f1"/><text x="32" y="33" text-anchor="middle" font-family="Bricolage Grotesque" font-weight="800" font-size="12" fill="#7a1f4a">WORT</text><path d="M14 22l36 12" stroke="#d64d8a" stroke-width="3.5" stroke-linecap="round"/>`},
  {regal: 'Worte und Teams', id: 'funkstille', name: 'Funkstille', sp: '4–10', bg: 'linear-gradient(160deg,#3d4b8f,#1b2150)',
    svg: `${[0, 1, 2, 3].map(r => [0, 1, 2, 3].map(c => `<rect x="${8 + c * 12.5}" y="${10 + r * 11.5}" width="10" height="9" rx="2" fill="${['#ef7d6d', '#6cc7d8', '#fbf8f1', '#ef7d6d', '#fbf8f1', '#6cc7d8', '#1e2a30', '#fbf8f1', '#6cc7d8', '#fbf8f1', '#ef7d6d', '#fbf8f1', '#fbf8f1', '#ef7d6d', '#fbf8f1', '#6cc7d8'][r * 4 + c]}"/>`).join('')).join('')}`}
];

function laeuft(sp) {
  try { return localStorage.getItem(sp.laeuft || `spieltisch.${sp.id}.spiel`) != null; } catch (e) { return false; }
}
function icon(sp) { return `<span class="ic" style="--bg:${sp.bg}"><svg viewBox="0 0 64 64" aria-hidden="true">${sp.svg}</svg>${laeuft(sp) ? '<span class="laeuft" title="Spiel läuft"></span>' : ''}</span>`; }
const regale = document.getElementById('regale');
const gruppen = [...new Set(SPIELE.map(s => s.regal))];
regale.innerHTML = gruppen.map(g => `<section><h2>${g}</h2><div class="regal">${SPIELE.filter(s => s.regal === g).map(s =>
  `<a class="kachel" href="spiele/${s.id}.html">${icon(s)}<span class="nm">${s.name}</span><span class="sp">${s.sp} Spieler</span></a>`).join('')}</div></section>`).join('');
document.getElementById('unter').textContent = `${SPIELE.length} Spiele für einen Tisch und ein iPad.`;
let zul = null; try { zul = localStorage.getItem('spieltisch.zuletzt'); } catch (e) {}
const z = SPIELE.find(s => s.id === zul);
if (z) {
  const a = document.getElementById('zuletzt'); a.hidden = false; a.href = `spiele/${z.id}.html`;
  a.innerHTML = `${icon(z)}<span><small>Zuletzt gespielt</small><b>${z.name}</b></span><span class="pfeil">→</span>`;
}
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</body>
</html>
