<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="icon" href="../icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c2430">
<title>Stadt, Land, Fluss · Spieltisch</title>
<link rel="stylesheet" href="../gemeinsam/kern.css">
<style>
/* Stadt, Land, Fluss: ein karierter Spielblock auf dem Seekarten-Tisch. Der Buchstabe steht groß auf einem Papierkärtchen,
   Kategorien als Zeilen des Blocks. Akzent Senfgelb. */
:root{--sl-ak:#e9b949;--sl-blau:#3b6fb6;--sl-rot:#c0453a;--sl-vh:100dvh}

/* ---------- Startseite: Kategorien ---------- */
.sl-kats{display:flex;flex-wrap:wrap;gap:8px}
.sl-kat{position:relative;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel-hell);font-weight:700;font-size:15px;color:var(--ink2)}
.sl-kat[aria-pressed="true"]{background:color-mix(in srgb,var(--sl-ak) 20%,transparent);border-color:var(--sl-ak);color:var(--ink)}
.sl-kat[aria-pressed="true"]::before{content:"✓ ";color:var(--sl-ak)}
.sl-kat.eigen{border-style:dashed}
.sl-katzeile{display:flex;gap:8px;margin-top:10px}
.sl-katzeile .k-feld{flex:1;height:46px}
.sl-katzeile .k-btn{min-height:46px}
.sl-hinweis{font-size:14px;color:var(--ink2);margin:8px 0 0}
.sl-hinweis b{color:var(--ink)}

/* ---------- Bühne ---------- */
.sl-buehne{display:flex;flex-direction:column}
.sl-kopf{display:flex;align-items:center;gap:12px;min-height:50px;padding-left:120px;padding-right:96px;flex:none}
.sl-kopf .sl-runde{font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.sl-kopf h2{font-size:clamp(22px,2.6vw,30px)}
.sl-mitte{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(14px,2.4vh,26px);padding:8px 0}
.sl-satz{color:var(--ink2);font-size:19px;text-align:center;max-width:42ch;margin:0 auto;line-height:1.45;text-wrap:balance}
.sl-satz b{color:var(--ink)}
.sl-reihe{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}

/* Punktestand als Chips */
.sl-stand{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:900px}
.sl-stand>span{display:inline-flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:99px;background:var(--panel);border:1px solid var(--line);font-weight:700;font-size:16px}
.sl-stand>span b{font-family:var(--f-disp);font-size:18px;font-variant-numeric:tabular-nums;color:var(--sl-ak)}
.sl-stand>span.ich{border-color:var(--pc)}
.sl-stand small{font-weight:400;color:var(--ink2);font-size:14px}

/* Das Buchstabenkärtchen */
.sl-karte{position:relative;width:clamp(150px,22vmin,230px);aspect-ratio:4/5;border-radius:24px;background:var(--papier);color:var(--papier-ink);
  box-shadow:0 22px 46px rgba(0,0,0,.45),inset 0 0 0 1px rgba(0,0,0,.06);display:grid;place-items:center;flex:none;overflow:hidden;
  background-image:linear-gradient(transparent calc(100% - 1px),rgba(59,111,182,.18) 0),linear-gradient(90deg,transparent 22px,rgba(192,69,58,.35) 22px 24px,transparent 24px);
  background-size:100% 22px,100% 100%}
.sl-karte b{font-family:var(--f-disp);font-weight:800;font-size:clamp(96px,15vmin,160px);line-height:1;letter-spacing:-.04em;transform:translateY(4%)}
.sl-karte.leer b{color:rgba(27,42,47,.22)}
.sl-karte.rollt b{animation:sl-flip .09s linear infinite alternate}
.sl-karte.da{animation:sl-pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes sl-flip{from{transform:translateY(-6%) scale(.92);opacity:.6}to{transform:translateY(8%);opacity:1}}
@keyframes sl-pop{0%{transform:scale(.86) rotate(-4deg)}100%{transform:none}}
.sl-karte small{position:absolute;top:10px;left:34px;right:10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.55}

/* Kategorien als Blockzeilen (am selben Gerät, zum Abschreiben) */
.sl-block{background:var(--papier);color:var(--papier-ink);border-radius:20px;padding:10px 0;box-shadow:0 16px 40px rgba(0,0,0,.35);min-width:min(420px,100%);max-width:620px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.sl-block div{display:flex;align-items:center;gap:10px;padding:9px 18px;font-weight:700;font-size:19px;border-bottom:1px solid rgba(59,111,182,.18)}
.sl-block div i{font-style:normal;font-family:var(--f-disp);font-size:14px;color:var(--sl-rot);width:18px;text-align:right}

/* Uhr */
.sl-uhr{display:flex;align-items:center;gap:12px;min-width:min(420px,100%)}
.sl-zeit{font-family:var(--f-disp);font-weight:800;font-size:clamp(36px,4.6vw,52px);line-height:1;font-variant-numeric:tabular-nums;min-width:3ch}
.sl-balken{flex:1;height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.sl-balken i{display:block;height:100%;background:var(--sl-ak);transform-origin:left;border-radius:inherit}
.sl-uhr.knapp .sl-zeit{color:var(--warn)}.sl-uhr.knapp .sl-balken i{background:var(--warn)}
.sl-uhr.sehrknapp .sl-zeit{color:var(--fehler)}

/* Laufende Runde am selben Gerät */
.sl-lauf{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(18px,3vw,44px);align-items:center;justify-items:start;
  max-width:1060px;width:100%;margin:0 auto;padding:4px 10px}
.sl-lauf .sl-links{display:flex;flex-direction:column;align-items:center;gap:16px}
.sl-lauf .sl-rechts{display:flex;flex-direction:column;gap:16px;width:100%}
.sl-stopp{min-height:84px!important;font-size:30px!important;border-radius:22px!important;background:var(--sl-rot)!important;color:#fff!important;padding:0 40px!important;
  box-shadow:0 10px 30px rgba(192,69,58,.35);letter-spacing:.02em}
.sl-stopp:disabled{opacity:.35}

/* Laufende Runde im Netzspiel: eigener Spielblock mit Eingabefeldern */
.sl-netzlauf{flex:1;min-height:0;display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:14px clamp(16px,3vw,36px);max-width:1060px;width:100%;margin:0 auto}
.sl-netzlauf .sl-links{grid-row:1/3;display:flex;flex-direction:column;align-items:center;gap:14px;justify-content:center}
.sl-blatt{min-height:0;overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;background:var(--papier);color:var(--papier-ink);border-radius:22px;padding:8px 0;box-shadow:0 16px 40px rgba(0,0,0,.35)}
.sl-zeile{display:grid;grid-template-columns:minmax(90px,30%) minmax(0,1fr);align-items:center;border-bottom:1px solid rgba(59,111,182,.2);min-height:58px}
.sl-zeile:last-child{border-bottom:0}
.sl-zeile label{padding:0 10px 0 20px;font-weight:700;font-size:16px;color:#4b5a5f;border-right:2px solid rgba(192,69,58,.35);align-self:stretch;display:flex;align-items:center}
.sl-zeile input{width:100%;min-width:0;height:56px;border:0;background:none;padding:0 16px;font-size:21px;font-weight:700;color:var(--papier-ink);outline:none;font-family:var(--f-ui)}
.sl-zeile input::placeholder{color:rgba(27,42,47,.28);font-weight:400}
.sl-zeile input:focus{background:rgba(233,185,73,.16)}
.sl-zeile input:disabled{color:rgba(27,42,47,.65)}
.sl-zeile.ok label::after{content:"✓";margin-left:auto;color:#2f8f5b;font-size:15px}
.sl-tipp{display:flex;flex-direction:column;gap:10px;max-width:240px}
.sl-tipp p{margin:0;color:var(--ink2);font-size:15px;line-height:1.4;text-align:center}
.sl-tipp p b{color:var(--sl-ak);font-family:var(--f-disp);font-size:18px}
.sl-unten{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sl-unten .sl-stopp{flex:1 1 260px}
.sl-fort{display:flex;flex-wrap:wrap;gap:6px}
.sl-fort>span{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink2);padding:4px 10px 4px 4px;border-radius:99px;background:rgba(255,255,255,.06)}
.sl-fort>span .k-dot{width:20px;height:20px;font-size:11px}
.sl-fort>span.voll{color:var(--ink)}
.sl-fort>span.voll .k-dot{box-shadow:0 0 0 2px var(--sl-ak)}

/* Stopp-Anzeige */
.sl-stoppbild{position:fixed;inset:0;z-index:90;display:grid;place-items:center;pointer-events:none}
.sl-stoppbild div{background:var(--sl-rot);color:#fff;font-family:var(--f-disp);font-weight:800;font-size:clamp(70px,14vw,150px);padding:10px 50px 20px;border-radius:40px;
  box-shadow:0 30px 80px rgba(0,0,0,.5);animation:sl-stopp 1.6s cubic-bezier(.2,1.2,.4,1) forwards;text-align:center;line-height:1}
.sl-stoppbild small{display:block;font-family:var(--f-ui);font-size:20px;font-weight:700;margin-top:8px}
@keyframes sl-stopp{0%{transform:scale(.5) rotate(-8deg);opacity:0}15%{transform:scale(1.05) rotate(-3deg);opacity:1}80%{transform:scale(1) rotate(-3deg);opacity:1}100%{opacity:0}}

/* ---------- Wertung ---------- */
.sl-wert{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;width:100%;max-width:1100px;margin:0 auto}
.sl-wert.schmal{max-width:820px}
.sl-kattitel{display:flex;align-items:baseline;gap:14px;flex:none;padding:4px 4px 0}
.sl-kattitel h3{font-size:clamp(30px,4vw,44px)}
.sl-kattitel span{color:var(--ink2);font-size:16px}
.sl-kattitel b{color:var(--sl-ak);font-family:var(--f-disp)}
.sl-tabs{display:flex;gap:8px;overflow-x:auto;touch-action:pan-x;padding:2px 2px 6px;flex:none;scrollbar-width:none}
.sl-tabs button{flex:none;min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel-hell);font-weight:700;font-size:15px;color:var(--ink2)}
.sl-tabs button.an{background:var(--sl-ak);color:#2a1f05;border-color:transparent}
.sl-tabs button.fertig:not(.an){color:var(--ink)}
.sl-tabs button.fertig:not(.an)::after{content:" ✓";color:var(--gut)}
.sl-liste{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:flex;flex-direction:column;gap:8px}
.sl-wz{display:grid;grid-template-columns:minmax(0,1fr) auto 64px;align-items:center;gap:12px;padding:8px 10px 8px 14px;border-radius:16px;background:var(--panel);border:1px solid var(--line)}
.sl-wz .sl-wer{display:flex;align-items:center;gap:10px;font-weight:700;font-size:18px;min-width:0}
.sl-wz .sl-wer span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sl-wz .k-seg{flex-wrap:nowrap;gap:6px}
.sl-wz .k-seg button{min-width:0;min-height:46px;font-size:15px;padding:0 12px;flex:none}
.sl-wz .k-seg button[data-st="leer"][aria-pressed="true"]{background:#5b6b70;color:#fff}
.sl-wz .k-seg button[data-st="doppelt"][aria-pressed="true"]{background:#6cc7d8;color:#0c2430}
.sl-pk{font-family:var(--f-disp);font-weight:800;font-size:28px;text-align:right;font-variant-numeric:tabular-nums;color:var(--sl-ak)}
.sl-pk.null{color:var(--ink3)}
.sl-pk.max{color:var(--gut)}
.sl-wfuss{display:flex;gap:10px;justify-content:space-between;align-items:center;flex:none;flex-wrap:wrap}
.sl-wfuss .sl-satz{margin:0;font-size:15px;text-align:left;flex:1 1 200px}

/* Wertung im Netzspiel: alle Antworten nebeneinander */
.sl-raster{flex:1;min-height:0;overflow-y:auto;touch-action:pan-y;display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-content:start;padding-bottom:4px}
.sl-kk{border-radius:18px;background:var(--panel);border:1px solid var(--line);overflow:hidden}
.sl-kk h3{font-family:var(--f-ui);font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--sl-ak);padding:10px 14px 6px;margin:0}
.sl-an{display:grid;grid-template-columns:22px minmax(0,1fr) auto;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 12px;border:0;border-top:1px solid var(--line);background:none;text-align:left;color:var(--ink)}
.sl-an .sl-txt{font-weight:700;font-size:18px;overflow-wrap:anywhere;line-height:1.2}
.sl-an .sl-txt small{display:block;font-weight:400;font-size:12px;color:var(--ink2);letter-spacing:.02em}
.sl-an.leer .sl-txt{color:var(--ink3);font-weight:400;font-style:italic}
.sl-an.raus .sl-txt b{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--fehler);color:var(--ink2)}
.sl-an.ich{background:rgba(255,255,255,.04)}
.sl-an.meinein{box-shadow:inset 3px 0 0 var(--fehler)}
.sl-an .sl-pk{font-size:22px;min-width:34px}
.sl-an .sl-dop{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:#6cc7d8;color:#0c2430;margin-left:6px;vertical-align:2px}
.sl-an .sl-stim{font-size:11px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--fehler);color:#2a0a06;margin-left:6px;vertical-align:2px}

/* ---------- Rundenergebnis und Ende ---------- */
.sl-tabhuelle{width:min(1000px,100%);max-height:min(52vh,560px);overflow:auto;touch-action:pan-x pan-y;border:1px solid var(--line);border-radius:18px;background:var(--panel-fest)}
.sl-tab{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:16px}
.sl-tab th,.sl-tab td{padding:9px 12px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
.sl-tab th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink2);position:sticky;top:0;background:var(--panel-fest);z-index:1}
.sl-tab td:first-child,.sl-tab th:first-child{text-align:left;position:sticky;left:0;background:var(--panel-fest);z-index:2}
.sl-tab td.sum{font-family:var(--f-disp);font-weight:800;font-size:20px;color:var(--sl-ak)}
.sl-tab td.ges{font-family:var(--f-disp);font-weight:800;font-size:22px}
.sl-tab td.z20{color:var(--gut);font-weight:700}.sl-tab td.z0{color:var(--ink3)}
.sl-tab tr.vorn td:first-child{box-shadow:inset 4px 0 0 var(--sl-ak)}
.sl-tab .k-dot{display:inline-grid;width:20px;height:20px;font-size:11px;vertical-align:-4px;margin-right:8px}
.sl-sieger{font-size:clamp(40px,6vw,72px);text-align:center;color:var(--sl-ak)}
.sl-podest{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.sl-podest div{min-width:130px;padding:14px 18px;border-radius:18px;background:var(--panel);border:1px solid var(--line);text-align:center;border-top:4px solid var(--pc)}
.sl-podest div b{display:block;font-family:var(--f-disp);font-size:36px;line-height:1.05}
.sl-podest div small{color:var(--ink2);font-size:14px}
.sl-podest div.erst{border-color:var(--sl-ak);box-shadow:0 0 30px rgba(233,185,73,.25)}

/* ---------- Hochformat (iPad hoch) ---------- */
@media (max-aspect-ratio:1/1){
  .sl-lauf{grid-template-columns:minmax(0,1fr);justify-items:center;align-content:center}
  .sl-lauf .sl-links{flex-direction:row;align-items:center}
  .sl-lauf .sl-rechts{align-items:center}
  .sl-lauf .sl-rechts .sl-satz{text-align:center!important}
  .sl-lauf .sl-stopp{width:min(560px,100%)}
  .sl-netzlauf{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto}
  .sl-netzlauf .sl-links{grid-row:auto;flex-direction:row;justify-content:flex-start;gap:16px}
  .sl-netzlauf .sl-karte{width:110px}
  .sl-netzlauf .sl-karte b{font-size:84px}
  .sl-netzlauf .sl-uhr{min-width:0;flex:1}
  .sl-tipp{max-width:none;flex:1}
  .sl-tipp p{text-align:left}
}
/* ---------- Telefon hoch ---------- */
@media (max-width:700px){
  .sl-katzeile .k-btn{padding:0 14px}
  .sl-kopf{padding-left:112px;padding-right:0;min-height:46px;gap:8px}
  body.sl-netz .sl-kopf{padding-right:84px}
  .sl-kopf h2{font-size:19px}
  .sl-mitte{justify-content:flex-start;overflow-y:auto;touch-action:pan-y;padding:12px 0 4px;gap:16px}
  .sl-mitte::before,.sl-mitte::after{content:"";flex:1 0 0}
  .sl-satz{font-size:17px}
  .sl-stand>span{font-size:15px}
  .sl-karte{width:150px;border-radius:20px}
  .sl-karte b{font-size:110px}
  .sl-block{min-width:0;width:100%;grid-template-columns:1fr 1fr}
  .sl-block div{font-size:17px;padding:8px 12px}
  .sl-uhr{min-width:0;width:100%}
  .sl-lauf{gap:14px;padding:4px 0;align-content:start}
  .sl-lauf .sl-links{gap:14px;width:100%;justify-content:center}
  .sl-lauf .sl-karte{width:118px}
  .sl-lauf .sl-karte b{font-size:88px}
  .sl-lauf .sl-rechts{gap:12px}
  .sl-stopp{min-height:72px!important;font-size:26px!important;width:100%}
  .sl-netzlauf{gap:10px}
  .sl-netzlauf .sl-links{gap:12px}
  .sl-netzlauf .sl-karte{width:76px;border-radius:16px;background-size:100% 14px,100% 100%}
  .sl-netzlauf .sl-karte small{display:none}
  .sl-netzlauf .sl-karte b{font-size:58px}
  .sl-zeile{grid-template-columns:minmax(78px,32%) minmax(0,1fr);min-height:52px}
  .sl-zeile label{padding:0 8px 0 14px;font-size:14px}
  .sl-zeile input{height:50px;font-size:19px;padding:0 12px}
  .sl-unten{gap:8px}
  .sl-unten .sl-stopp{flex-basis:100%}
  .sl-kattitel h3{font-size:28px}
  .sl-wz{grid-template-columns:minmax(0,1fr) 46px;grid-template-areas:"wer pk" "seg seg";gap:8px;padding:10px 10px 10px 12px}
  .sl-wz .sl-wer{grid-area:wer}.sl-wz .sl-pk{grid-area:pk}.sl-wz .k-seg{grid-area:seg}
  .sl-wz .k-seg button{flex:1 1 0}
  .sl-raster{grid-template-columns:minmax(0,1fr)}
  .sl-tabhuelle{max-height:none}
  .sl-tab{font-size:15px}
  .sl-tab th,.sl-tab td{padding:8px 9px}
  .sl-sieger{font-size:clamp(34px,10vw,48px)}
  .sl-podest div{min-width:0;flex:1 1 40%;padding:10px 12px}
  .sl-podest div b{font-size:28px}
  .sl-reihe{width:100%}
  .sl-reihe .k-btn{flex:1 1 auto;white-space:normal;line-height:1.2;padding-block:8px;text-align:center}
  body.sl-tastatur .sl-netzlauf .sl-links{display:none}
  body.sl-tastatur .sl-kopf{display:none}
}
</style>
</head>
<body class="chart">
<script src="../gemeinsam/kern.js"></script>
<script src="../gemeinsam/netz.js"></script>
<script src="stadtlandfluss.logik.js"></script>
<script>
'use strict';
const L = window.StadtLandFlussLogik;
const AKZENT = '#e9b949';
const esc = Kern.esc, el = Kern.el;
const REGELN = `
<p>Ein Buchstabe wird ausgelost. Alle schreiben gleichzeitig zu jeder Kategorie ein Wort, das mit diesem Buchstaben beginnt – bei „K“ etwa Köln, Kanada, Kocher …</p>
<h3>Ablauf</h3>
<ul>
<li>Am selben ${Kern.geraet} schreibt jede Person auf einen Zettel. Das ${Kern.geraet} lost den Buchstaben aus und zeigt die Kategorien.</li>
<li>Wer zuerst alle Kategorien gefüllt hat, tippt auf <b>Stopp</b> – alle hören sofort auf. Mit Zeitlimit endet die Runde spätestens, wenn die Uhr abläuft.</li>
<li>Dann lest ihr Kategorie für Kategorie vor und kreuzt am ${Kern.geraet} an: <b>leer</b> (nichts oder ungültig), <b>eigene</b> Antwort oder <b>doppelt</b> (jemand hat dasselbe Wort). Die Punkte rechnet das ${Kern.geraet}.</li>
</ul>
<h3>Punkte je Kategorie</h3>
<ul>
<li><b>20</b> – nur du hast in dieser Kategorie etwas Gültiges stehen,</li>
<li><b>10</b> – deine Antwort hat sonst niemand,</li>
<li><b>5</b> – jemand anderes hat dasselbe Wort,</li>
<li><b>0</b> – nichts eingetragen oder ungültig (falscher Anfangsbuchstabe, gibt es nicht, passt nicht zur Kategorie).</li>
</ul>
<p>Über strittige Antworten entscheidet die Runde. Ungültige Antworten zählen wie leere.</p>
<h3>Jeder mit eigenem Gerät</h3>
<p>Jede Person tippt auf dem eigenen Gerät. <b>Stopp</b> geht, sobald alle eigenen Felder gefüllt sind, und beendet die Runde für alle. Danach stehen alle Antworten nebeneinander. Gleiche Wörter erkennt das Spiel selbst (Groß- und Kleinschreibung, Leerzeichen, Bindestriche und ein Artikel vorne zählen nicht, ä = ae). Antworten mit falschem Anfangsbuchstaben sind automatisch ungültig.</p>
<p>Einspruch: Tippe eine fremde Antwort an. Erhebt mehr als die Hälfte der anderen Einspruch, ist sie gestrichen. Der Gastgeber kann mit einem Tipp jede Antwort endgültig gelten lassen oder streichen.</p>
<h3>Spielende</h3>
<p>Nach der gewählten Zahl von Runden (Vorgabe 5) gewinnt, wer die meisten Punkte hat. Ein Buchstabe kommt erst wieder, wenn alle anderen dran waren. Q, X und Y lassen sich weglassen.</p>`;

/* ---------- Startseite ---------- */
function katEditor() {
  const e = Kern.einst.laden({ kategorien: L.STANDARD.slice(), eigene: [] });
  const eigene = (e.eigene || []).filter(k => !L.VORSCHLAEGE.includes(k));
  let gewaehlt = (e.kategorien && e.kategorien.length ? e.kategorien : L.STANDARD).slice();
  const box = el('div');
  box.innerHTML = '<span class="k-lab">Kategorien</span>';
  const liste = el('div', 'sl-kats'); box.appendChild(liste);
  const zeile = el('div', 'sl-katzeile');
  zeile.innerHTML = '<label class="k-feld"><input id="sl-neukat" maxlength="22" autocomplete="off" spellcheck="false" placeholder="Eigene Kategorie"></label><button class="k-btn leise" id="sl-katplus" type="button">Dazu</button>';
  box.appendChild(zeile);
  const hint = el('p', 'sl-hinweis'); box.appendChild(hint);
  const alle = () => [...L.VORSCHLAEGE, ...eigene];
  function merken() {
    gewaehlt = alle().filter(k => gewaehlt.includes(k));
    KATS = gewaehlt.slice();
    Kern.einst.speichern({ kategorien: gewaehlt, eigene });
  }
  function zeichnen() {
    liste.innerHTML = '';
    alle().forEach((k, i) => {
      const b = el('button', 'sl-kat' + (eigene.includes(k) ? ' eigen' : ''), esc(k)); b.type = 'button'; b.id = 'sl-kat-' + i;
      b.setAttribute('aria-pressed', gewaehlt.includes(k));
      b.onclick = () => {
        if (gewaehlt.includes(k)) { if (gewaehlt.length <= 3) return Kern.hinweis('Mindestens 3 Kategorien.'); gewaehlt = gewaehlt.filter(x => x !== k); }
        else { if (gewaehlt.length >= 12) return Kern.hinweis('Höchstens 12 Kategorien.'); gewaehlt.push(k); }
        merken(); zeichnen(); Kern.ton('tipp');
      };
      liste.appendChild(b);
    });
    hint.innerHTML = `<b>${gewaehlt.length}</b> gewählt: ${esc(gewaehlt.join(', '))}`;
  }
  const inp = zeile.querySelector('input');
  const dazu = () => {
    const k = inp.value.replace(/\s+/g, ' ').trim();
    if (!k) return inp.focus();
    if (alle().some(x => L.norm(x) === L.norm(k))) { const vorh = alle().find(x => L.norm(x) === L.norm(k)); if (!gewaehlt.includes(vorh) && gewaehlt.length < 12) gewaehlt.push(vorh); }
    else { if (gewaehlt.length >= 12) return Kern.hinweis('Höchstens 12 Kategorien.'); eigene.push(k); gewaehlt.push(k); }
    inp.value = ''; merken(); zeichnen(); Kern.ton('tipp');
  };
  zeile.querySelector('button').onclick = dazu;
  inp.onkeydown = ev => { if (ev.key === 'Enter') { ev.preventDefault(); dazu(); } };
  merken(); zeichnen();
  return box;
}

function optionenAus(o) { return { runden: o.runden == null ? 5 : o.runden, zeit: o.zeit || 0, ohneSchwer: o.schwer !== 'an' }; }

/* ---------- Bühne ---------- */
function spielZeigen() { if (setupZiel) setupZiel.hidden = true; buehne.hidden = false; GEZEIGT = { rundeId: null, phase: null }; zeichnen(); }
const NETZ = () => !!(Netz.laeuft && S && S.modus === 'netz');
const ICH = () => (NETZ() ? Netz.meinSitz : null);

function zeichnen(opt = {}) {
  if (!S) return;
  const p = S.phase;
  if (p !== 'laeuft') document.body.classList.remove('sl-tastatur');
  if (p === 'bereit') zeigeBereit();
  else if (p === 'laeuft') S.modus === 'netz' ? zeigeNetzLauf(opt) : zeigeLauf(opt);
  else if (p === 'sammeln') zeigeSammeln();
  else if (p === 'wertung') S.modus === 'netz' ? zeigeNetzWertung() : zeigeWertung();
  else if (p === 'ergebnis') zeigeErgebnis();
  else if (p === 'ende') zeigeEnde(opt.feiern);
  GEZEIGT = { rundeId: S.rundeId, phase: p };
}
function rundenText() { return S.optionen.runden ? `Runde ${Math.max(1, S.runde)} von ${S.optionen.runden}` : `Runde ${Math.max(1, S.runde)}`; }
function standHtml() {

function kopfHtml(titel) {

}
function karteHtml(buchstabe, klein) { return `<div class="sl-karte ${buchstabe ? '' : 'leer'}" id="sl-karte"><small>${klein || 'Buchstabe'}</small><b>${esc(buchstabe || '?')}</b></div>`; }

/* ---------- Bereit: Buchstaben auslosen ---------- */
function zeigeBereit() {

  const darf = istHostOderLokal();
  buehne.innerHTML = `${kopfHtml(S.runde ? 'Nächste Runde' : 'Los geht’s')}
    <div class="sl-mitte">
      ${karteHtml(null)}

      ${!NETZ() ? `<p class="sl-satz" style="font-size:15px">Legt Zettel und Stifte bereit. Die Runde beginnt, sobald der Buchstabe steht.</p>` : ''}
    </div>`;
  const los = buehne.querySelector('#sl-los'); if (los) Kern.tap(los, () => Netz.tun('los'));
}
/** Buchstabe rollt kurz durch, bevor er steht. */
function buchstabeRollen(ziel) {
  const k = buehne.querySelector('#sl-karte'); if (!k) return;
  const b = k.querySelector('b');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { b.textContent = ziel; return; }
  k.classList.add('rollt'); k.classList.remove('leer');
  let i = 0; const iv = setInterval(() => {
    b.textContent = L.ALLE[Math.floor(Math.random() * 26)];
    if (++i % 2 === 0) Kern.ton('zeit');
    if (i > 11) { clearInterval(iv); b.textContent = ziel; k.classList.remove('rollt'); void k.offsetWidth; k.classList.add('da'); Kern.ton('runde'); }
  }, 75);
}

/* ---------- Uhr ---------- */
function uhrStart(restMs, nurAnzeige) {
  uhrStopp();
  if (restMs == null) return;
  UHR = { ende: performance.now() + restMs, nurAnzeige: !!nurAnzeige, letzte: null, iv: setInterval(uhrTakt, 200) };
  uhrTakt();
}
function uhrStopp() { if (UHR) { clearInterval(UHR.iv); UHR = null; } }
function uhrTakt() {
  if (!UHR || !S || S.phase !== 'laeuft') return uhrStopp();
  const rest = Math.max(0, UHR.ende - performance.now()), sek = Math.ceil(rest / 1000);
  const u = buehne.querySelector('.sl-uhr');
  if (u) {
    u.querySelector('.sl-zeit').textContent = `${Math.floor(sek / 60)}:${String(sek % 60).padStart(2, '0')}`;
    u.querySelector('.sl-balken i').style.transform = `scaleX(${rest / (S.optionen.zeit * 1000)})`;
    u.classList.toggle('knapp', sek <= 15); u.classList.toggle('sehrknapp', sek <= 5);
  }
  if (sek !== UHR.letzte) { UHR.letzte = sek; if (sek <= 5 && sek > 0) Kern.ton('zeit'); }
  if (rest <= 0) { if (UHR.nurAnzeige) uhrStopp(); else { uhrStopp(); Netz.tun('zeit'); } }
}
const restVonS = () => (S.ende ? Math.max(0, S.ende - Date.now()) : null);
function uhrHtml() { return S.optionen.zeit ? '<div class="sl-uhr"><div class="sl-zeit k-zahl">0:00</div><div class="sl-balken"><i></i></div></div>' : ''; }

/* ---------- Laufende Runde am selben Gerät ---------- */

    <div class="sl-lauf">

        <button class="k-btn sl-stopp" id="sl-stopp">Stopp!</button>
      </div>
    </div>`;
  if (neu) buchstabeRollen(S.buchstabe);

}
function stoppBild(text, unter) {

}

/* ---------- Laufende Runde im Netzspiel ---------- */
function eigeneAntworten() {
  const ich = ICH();
  if (!ENTWURF || ENTWURF.rundeId !== S.rundeId) {
    const vom = S.antworten && S.antworten[ich] ? S.antworten[ich].slice() : S.kategorien.map(() => '');
    ENTWURF = { rundeId: S.rundeId, a: vom, gesendet: false };
  }
  return ENTWURF.a;
}
function zeigeNetzLauf({ neu } = {}) {
  const ich = ICH();
  const gebaut = GEZEIGT.phase === 'laeuft' && GEZEIGT.rundeId === S.rundeId && buehne.querySelector('.sl-netzlauf');
  const a = eigeneAntworten();
  if (!gebaut) {
    buehne.innerHTML = `${kopfHtml('Schreib los!')}
      <div class="sl-netzlauf">
        <div class="sl-links">${karteHtml(neu ? '' : S.buchstabe)}<div class="sl-tipp">${uhrHtml()}<p>Jedes Wort beginnt mit <b>${esc(S.buchstabe)}</b>. Wer zuerst alle Felder hat, ruft Stopp – dann ist die Runde für alle vorbei.</p></div></div>
        <div class="sl-blatt" id="sl-blatt">${S.kategorien.map((k, i) => `<div class="sl-zeile" data-k="${i}"><label for="sl-in-${i}">${esc(k)}</label>
          <input id="sl-in-${i}" maxlength="${L.MAX_TEXT}" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" enterkeyhint="${i === S.kategorien.length - 1 ? 'done' : 'next'}" placeholder="${esc(S.buchstabe)} …"></div>`).join('')}</div>
        <div class="sl-unten"><div class="sl-fort" id="sl-fort"></div><button class="k-btn sl-stopp" id="sl-stopp">Stopp – fertig!</button></div>
      </div>`;
    if (neu) buchstabeRollen(S.buchstabe);
    S.kategorien.forEach((_, i) => {
      const inp = buehne.querySelector('#sl-in-' + i);
      inp.value = a[i] || '';
      inp.addEventListener('input', () => { ENTWURF.a[i] = inp.value; netzFortschritt(); entwurfSenden(); });
      inp.addEventListener('focus', () => setTimeout(() => inp.scrollIntoView({ block: 'nearest' }), 250));
      inp.addEventListener('keydown', ev => {

      if (!S.kategorien.every((_, i) => String(ENTWURF.a[i] || '').trim())) return Kern.hinweis('Erst alle Felder füllen – dann Stopp.');

}
function netzFortschritt() {
  const f = buehne.querySelector('#sl-fort'); if (!f || !S) return;

  const meine = S.kategorien.map((_, i) => String((ENTWURF && ENTWURF.a[i]) || '').trim() !== '');
  buehne.querySelectorAll('.sl-zeile').forEach((z, i) => z.classList.toggle('ok', meine[i]));
  const zahl = i => (i === ich ? meine.filter(Boolean).length : S.fuellung ? S.fuellung[i] : (S.antworten && S.antworten[i] ? S.antworten[i].filter(x => String(x).trim()).length : 0));
  f.innerHTML = S.spieler.map((p, i) => `<span class="${zahl(i) === n ? 'voll' : ''}" style="--pc:${farbe(i)}"><span class="k-dot">${esc(p.name.charAt(0).toUpperCase())}</span>${i === ich ? 'du' : esc(p.name)} ${zahl(i)}/${n}</span>`).join('');
  const st = buehne.querySelector('#sl-stopp'); if (st) st.classList.toggle('bereit', meine.every(Boolean));

function entwurfSenden(sofort) {

  if (sofort) los(); else sendeTimer = setTimeout(los, Netz.istHost ? 300 : 600);

/* Bildschirmtastatur: Bühne auf den sichtbaren Bereich verkleinern, damit das Feld nicht unter der Tastatur liegt. */
if (window.visualViewport) {
  const vv = visualViewport;
  const anpassen = () => {
    const offen = S && S.phase === 'laeuft' && S.modus === 'netz' && vv.height < innerHeight - 120;
    document.body.classList.toggle('sl-tastatur', !!offen);
    if (offen) { buehne.style.bottom = 'auto'; buehne.style.top = vv.offsetTop + 'px'; buehne.style.height = vv.height + 'px'; }
    else { buehne.style.bottom = ''; buehne.style.top = ''; buehne.style.height = ''; }
  };
  vv.addEventListener('resize', anpassen); vv.addEventListener('scroll', anpassen);
}

/* ---------- Einsammeln (Netz) ---------- */
function zeigeSammeln() {
  uhrStopp();
  if (!Netz.istHost && ENTWURF && ENTWURF.rundeId === S.rundeId && !ENTWURF.gesendet) {   // eigene Antworten endgültig abgeben
    ENTWURF.gesendet = true; clearTimeout(sendeTimer);
    Netz.tun('abgabe', { a: ENTWURF.a.slice(), r: S.rundeId, fertig: true });
  }
  const wer = S.grund === 'zeit' ? 'Die Zeit ist um.' : `${S.stopper === ICH() ? 'Du bist' : esc(name(S.stopper)) + ' ist'} fertig.`;
  buehne.innerHTML = `${kopfHtml('Stopp!')}<div class="sl-mitte">${karteHtml(S.buchstabe)}<h2 style="font-size:clamp(34px,5vw,52px)">Stifte weg!</h2>
    <p class="sl-satz">${wer} Die Antworten werden eingesammelt …</p></div>`;
}

/* ---------- Wertung am selben Gerät: ankreuzen ---------- */
function zeigeWertung() {
  uhrStopp();
  const k = Math.min(ANSICHT.tab, S.kategorien.length - 1);
  ANSICHT.besucht[k] = true;
  const pk = L.punkteKreuze(S.spieler.map((_, sp) => S.status[sp][k]));
  const letzte = k === S.kategorien.length - 1;
  const tabs = buehne.querySelector('.sl-tabs'), rollX = tabs ? tabs.scrollLeft : 0;
  buehne.innerHTML = `${kopfHtml(`Wertung · Buchstabe ${esc(S.buchstabe)}`)}
    <div class="sl-wert schmal">
      <div class="sl-tabs">${S.kategorien.map((n, i) => `<button class="${i === k ? 'an' : ''} ${ANSICHT.besucht[i] ? 'fertig' : ''}" data-tab="${i}">${esc(n)}</button>`).join('')}</div>
      <div class="sl-kattitel"><h3>${esc(S.kategorien[k])}</h3><span>mit <b>${esc(S.buchstabe)}</b> · ${k + 1} von ${S.kategorien.length}</span></div>
      <div class="sl-liste">${S.spieler.map((p, sp) => {
        const st = S.status[sp][k];
        return `<div class="sl-wz"><div class="sl-wer"><span class="k-dot" style="--pc:${farbe(sp)}">${esc(p.name.charAt(0).toUpperCase())}</span><span>${esc(p.name)}</span></div>
          <div class="k-seg">${[['leer', 'Leer'], ['eigen', 'Eigene'], ['doppelt', 'Doppelt']].map(([w, t]) => `<button data-sp="${sp}" data-st="${w}" id="sl-st-${sp}-${w}" aria-pressed="${st === w}">${t}</button>`).join('')}</div>
          <div class="sl-pk k-zahl ${pk[sp] === 0 ? 'null' : pk[sp] === 20 ? 'max' : ''}">${pk[sp]}</div></div>`;
      }).join('')}</div>
      <div class="sl-wfuss"><p class="sl-satz">Lest <b>${esc(S.kategorien[k])}</b> vor und kreuzt an, was leer, ungültig oder doppelt ist.</p>
        <div class="sl-reihe">${k > 0 ? '<button class="k-btn leise" id="sl-zurueck">Zurück</button>' : ''}${letzte ? '<button class="k-btn" id="sl-uebernehmen">Wertung übernehmen</button>' : `<button class="k-btn" id="sl-vor">${esc(S.kategorien[k + 1])} →</button>`}</div></div>
    </div>`;
  const t2 = buehne.querySelector('.sl-tabs'); t2.scrollLeft = rollX;
  const an = t2.querySelector('.an'); if (an && (an.offsetLeft < t2.scrollLeft || an.offsetLeft + an.offsetWidth > t2.scrollLeft + t2.clientWidth)) t2.scrollLeft = an.offsetLeft - 20;
  buehne.querySelectorAll('[data-tab]').forEach(b => Kern.tap(b, () => { ANSICHT.tab = +b.dataset.tab; Kern.ton('tipp'); zeigeWertung(); }));
  buehne.querySelectorAll('.sl-wz [data-st]').forEach(b => Kern.tap(b, () => Netz.tun('status', { sp: +b.dataset.sp, k, st: b.dataset.st })));
  const z = buehne.querySelector('#sl-zurueck'); if (z) Kern.tap(z, () => { ANSICHT.tab = k - 1; zeigeWertung(); });
  const v = buehne.querySelector('#sl-vor'); if (v) Kern.tap(v, () => { ANSICHT.tab = k + 1; Kern.ton('tipp'); zeigeWertung(); });
  const u = buehne.querySelector('#sl-uebernehmen'); if (u) Kern.tap(u, () => Netz.tun('werten'));
}

/* ---------- Wertung im Netzspiel: alle Antworten nebeneinander ---------- */
const GRUND = { buchstabe: 'falscher Anfangsbuchstabe', einspruch: 'gestrichen nach Einspruch', gastgeber: 'vom Gastgeber gestrichen', gilt: 'vom Gastgeber anerkannt' };
function zeigeNetzWertung() {
  uhrStopp();
  const ich = ICH(), host = Netz.istHost;
  const r = buehne.querySelector('.sl-raster'), roll = r ? r.scrollTop : 0;
  const summe = S.spieler.map(() => 0);
  const karten = S.kategorien.map((kn, k) => {
    const w = L.kategorieWerten(S, k);
    w.forEach((c, sp) => { summe[sp] += c.punkte; });
    return `<div class="sl-kk"><h3>${esc(kn)}</h3>${w.map((c, sp) => {
      const mein = S.einspruch[sp][k].includes(ich);
      const unter = c.leer ? '' : c.grund && GRUND[c.grund] ? GRUND[c.grund] : '';
      return `<button class="sl-an ${c.leer ? 'leer' : ''} ${c.ungueltig ? 'raus' : ''} ${sp === ich ? 'ich' : ''} ${mein ? 'meinein' : ''}" data-sp="${sp}" data-k="${k}" id="sl-an-${sp}-${k}">
        <span class="k-dot" style="--pc:${farbe(sp)}">${esc(name(sp).charAt(0).toUpperCase())}</span>
        <span class="sl-txt">${c.leer ? '—' : `<b>${esc(c.text)}</b>`}${c.doppelt ? '<span class="sl-dop">doppelt</span>' : ''}${c.stimmen ? `<span class="sl-stim">${c.stimmen}× Einspruch</span>` : ''}<small>${esc(name(sp))}${unter ? ' · ' + esc(unter) : ''}</small></span>
        <span class="sl-pk k-zahl ${c.punkte === 0 ? 'null' : c.punkte === 20 ? 'max' : ''}">${c.punkte}</span></button>`;
    }).join('')}</div>`;
  }).join('');
  buehne.innerHTML = `${kopfHtml(`Wertung · Buchstabe ${esc(S.buchstabe)}`)}
    <div class="sl-wert">
      <div class="sl-raster">${karten}</div>
      <div class="sl-wfuss"><p class="sl-satz">${host ? 'Tippe eine Antwort an, um sie gelten zu lassen oder zu streichen.' : `Tippe eine fremde Antwort an für <b>Einspruch</b>. ${esc(name(0))} übernimmt die Wertung.`}
        <br>Diese Runde: ${S.spieler.map((p, i) => `${esc(p.name)} <b>${summe[i]}</b>`).join(' · ')}</p>
        ${host ? '<div class="sl-reihe"><button class="k-btn" id="sl-uebernehmen">Wertung übernehmen</button></div>' : ''}</div>
    </div>`;
  buehne.querySelector('.sl-raster').scrollTop = roll;
  buehne.querySelectorAll('.sl-an').forEach(b => Kern.tap(b, () => {
    const sp = +b.dataset.sp, k = +b.dataset.k;
    if (b.classList.contains('leer')) return;
    if (sp === ich && !host) return Kern.hinweis('Das ist deine Antwort.');
    Kern.ton('tipp'); Netz.tun('tippe', { sp, k });
  }));
  const u = buehne.querySelector('#sl-uebernehmen'); if (u) Kern.tap(u, () => Netz.tun('werten'));
}

/* ---------- Rundenergebnis ---------- */
function tabelleRunde(v) {
  const max = Math.max(...S.gesamt);
  return `<div class="sl-tabhuelle"><table class="sl-tab"><thead><tr><th>Name</th>${S.kategorien.map(k => `<th>${esc(k)}</th>`).join('')}<th>Runde</th><th>Gesamt</th></tr></thead><tbody>
    ${S.spieler.map((p, i) => `<tr class="${S.gesamt[i] === max && max > 0 ? 'vorn' : ''}"><td><span class="k-dot" style="--pc:${farbe(i)}">${esc(p.name.charAt(0).toUpperCase())}</span>${esc(p.name)}</td>
      ${v.punkte[i].map((x, k) => `<td class="${x === 20 ? 'z20' : x === 0 ? 'z0' : ''}" title="${v.antworten ? esc(v.antworten[i][k] || '') : ''}">${x}</td>`).join('')}
      <td class="sum">+${v.summe[i]}</td><td class="ges">${S.gesamt[i]}</td></tr>`).join('')}</tbody></table></div>`;
}
function zeigeErgebnis() {
  uhrStopp();
  const v = S.verlauf[S.verlauf.length - 1];
  const letzte = L.letzteRunde(S), darf = istHostOderLokal();
  buehne.innerHTML = `${kopfHtml(`Ergebnis · Buchstabe ${esc(v.buchstabe)}`)}
    <div class="sl-mitte">
      <p class="sl-satz">${(() => { const m = Math.max(...v.summe), w = S.spieler.map((_, i) => i).filter(i => v.summe[i] === m); return `Die meisten Punkte dieser Runde: <b>${esc(w.map(name).join(' und '))}</b> mit ${pkt(m)}.`; })()}</p>
      ${tabelleRunde(v)}
      <div class="sl-reihe">${darf ? `<button class="k-btn gross" id="sl-weiter">${letzte ? 'Zum Endstand' : 'Nächste Runde'}</button>${!letzte ? `<button class="k-btn gross leise" id="sl-schluss">${S.optionen.runden ? 'Jetzt beenden' : 'Spiel beenden'}</button>` : ''}`
        : `<p class="sl-satz">${esc(name(0))} entscheidet, wie es weitergeht.</p>`}</div>
    </div>`;
  const w = buehne.querySelector('#sl-weiter'); if (w) Kern.tap(w, () => Netz.tun('weiter', { ende: false }));
  const s = buehne.querySelector('#sl-schluss'); if (s) Kern.tap(s, async () => {
    const ja = await Kern.frage({ titel: 'Spiel beenden?', text: 'Der aktuelle Stand wird zum Endstand.', knoepfe: [{ text: 'Weiterspielen', wert: false, art: 'leise' }, { text: 'Beenden', wert: true }] });
    if (ja) Netz.tun('weiter', { ende: true });
  });
}

/* ---------- Spielende ---------- */
function zeigeEnde(feiern) {
  uhrStopp();
  const sg = L.sieger(S), reihe = S.spieler.map((p, i) => i).sort((a, b) => S.gesamt[b] - S.gesamt[a]);
  const titel = sg.length > 1 ? `Gleichstand: ${sg.map(name).join(' und ')}` : `${name(sg[0])} gewinnt`;
  buehne.innerHTML = `${kopfHtml('Spielende')}
    <div class="sl-mitte">
      <h1 class="sl-sieger">${esc(titel)}</h1>
      <div class="sl-podest">${reihe.map((i, r) => `<div class="${sg.includes(i) ? 'erst' : ''}" style="--pc:${farbe(i)}"><small>${r + 1}. Platz</small><b class="k-zahl">${S.gesamt[i]}</b>${esc(name(i))}</div>`).join('')}</div>
      <div class="sl-tabhuelle"><table class="sl-tab"><thead><tr><th>Runde</th>${S.spieler.map(p => `<th>${esc(p.name)}</th>`).join('')}</tr></thead><tbody>
        ${S.verlauf.map(v => `<tr><td>${v.runde} · ${esc(v.buchstabe)}</td>${v.summe.map(x => `<td>${x}</td>`).join('')}</tr>`).join('')}
        <tr><td><b>Gesamt</b></td>${S.gesamt.map(x => `<td class="ges">${x}</td>`).join('')}</tr></tbody></table></div>
      <div class="sl-reihe">${NETZ() && !Netz.istHost ? `<p class="sl-satz">${esc(name(0))} entscheidet, wie es weitergeht.</p>` : '<button class="k-btn gross" id="sl-nochmal">Nochmal</button><button class="k-btn gross leise" id="sl-neu">Neues Spiel</button>'}</div>
    </div>`;
  if (feiern) { Kern.feier(); Kern.ton('sieg'); }
  const nm = buehne.querySelector('#sl-nochmal'); if (nm) Kern.tap(nm, () => Netz.tun('nochmal'));
  const ne = buehne.querySelector('#sl-neu'); if (ne) Kern.tap(ne, () => { if (Netz.aktiv) Netz.verlassen(); Kern.speicher.loeschen(); startseite(); });
}

/* ---------- Züge (ohne Netz direkt, im Netz beim Gastgeber) ---------- */
function losAusfuehren() {
  L.rundeStarten(S, Kern.zufall, Date.now());
  ANSICHT = { tab: 0, besucht: {} };
  if (S.modus === 'netz') ENTWURF = { rundeId: S.rundeId, a: S.kategorien.map(() => ''), gesendet: false };
  speichern(); zeichnen({ neu: true });
  Netz.melden();
}
function stoppAusfuehren(sp, grund) {
  if (S.modus === 'netz' && ENTWURF && ENTWURF.rundeId === S.rundeId && S.phase === 'laeuft') { clearTimeout(sendeTimer); L.abgabe(S, 0, ENTWURF.a, true); }   // eigene Felder des Gastgebers
  if (!L.stopp(S, sp, grund)) return false;
  uhrStopp();
  Kern.ton('gong'); if (navigator.vibrate) try { navigator.vibrate(200); } catch (e) {}
  const unter = grund === 'zeit' ? 'Die Zeit ist um.' : sp != null ? `${name(sp)} ist fertig.` : '';
  stoppBild(grund === 'zeit' ? 'Zeit!' : 'Stopp!', unter);
  if (S.modus === 'netz') {
    Netz.ereignis({ ton: 'gong', daten: { stopp: grund === 'zeit' ? 'Zeit!' : 'Stopp!', unter } });
    S.abgegeben[0] = true;
    clearTimeout(sammelTimer);
    sammelTimer = setTimeout(sammelnFertig, 4000);   // wer nicht antwortet, behält seinen letzten Stand
    if (L.alleAbgegeben(S)) sammelnFertig();
  }
  speichern(); zeichnen(); Netz.melden();
  return true;
}
function sammelnFertig() { clearTimeout(sammelTimer); if (S && L.zurWertung(S)) { zeichnen(); Netz.melden(); } }

Netz.einrichten({
  spiel: 'stadtlandfluss', min: 2, max: 8,
  starten(spieler, optionen) {
    S = L.neu({ spieler: spieler.map(p => ({ name: p.name, farbe: p.farbe })), kategorien: kategorienAktuell(), optionen: optionenAus(optionen), modus: 'netz' });
    document.body.classList.add('sl-netz');
    spielZeigen();
  },
  aktion(nm, d, sitz) {
    if (!S) return;
    const netz = sitz !== null && S.modus === 'netz';
    const nein = () => { if (sitz !== null) Netz.melden(sitz); };
    const nurHost = netz && sitz !== 0;
    switch (nm) {
      case 'los': if (S.phase !== 'bereit' || nurHost) return nein(); return losAusfuehren();
      case 'abgabe': {
        if (S.modus !== 'netz' || d.r !== S.rundeId) return nein();
        const wer = sitz === null ? 0 : sitz;
        if (!L.abgabe(S, wer, d.a, !!d.fertig)) return nein();
        if (S.phase === 'sammeln') { if (L.alleAbgegeben(S)) sammelnFertig(); return; }
        netzFortschritt();
        Netz.melden();
        return;
      }
      case 'stopp': {
        if (S.phase !== 'laeuft') return nein();
        if (S.modus === 'netz') {
          const wer = sitz === null ? 0 : sitz;
          if (!Array.isArray(d.a) || d.r !== S.rundeId) return nein();
          if (!S.kategorien.every((_, k) => String(d.a[k] == null ? '' : d.a[k]).trim() !== '')) return nein();   // erst alles gefüllt, dann Stopp
          L.abgabe(S, wer, d.a, true);
          if (!stoppAusfuehren(wer, 'stopp')) return nein();
          return;
        }
        return stoppAusfuehren(null, 'stopp');
      }
      case 'zeit': if (S.phase !== 'laeuft' || nurHost) return nein(); return stoppAusfuehren(null, 'zeit');
      case 'status': if (S.modus !== 'lokal' || !L.statusSetzen(S, d.sp, d.k, d.st)) return nein(); Kern.ton('tipp'); speichern(); return zeigeWertung();
      case 'tippe': {
        if (S.modus !== 'netz' || S.phase !== 'wertung') return nein();
        const wer = sitz === null ? 0 : sitz;
        const ok = wer === 0 ? L.entscheiden(S, d.sp, d.k) : L.einspruchUmschalten(S, wer, d.sp, d.k);
        if (!ok) return nein();
        zeichnen(); Netz.melden(); return;
      }
      case 'werten': if (S.phase !== 'wertung' || nurHost) return nein(); L.rundeAbschliessen(S); speichern(); Kern.ton('punkt'); zeichnen(); Netz.melden(); return;
      case 'weiter': {
        if (S.phase !== 'ergebnis' || nurHost) return nein();
        L.weiter(S, !!d.ende);
        if (S.phase === 'ende') { Kern.speicher.loeschen(); zeichnen({ feiern: true }); Netz.melden(); Netz.ereignis({ ton: 'sieg', feier: true }); }
        else { speichern(); zeichnen(); Netz.melden(); }
        return;
      }
      case 'nochmal': {
        if (S.phase !== 'ende' || nurHost) return nein();
        S = L.neu({ spieler: S.spieler, kategorien: S.kategorien, optionen: S.optionen, modus: S.modus });
        speichern(); spielZeigen(); Netz.melden(); return;
      }
    }
  },
  zustand(sitz) {
    if (!S) return { warte: true };
    const k = JSON.parse(JSON.stringify(S));
    if (S.antworten && (S.phase === 'laeuft' || S.phase === 'sammeln')) {   // fremde Antworten erst nach dem Stopp
      k.fuellung = S.antworten.map(r => r.filter(a => String(a).trim()).length);
      k.antworten = S.antworten.map((r, i) => (i === sitz ? r : null));
    }
    if (S.ende) { k.restMs = Math.max(0, S.ende - Date.now()); }
    return k;
  },
  stand(d) {
    if (!d || d.warte) return;
    const alt = S;
    const neuRunde = !alt || alt.rundeId !== d.rundeId;
    S = d;
    document.body.classList.add('sl-netz');
    if (setupZiel) setupZiel.hidden = true;
    buehne.hidden = false;
    if (S.phase === 'laeuft' && neuRunde) { ENTWURF = null; GEZEIGT = { rundeId: null, phase: null }; zeichnen({ neu: alt && alt.phase === 'bereit' }); return; }
    zeichnen();
  },
  ereignis(d) { if (d && d.stopp) stoppBild(d.stopp, d.unter); },
  beendet() { document.body.classList.remove('sl-netz'); startseite(); },
});

addEventListener('pagehide', () => { if (S && !NETZ()) speichern(); });
window.__test = { zustand: () => S, uhrSetzen: ms => { if (UHR) UHR.ende = performance.now() + ms; if (S && S.ende && !UHR?.nurAnzeige) S.ende = Date.now() + ms; }, entwurf: () => ENTWURF };
startseite();
</script>
</body>
</html>
