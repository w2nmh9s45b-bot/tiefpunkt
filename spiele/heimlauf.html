<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="icon" href="../icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c2430">
<title>Heimlauf · Spieltisch</title>
<link rel="stylesheet" href="../gemeinsam/kern.css">
<style>
/* Heimlauf: links das Brett (Kreuzbrett mit Windrose in der Mitte), rechts Spieler, Würfelschale und Lage. Präfix .hl- */
.hl-buehne{display:grid;grid-template-columns:320px minmax(0,1fr);grid-template-areas:'seite brett';gap:16px}
.hl-brett{grid-area:brett;position:relative;min-width:0;min-height:0;display:grid;place-items:center}
.hl-svg{width:100%;height:100%;display:block;touch-action:none;filter:drop-shadow(0 18px 30px rgba(0,0,0,.45))}
.hl-seite{grid-area:seite;display:flex;flex-direction:column;gap:14px;padding-top:62px;min-height:0}
.hl-spieler{display:flex;flex-direction:column;gap:8px}
.hl-pl{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:16px;background:var(--panel);border:2px solid var(--line);transition:border-color .3s,box-shadow .3s,background-color .3s}
.hl-pl.am{border-color:var(--pc);background:rgba(9,32,42,.92);box-shadow:0 0 22px color-mix(in srgb,var(--pc) 35%,transparent)}
.hl-pl.fertig{opacity:.75}
.hl-pl .k-dot{width:28px;height:28px;font-size:14px}
.hl-pl .nm{flex:1;min-width:0;font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hl-pl .du{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2);margin-left:6px}
.hl-pips{display:flex;gap:4px;flex:none}
.hl-pips i{width:11px;height:11px;border-radius:50%;box-shadow:inset 0 0 0 2px var(--pc);display:block}
.hl-pips i.voll{background:var(--pc)}
.hl-platz{flex:none;font-family:var(--f-disp);font-weight:800;color:var(--pc);font-size:17px}
.hl-schale{position:relative;flex:1 1 auto;min-height:190px;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px;
  background:radial-gradient(ellipse at 50% 32%,#1f4f5c,#0d2a33 78%);box-shadow:inset 0 0 0 2px rgba(255,255,255,.07),inset 0 18px 40px rgba(0,0,0,.35);border:2px solid transparent;transition:border-color .3s}
.hl-schale.am{border-color:color-mix(in srgb,var(--pc) 70%,transparent)}
.hl-wbox{border:0;background:none;padding:6px;border-radius:24px;display:grid;place-items:center}
.hl-wbox .k-wuerfel{--ww:92px;padding:calc(var(--ww)*.14)}
.hl-wbox .k-wuerfel{box-shadow:0 0 0 4px var(--wc,transparent),inset 0 -4px 0 rgba(0,0,0,.12),0 8px 18px rgba(0,0,0,.4)}
.hl-wbox.leer .k-wuerfel i{visibility:hidden!important}
.hl-wbox.leer .k-wuerfel{opacity:.35}
.hl-wbox.lockt{animation:hl-lock 1.6s ease-in-out infinite}
@keyframes hl-lock{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.hl-satz{font-size:18px;line-height:1.3;text-align:center;font-weight:700;text-wrap:balance;max-width:28ch;min-height:2.6em;display:flex;align-items:center}
.hl-satz.leise{color:var(--ink2);font-weight:400}
.hl-versuch{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--ink2);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.hl-versuch i{width:10px;height:10px;border-radius:50%;background:var(--akzent);display:block}
.hl-versuch i.weg{background:transparent;box-shadow:inset 0 0 0 2px rgba(255,255,255,.3)}
.hl-knopf{width:100%}
.hl-knopf.k-btn{background:var(--pc,var(--akzent));color:#10232a}
/* SVG */
.hl-feld{fill:#fffdf6;stroke:#7d6c50;stroke-width:3.5}
.hl-weg{fill:none;stroke:#dccaa4;stroke-width:22;stroke-linejoin:round}
.hl-weg2{fill:none;stroke:#efe2c4;stroke-width:8;stroke-linejoin:round;stroke-dasharray:1 26;stroke-linecap:round}
.hl-ziel{stroke-width:4}
.hl-figur{pointer-events:none}
.hl-wahl{fill:none;stroke:#fff;stroke-width:6;pointer-events:none;animation:hl-puls 1.1s ease-in-out infinite}
.hl-zielring{fill:none;stroke-width:5;stroke-dasharray:9 8;pointer-events:none;animation:hl-dreh 6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes hl-puls{0%,100%{opacity:1}50%{opacity:.35}}
@keyframes hl-dreh{to{transform:rotate(360deg)}}
.hl-hit{fill:transparent;cursor:pointer}
.hl-ende{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:10px;z-index:5;width:max-content;max-width:calc(100% - 16px)}
/* iPad hoch: Brett oben, darunter Spieler | Würfelschale nebeneinander */
@media (max-aspect-ratio:1/1){
  .hl-buehne{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;grid-template-areas:'brett' 'seite'}
  .hl-brett{padding-top:52px}
  .hl-seite{padding-top:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:14px}
  .hl-schale{min-height:0}
}
/* Telefon hoch: Spieler als Chips, Würfel und Knopf nebeneinander */
@media (max-width:700px){
  .hl-buehne{gap:10px}
  .hl-brett{padding-top:50px}
  .hl-seite{grid-area:seite;display:flex;flex-direction:column;gap:10px}
  .hl-spieler{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .hl-pl{padding:6px 9px;gap:7px;border-radius:13px}
  .hl-pl .k-dot{width:22px;height:22px;font-size:12px}
  .hl-pl .nm{font-size:15px}
  .hl-pl .du{display:none}
  .hl-pips i{width:9px;height:9px}
  .hl-schale{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:8px 14px;padding:10px 12px;border-radius:20px;min-height:0}
  .hl-wbox{padding:2px}
  .hl-wbox .k-wuerfel{--ww:66px}
  .hl-mitte{display:flex;flex-direction:column;gap:8px;flex:1 1 180px;min-width:0}
  .hl-satz{font-size:16px;min-height:2.6em;justify-content:center}
  .hl-knopf.k-btn{min-height:48px;font-size:18px}
}
@media (min-width:701px){.hl-mitte{display:contents}}
</style>
</head>
<body class="chart">
<script src="../gemeinsam/kern.js"></script>
<script src="../gemeinsam/netz.js"></script>
<script src="heimlauf.logik.js"></script>
<script>
"use strict";
const H = window.Heimlauf;
const REGELN = `
<h3>Ziel</h3><p>Bringe als Erste oder Erster alle vier Figuren einmal rund ums Brett und in deine vier Zielfelder.</p>
<h3>Aufbau</h3><p>Jede Person hat eine Ecke mit Haus. Zu Beginn steht eine Figur auf deinem farbigen Startfeld, die drei anderen warten im Haus.</p>
<h3>Ziehen</h3><p>Wer dran ist, würfelt und zieht eine eigene Figur genau um die Augenzahl im Uhrzeigersinn vor. Andere Figuren darfst du überspringen, die Felder zählen mit. Auf jedem Feld steht nur eine Figur – auf eine eigene kannst du nicht ziehen.</p>
<h3>Schlagen</h3><p>Landest du genau auf einer fremden Figur, schlägst du sie: Sie muss zurück in ihr Haus. Du musst nicht schlagen.</p>
<h3>Die Sechs</h3><p>Aus dem Haus kommt eine Figur nur mit einer 6 auf dein Startfeld – und solange Figuren im Haus warten, musst du mit einer 6 eine herausholen. Steht schon eine eigene Figur auf dem Startfeld, zieht zuerst sie mit der 6 weiter. Eine fremde Figur dort wird geschlagen. Nach einer 6 würfelst du noch einmal.</p>
<h3>Startfeld freimachen</h3><p>Solange noch Figuren im Haus warten, darf keine eigene Figur auf deinem Startfeld stehen bleiben. Sie zieht weiter, sobald sie kann.</p>
<h3>Ins Ziel</h3><p>Nach einer ganzen Runde geht es in die eigenen Zielfelder. Sie werden einzeln gezählt, du brauchst einen passenden Wurf – darüber hinaus geht es nicht. Im Ziel darfst du Figuren überspringen.</p>
<h3>Ende</h3><p>Wer zuerst alle vier Figuren im Ziel hat, gewinnt. Danach könnt ihr um die weiteren Plätze weiterspielen. Kann niemand ziehen, ist die nächste Person dran.</p>
<h3>Zusatzregeln (auf der Startseite wählbar)</h3><ul><li><b>Dreimal würfeln:</b> Wer keine Figur auf der Laufbahn hat und im Ziel nicht mehr vorrücken kann, hat drei Versuche für eine 6.</li>
<li><b>Schlagzwang:</b> Kannst du schlagen, musst du es. Das Spiel bietet dann nur Schlagzüge an; Herauskommen und Startfeld freimachen gehen vor.</li>
<li><b>Überspringen im Ziel verboten:</b> In den Zielfeldern darfst du keine eigene Figur überspringen.</li></ul>
<h3>Bedienung</h3><p>Tippe auf den Würfel. Danach leuchten die Figuren, die ziehen dürfen, und ein gestrichelter Ring zeigt ihr Ziel. Tippe die Figur oder ihr Ziel an.</p>`;
const SVGNS = 'http://www.w3.org/2000/svg', Z = 100, M = c => c * Z + 50;
let S = null, namen = [], farben = [], opt = {}, busy = false, stage = null, setupZiel = null, ENDE_FE = null;
const TEST = {wuerfe: []};
const $ = id => document.getElementById(id);
const w6 = () => TEST.wuerfe.length ? TEST.wuerfe.shift() : 1 + Kern.zufall(6);
const ich = () => (Netz.laeuft ? Netz.meinSitz : null);
const leitet = () => !Netz.laeuft || Netz.istHost;
// Netzspiel: Das Brett dreht sich, bis die eigene Ecke unten links liegt.
const winkel = () => (Netz.laeuft && S ? -90 * S.ecke[Netz.meinSitz] : 0);

function bild() {
  const k = (x, y, f) => `<circle cx="${x}" cy="${y}" r="7.5" fill="${f}" stroke="#7d6c50" stroke-width="1.6"/>`;
  let h = '<rect x="2" y="2" width="136" height="136" rx="22" fill="#f3ead6"/>';
  const bahn = H.BRETT.bahn; bahn.forEach(([x, y], i) => { h += k(15 + x * 11, 15 + y * 11, i % 10 === 0 ? Kern.farben[i / 10] : '#fffdf6'); });
  H.BRETT.ziel.forEach((z, e) => z.forEach(([x, y]) => { h += k(15 + x * 11, 15 + y * 11, Kern.farben[e]); }));
  return `<svg width="140" height="140" viewBox="0 0 140 140">${h}</svg>`;
}

function startseite() {
  if (stage) { stage.remove(); stage = null; }
  if (ENDE_FE) { ENDE_FE.schliessen(); ENDE_FE = null; }
  document.querySelectorAll('.k-scroll').forEach(e => e.remove());
  const g = Kern.speicher.laden(), ok = g && g.S && g.S.phase !== 'ende';
  const s = Kern.setup({
    titel: 'Heimlauf', unter: 'Würfeln, rauskommen, rundherum und ab nach Hause – aber Vorsicht vor den anderen Figuren.',
    bild: bild(), fakten: ['2 bis 4 Personen', 'ca. 30 Minuten'],
    spieler: {min: 2, max: 4, standard: 4, namenLabel: 'Namen, Ecken im Uhrzeigersinn ab unten links'},
    optionen: [
      {id: 'dreimal', label: 'Dreimal würfeln, wenn keine Figur läuft', standard: 'aus', werte: [{wert: 'aus', text: 'Nein (Grundregel)'}, {wert: 'an', text: 'Ja, drei Versuche'}]},
      {id: 'schlagzwang', label: 'Schlagzwang', standard: 'aus', werte: [{wert: 'aus', text: 'Nein (Grundregel)'}, {wert: 'an', text: 'Ja, schlagen ist Pflicht'}]},
      {id: 'zielsprung', label: 'Im Ziel überspringen', standard: 'erlaubt', werte: [{wert: 'erlaubt', text: 'Erlaubt (Grundregel)'}, {wert: 'verboten', text: 'Verboten'}]},
      {id: 'start', label: 'Wer beginnt?', standard: '0', werte: [{wert: '0', text: 'Spieler 1'}, {wert: 'zufall', text: 'Zufall'}]},
    ],
    fortsetzen: ok ? `${g.S.n} Personen · ${g.namen[g.S.am]} ist dran` : null,
    onFortsetzen: () => beginnen(g),
    onStart: ({anzahl, namen: n, farben: f, optionen}) => {
      const start = optionen.start === 'zufall' ? Kern.zufall(anzahl) : 0;
      beginnen({S: H.neu({anzahl, optionen, start}), namen: n, farben: f, opt: optionen});
    },
  });
  setupZiel = s.ziel;
}
function beginnen(d) {
  S = d.S; namen = d.namen; farben = d.farben; opt = d.opt || {}; busy = false;
  if (setupZiel) { setupZiel.remove(); setupZiel = null; }
  speichern(); aufbauen(); zeichne(); Netz.melden();
  if (S.phase === 'ende') setTimeout(ende, 300);
}
function speichern() { if (S.phase === 'ende') Kern.speicher.loeschen(); else Kern.speicher.speichern({S, namen, farben, opt}); }

/* ---------- Brett ---------- */
function farbeEcke(e) { const p = S.ecke.indexOf(e); return p >= 0 ? farben[p] : null; }
function aufbauen() {
  if (stage) stage.remove();
  stage = Kern.el('div', 'k-buehne hl-buehne' + (Netz.laeuft ? ' hl-netz' : ''));
  stage.innerHTML = `<div class="hl-brett" id="hl-brett"></div><div class="hl-seite"><div class="hl-spieler" id="hl-spieler"></div>
    <div class="hl-schale" id="hl-schale"><button class="hl-wbox" id="hl-wbox" aria-label="Würfeln"></button><div class="hl-mitte"><div class="hl-versuch" id="hl-versuch"></div>
    <div class="hl-satz" id="hl-satz"></div><button class="k-btn gross hl-knopf" id="hl-knopf">Würfeln</button></div></div></div>`;
  document.body.appendChild(stage);
  const wb = $('hl-wbox'); wb.appendChild(Kern.wuerfel(S.letzterWurf ? S.letzterWurf.w : 6));
  Kern.tap(wb, tippeWuerfel); Kern.tap($('hl-knopf'), tippeWuerfel);
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('viewBox', '-10 -10 1120 1120'); svg.setAttribute('class', 'hl-svg'); svg.id = 'hl-svg';
  svg.innerHTML = brettSvg(); $('hl-brett').appendChild(svg);
  svg.querySelectorAll('.hl-hit').forEach(h => Kern.tap(h, () => tippeFeld(h.dataset.k)));
}
function brettSvg() {
  const B = H.BRETT, hell = c => `color-mix(in srgb,${c} 28%,#fbf4e4)`;
  let defs = '<defs><radialGradient id="hl-platte" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#fbf4e4"/><stop offset="1" stop-color="#ead9b6"/></radialGradient>';
  farben.forEach((f, p) => { defs += `<radialGradient id="hl-g${p}" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="color-mix(in srgb,${f} 45%,#fff)"/><stop offset=".55" stop-color="${f}"/><stop offset="1" stop-color="color-mix(in srgb,${f} 62%,#000)"/></radialGradient>`; });
  defs += '</defs>';
  let h = `<rect x="0" y="0" width="1100" height="1100" rx="70" fill="url(#hl-platte)"/><rect x="14" y="14" width="1072" height="1072" rx="58" fill="none" stroke="#c9b48a" stroke-width="3"/>`;
  // Häuser in den Ecken: ein Häuschen je Farbe
  for (let e = 0; e < 4; e++) {
    const c = farbeEcke(e), hs = B.haus[e], xs = hs.map(p => p[0]), ys = hs.map(p => p[1]);
    const x0 = Math.min(...xs) * Z, y0 = Math.min(...ys) * Z;
    const f = c ? hell(c) : 'rgba(125,108,80,.08)', st = c || '#cdbb96';
    h += `<rect x="${x0 + 6}" y="${y0 + 6}" width="188" height="188" rx="36" fill="${f}" stroke="${st}" stroke-width="4" ${c ? '' : 'stroke-dasharray="10 10"'}/>`;
  }
  // Weg
  h += `<polygon class="hl-weg" points="${B.bahn.map(([x, y]) => M(x) + ',' + M(y)).join(' ')}"/>`;
  h += `<polygon class="hl-weg2" points="${B.bahn.map(([x, y]) => M(x) + ',' + M(y)).join(' ')}"/>`;
  // Zielbahnen
  for (let e = 0; e < 4; e++) { const c = farbeEcke(e), z = B.ziel[e]; const a = B.bahn[(e * 10 + 39) % 40];
    h += `<polyline points="${[a, ...z].map(([x, y]) => M(x) + ',' + M(y)).join(' ')}" fill="none" stroke="${c ? hell(c) : '#e3d4b2'}" stroke-width="22" stroke-linecap="round"/>`; }
  // Windrose in der Mitte
  h += windrose();
  // Felder
  B.bahn.forEach(([x, y], i) => {
    const start = i % 10 === 0, c = start ? farbeEcke(i / 10) : null;
    h += `<circle class="hl-feld" cx="${M(x)}" cy="${M(y)}" r="36" ${c ? `style="fill:${c};stroke:color-mix(in srgb,${c} 55%,#000)"` : start ? 'style="fill:#efe3c8"' : ''}/>`;
    if (start) { // Richtungspfeil auf dem Startfeld
      const [nx, ny] = B.bahn[(i + 1) % 40], dx = nx - x, dy = ny - y, ang = Math.atan2(dy, dx) * 180 / Math.PI;
      h += `<path d="M-12 -13L12 0L-12 13Z" fill="${c ? 'rgba(255,255,255,.85)' : '#c9b48a'}" transform="translate(${M(x)} ${M(y)}) rotate(${ang})"/>`;
    }
  });
  for (let e = 0; e < 4; e++) { const c = farbeEcke(e);
    B.ziel[e].forEach(([x, y]) => { h += `<circle class="hl-feld hl-ziel" cx="${M(x)}" cy="${M(y)}" r="34" style="fill:${c ? hell(c) : '#f1e6cd'};stroke:${c || '#cdbb96'}"/>`; });
    B.haus[e].forEach(([x, y]) => { h += `<circle class="hl-feld" cx="${M(x)}" cy="${M(y)}" r="33" style="fill:rgba(255,253,246,.75);stroke:${c ? `color-mix(in srgb,${c} 70%,#5b4a30)` : '#cdbb96'}"/>`; });
  }
  h += '<g id="hl-marken"></g><g id="hl-figuren"></g><g id="hl-hits"></g>';
  // Tippflächen auf allen Feldern
  let hits = '';
  B.bahn.forEach(([x, y]) => { hits += `<circle class="hl-hit" data-k="${x},${y}" cx="${M(x)}" cy="${M(y)}" r="48"/>`; });
  for (let e = 0; e < 4; e++) B.ziel[e].concat(B.haus[e]).forEach(([x, y]) => { hits += `<circle class="hl-hit" data-k="${x},${y}" cx="${M(x)}" cy="${M(y)}" r="48"/>`; });
  h = h.replace('<g id="hl-hits"></g>', `<g id="hl-hits">${hits}</g>`);
  const w = winkel();
  return defs + (w ? `<g transform="rotate(${w} 550 550)">${h}</g>` : h);
}
function windrose() {
  const cx = 550, cy = 550; let h = `<circle cx="${cx}" cy="${cy}" r="44" fill="#f8efdb" stroke="#c9b48a" stroke-width="3"/>`;
  // vier Spitzen zu den Zielbahnen, je in der Farbe der Ecke
  for (let e = 0; e < 4; e++) {
    const c = farbeEcke(e) || '#cdbb96', a = [90, 180, 270, 0][e];
    h += `<path d="M0 -40L11 -11L0 -16L-11 -11Z" fill="${c}" stroke="color-mix(in srgb,${c} 55%,#000)" stroke-width="2" transform="translate(${cx} ${cy}) rotate(${a + 180})"/>`;
  }
  h += `<circle cx="${cx}" cy="${cy}" r="9" fill="#7d6c50"/>`;
  return h;
}
/** Figur von schräg oben: Schatten, Fuß, Körper, Kopf. Steht immer aufrecht, auch wenn das Brett gedreht ist. */
function figurSvg(p) {
  const g = `url(#hl-g${p})`, rand = `color-mix(in srgb,${farben[p]} 50%,#000)`;
  return `<ellipse cx="3" cy="22" rx="27" ry="10" fill="rgba(40,28,10,.28)"/>
    <ellipse cx="0" cy="17" rx="25" ry="10" fill="${g}" stroke="${rand}" stroke-width="2.5"/>
    <path d="M-17 15C-12 2 -9 -6 -8 -12H8C9 -6 12 2 17 15C10 20 -10 20 -17 15Z" fill="${g}" stroke="${rand}" stroke-width="2.5"/>
    <circle cx="0" cy="-19" r="13.5" fill="${g}" stroke="${rand}" stroke-width="2.5"/>
    <ellipse cx="-4.5" cy="-23" rx="4.5" ry="3" fill="rgba(255,255,255,.65)"/>`;
}
const posVon = (p, f) => H.feldVon(S, p, S.fig[p][f], f);

/* ---------- Zeichnen ---------- */
function zeichne() {
  if (!stage || !$('hl-figuren')) return;
  const w = winkel(), mz = (S.phase === 'ziehen' && Netz.binDran(S.am) && !busy) ? H.zuege(S) : [];
  // Figuren: wer gerade zieht, liegt oben
  let fh = '';
  const reihe = []; for (let p = 0; p < S.n; p++) for (let f = 0; f < 4; f++) reihe.push([p, f]);
  reihe.sort((a, b) => (a[0] === S.am) - (b[0] === S.am));
  reihe.forEach(([p, f]) => { const [x, y] = posVon(p, f);
    fh += `<g class="hl-figur" data-p="${p}" data-f="${f}" style="transform-box:view-box;transform-origin:${M(x)}px ${M(y)}px"><g transform="translate(${M(x)} ${M(y)}) rotate(${-w})">${figurSvg(p)}</g></g>`; });
  $('hl-figuren').innerHTML = fh;
  let mh = '';
  const gesehen = new Set();
  mz.forEach(z => {
    const [x, y] = H.feldVon(S, z.p, z.von, z.f), [tx, ty] = H.feldVon(S, z.p, z.nach, z.f);
    mh += `<circle class="hl-wahl" cx="${M(x)}" cy="${M(y)}" r="42" style="stroke:#fff"/>`;
    if (!gesehen.has(z.nach)) { gesehen.add(z.nach); mh += `<circle class="hl-zielring" cx="${M(tx)}" cy="${M(ty)}" r="42" style="stroke:${farben[S.am]}"/>`; }
  });
  if (S.letzter && S.phase !== 'ende' && !mz.length) { // letzter Zug: zarte Spur
    const l = S.letzter, [x, y] = H.feldVon(S, l.p, l.nach, l.f);
    mh += `<circle cx="${M(x)}" cy="${M(y)}" r="41" fill="none" stroke="${farben[l.p]}" stroke-width="3" stroke-opacity=".55"/>`;
  }
  $('hl-marken').innerHTML = mh;
  zeichneSeite(mz);
}
function zeichneSeite(mz = []) {
  const am = S.am, f = farben[am], du = p => Netz.laeuft && p === ich();
  $('hl-spieler').innerHTML = namen.map((nm, p) => {
    const platz = S.fertig.indexOf(p);
    return `<div class="hl-pl${S.phase !== 'ende' && p === am ? ' am' : ''}${platz >= 0 ? ' fertig' : ''}" style="--pc:${farben[p]}"><span class="k-dot" style="--pc:${farben[p]}">${Kern.esc(nm.charAt(0).toUpperCase())}</span>
      <span class="nm">${Kern.esc(nm)}${du(p) ? '<span class="du">du</span>' : ''}</span>${platz >= 0 ? `<span class="hl-platz">${platz + 1}.</span>` : ''}<span class="hl-pips" aria-label="${H.imZiel(S, p)} im Ziel">${[0, 1, 2, 3].map(i => `<i class="${i < H.imZiel(S, p) ? 'voll' : ''}"></i>`).join('')}</span></div>`;
  }).join('');
  const schale = $('hl-schale'), wb = $('hl-wbox'), knopf = $('hl-knopf'), satz = $('hl-satz');
  schale.style.setProperty('--pc', f); schale.classList.toggle('am', S.phase !== 'ende');
  const lw = S.letzterWurf;
  wb.classList.toggle('leer', !lw);
  if (lw && !wb.dataset.rollt) Kern.wuerfelSetzen(wb.firstChild, lw.w);
  wb.firstChild.style.setProperty('--wc', lw ? farben[lw.p] : 'transparent');
  const meinWurf = S.phase === 'wuerfeln' && Netz.binDran(am) && !busy;
  wb.classList.toggle('lockt', meinWurf); wb.disabled = !meinWurf;
  knopf.hidden = !meinWurf; knopf.style.setProperty('--pc', f);
  knopf.textContent = lw && lw.p === am && (lw.folge === 'nochmal' || (lw.w === 6 && lw.folge === 'ziehen')) ? 'Nochmal würfeln' : 'Würfeln';
  const pl = document.querySelector('.nz-plakette'); if (pl) pl.classList.add('oben-links'); // Code-Plakette neben die Kopfknöpfe, rechts liegt das Brett
  // Versuche bei „dreimal würfeln“
  const vs = $('hl-versuch');
  if (S.phase === 'wuerfeln' && S.versuche > 0 && S.versuche < 3 && lw && lw.folge === 'nochmal') vs.innerHTML = `${[0, 1, 2].map(i => `<i class="${i < S.versuche ? 'weg' : ''}"></i>`).join('')}<span>Versuch ${S.versuche + 1} von 3</span>`;
  else vs.innerHTML = '';
  satz.classList.toggle('leise', !Netz.binDran(am) && S.phase !== 'ende');
  satz.textContent = satzText(mz);
}
function satzText(mz) {
  const am = S.am, nm = namen[am], selbst = Netz.laeuft && am === ich(), lw = S.letzterWurf;
  if (S.phase === 'ende') return S.n - S.fertig.length < 2 || S.weiter ? 'Alle Plätze sind vergeben.' : `${namen[S.sieger]} hat alle Figuren zu Hause!`;
  if (S.phase === 'wuerfeln') {
    const nochmal = lw && lw.p === am && lw.folge === 'nochmal';
    const sechs = lw && lw.p === am && lw.w === 6 && lw.folge === 'ziehen';
    if (!Netz.binDran(am)) return `${nm} würfelt …`;
    if (nochmal) return selbst || Netz.laeuft ? 'Keine 6 – du hast noch einen Versuch.' : `Keine 6 – ${nm}, noch ein Versuch.`;
    if (sechs) return selbst || Netz.laeuft ? 'Eine 6! Du darfst noch einmal würfeln.' : `Eine 6! ${nm}, würfle noch einmal.`;
    return selbst ? 'Du bist dran: Tippe auf den Würfel.' : `${nm}, du bist dran. Tippe auf den Würfel.`;
  }
  if (!Netz.binDran(am)) return `${nm} hat eine ${S.wurf} und zieht …`;
  const raus = mz.length && mz.every(z => z.raus);
  if (raus) return `Eine 6! Hol eine Figur aus dem Haus.`;
  if (mz.length && mz.every(z => z.von === 0) && H.imHaus(S, am)) return `Eine ${S.wurf}: Mach dein Startfeld frei.`;
  if (S.opt.schlagzwang && mz.length && mz.every(z => z.schlag)) return `Eine ${S.wurf}: Du musst schlagen!`;
  return `Eine ${S.wurf}: Tippe eine leuchtende Figur an.`;
}

/* ---------- Bedienung ---------- */
function tippeWuerfel() {
  if (!S || busy || S.phase !== 'wuerfeln') return;
  if (!Netz.binDran(S.am)) { Kern.ton('fehler'); return Kern.hinweis(`${namen[S.am]} ist dran.`); }
  Netz.tun('wuerfeln');
}
function tippeFeld(k) {
  if (!S || busy) return;
  const [x, y] = k.split(',').map(Number);
  if (S.phase === 'wuerfeln') { // Antippen einer Figur vor dem Wurf: freundlicher Hinweis
    if (Netz.binDran(S.am)) Kern.hinweis('Erst würfeln – tippe auf den Würfel.');
    return;
  }
  if (S.phase !== 'ziehen') return;
  if (!Netz.binDran(S.am)) { Kern.ton('fehler'); return Kern.hinweis(`${namen[S.am]} ist dran.`); }
  const mz = H.zuege(S);
  const gleich = (a, b) => a[0] === b[0] && a[1] === b[1];
  const z = mz.find(z => gleich(H.feldVon(S, z.p, z.von, z.f), [x, y])) || mz.find(z => gleich(H.feldVon(S, z.p, z.nach, z.f), [x, y]));
  if (!z) {
    // Erklären, warum nicht
    for (let f = 0; f < 4; f++) if (gleich(posVon(S.am, f), [x, y])) { Kern.ton('fehler'); return Kern.hinweis(grund(f)); }
    return;
  }
  Netz.tun('ziehe', {f: z.f});
}
function grund(f) {
  const r = S.fig[S.am][f], aufStart = S.fig[S.am].indexOf(0), wartend = H.imHaus(S, S.am) > 0;
  if (r === H.HAUS && S.wurf !== 6) return 'Aus dem Haus kommst du nur mit einer 6.';
  if (S.wurf === 6 && wartend && aufStart < 0 && r !== H.HAUS) return 'Mit der 6 musst du eine Figur aus dem Haus holen.';
  if (wartend && aufStart >= 0 && f !== aufStart) return 'Erst muss dein Startfeld frei werden.';
  if (S.opt.schlagzwang && H.zuege(S).every(z => z.schlag)) return 'Schlagzwang: Du musst eine Figur schlagen.';
  if (r >= H.ZIEL || r + S.wurf > H.LETZT) return 'So weit geht es im Ziel nicht.';
  return 'Diese Figur kann so nicht ziehen.';
}

/* ---------- Züge (Gastgeber bzw. am selben Gerät) ---------- */
async function wuerfeln() {
  if (busy || S.phase !== 'wuerfeln') return Netz.melden();
  busy = true; const alt = S;
  try {
    S = H.wuerfeln(S, w6()); speichern(); Netz.melden();
    await effekte(alt, S);
  } finally { busy = false; zeichne(); Netz.melden(); }
}
async function ziehe(f) {
  if (busy || S.phase !== 'ziehen') return Netz.melden();
  if (!H.zuege(S).some(z => z.f === f)) return Netz.melden();
  busy = true; const alt = S;
  try {
    S = H.ziehen(S, f); speichern(); Netz.melden();
    await effekte(alt, S);
  } finally { busy = false; zeichne(); Netz.melden(); }
  if (S.phase === 'ende') { await Kern.warte(300); ende(); }
}
/** Bewegung aus dem Unterschied zweier Stände: Würfel rollt, Figur läuft Feld für Feld, Geschlagene fliegt heim. */
async function effekte(alt, neu) {
  zeichne();
  if (!alt) return;
  if (neu.wurfNr > alt.wurfNr && neu.letzterWurf) {
    const wb = $('hl-wbox'); wb.dataset.rollt = '1'; wb.classList.remove('leer');
    Kern.ton('wuerfel');
    await Kern.wuerfelRollen(wb.firstChild, neu.letzterWurf.w);
    delete wb.dataset.rollt; zeichne();
    const lw = neu.letzterWurf;
    if (lw.folge === 'weiter') { Kern.ton('warn'); Kern.hinweis(`Kein Zug möglich – ${namen[neu.am]} ist dran.`); }
    else if (lw.folge === 'nochmal') Kern.ton('tipp');
  }
  if (neu.zugNr > alt.zugNr && neu.letzter) await laufen(alt, neu.letzter);
  if (neu.am !== alt.am && neu.phase !== 'ende' && Netz.laeuft && neu.am === ich()) Kern.ton('tipp');
}
async function laufen(alt, l) {
  const el = document.querySelector(`.hl-figur[data-p="${l.p}"][data-f="${l.f}"]`);
  const [fx, fy] = H.feldVon(S, l.p, l.nach, l.f);
  const stationen = [H.feldVon(alt, l.p, l.von, l.f), ...H.weg(alt, l.p, l.von, l.nach)];
  const reduziert = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const schritt = 150, dauer = reduziert ? 1 : schritt * (stationen.length - 1);
  if (el && el.animate && !reduziert) {
    const kf = []; stationen.forEach(([x, y], i) => {
      const t = `translate(${(x - fx) * Z}px,${(y - fy) * Z}px)`;
      kf.push({transform: t + ' scale(1)', offset: i / (stationen.length - 1)});
      if (i < stationen.length - 1) { const [nx, ny] = stationen[i + 1]; kf.push({transform: `translate(${((x + nx) / 2 - fx) * Z}px,${((y + ny) / 2 - fy) * Z}px) scale(1.18)`, offset: (i + .5) / (stationen.length - 1)}); }
    });
    el.animate(kf, {duration: dauer, easing: 'linear'});
    for (let i = 1; i < stationen.length; i++) setTimeout(() => Kern.ton(i === stationen.length - 1 ? 'stein' : 'tipp'), i * schritt - 30);
  } else Kern.ton('stein');
  await Kern.warte(dauer);
  if (l.schlag) {
    const g = document.querySelector(`.hl-figur[data-p="${l.schlag.p}"][data-f="${l.schlag.f}"]`), [hx, hy] = H.feldVon(S, l.schlag.p, H.HAUS, l.schlag.f);
    const [bx, by] = H.BRETT.bahn[l.schlag.abs];
    Kern.ton('fehler');
    if (g && g.animate && !reduziert) {
      g.animate([{transform: `translate(${(bx - hx) * Z}px,${(by - hy) * Z}px) scale(1)`}, {transform: `translate(${((bx + hx) / 2 - hx) * Z}px,${((by + hy) / 2 - hy) * Z}px) scale(1.5)`, offset: .5}, {transform: 'translate(0,0) scale(1)'}], {duration: 520, easing: 'cubic-bezier(.3,.6,.3,1)'});
      await Kern.warte(520);
    }
    const wer = namen[l.schlag.p];
    Kern.hinweis(Netz.laeuft && l.schlag.p === ich() ? 'Du wurdest geschlagen – zurück ins Haus.' : `${wer} muss zurück ins Haus.`);
  } else if (l.nach >= H.ZIEL) Kern.ton('punkt');
}

/* ---------- Ende ---------- */
function rangText() { return H.rangliste(S).map((p, i) => `${i + 1}. ${Kern.esc(namen[p])}${S.fertig.includes(p) ? '' : ` <span style="color:var(--ink2)">(${H.imZiel(S, p)} im Ziel)</span>`}`).join('<br>'); }
async function ende() {
  if (ENDE_FE) return;
  zeichne();
  const alleFertig = S.weiter || S.n - S.fertig.length < 2;
  const t = alleFertig ? 'Alle Plätze vergeben' : `${namen[S.sieger]} gewinnt!`;
  if (!alleFertig) { Kern.ton('sieg'); Kern.feier(); } else Kern.ton('runde');
  if (Netz.laeuft) Netz.ereignis({daten: {ende: t}});
  const kn = [];
  if (!alleFertig) kn.push({text: `Um Platz 2 weiterspielen`, wert: 'weiter', art: 'gut'});
  kn.push({text: 'Nochmal', wert: 'nochmal', art: alleFertig ? 'gut' : 'leise'}, {text: 'Brett ansehen', wert: 'sehen', art: 'leise'}, {text: 'Neues Spiel', wert: 'neu', art: 'leise'});
  const w = await dialog(t, rangText(), kn);
  if (w === 'weiter') return Netz.tun('weiter');
  if (w === 'nochmal') return Netz.tun('nochmal');
  if (w === 'neu') return neuesSpiel();
  const l = Kern.el('div', 'hl-ende'); $('hl-brett').appendChild(l);
  if (!alleFertig) { const a = Kern.el('button', 'k-btn gut', 'Weiterspielen'); Kern.tap(a, () => Netz.tun('weiter')); l.appendChild(a); }
  const b = Kern.el('button', 'k-btn', 'Nochmal'), c = Kern.el('button', 'k-btn leise', 'Neues Spiel');
  Kern.tap(b, () => Netz.tun('nochmal')); Kern.tap(c, neuesSpiel); l.append(b, c);
}
function weiterspielen() { if (S.phase !== 'ende') return Netz.melden(); S = H.weiterspielen(S); speichern(); aufbauen(); zeichne(); Netz.melden(); }
function nochmal() {
  const start = (S.start != null ? S.start + 1 : 1) % S.n;
  S = H.neu({anzahl: S.n, optionen: opt, start}); S.start = start; speichern(); aufbauen(); zeichne(); Netz.melden();
}
function neuesSpiel() { if (Netz.aktiv) Netz.verlassen(); Kern.speicher.loeschen(); startseite(); }
// Eigene Rückfrage statt Kern.frage: Kern.frage löst beim Schließen zuerst mit null auf.
function dialog(titel, text, knoepfe) {
  return new Promise(res => {
    const box = Kern.el('div', '', `<h2>${Kern.esc(titel)}</h2><p>${text}</p>`), zeile = Kern.el('div', 'k-knoepfe'); box.appendChild(zeile);
    const fe = Kern.fenster(box, {schliessbar: false}); ENDE_FE = fe;
    knoepfe.forEach(b => { const k = Kern.el('button', 'k-btn' + (b.art ? ' ' + b.art : ''), Kern.esc(b.text)); k.onclick = () => { ENDE_FE = null; fe.schliessen(); res(b.wert); }; zeile.appendChild(k); });
  });
}

Kern.init({id: 'heimlauf', name: 'Heimlauf', akzent: '#e9a93b', regeln: REGELN, onNeu: () => { Kern.speicher.loeschen(); startseite(); }});

/* ---------- Netzspiel ----------
   Gastgeber = Sitz 0, er würfelt und hält den Zustand. Alles auf dem Brett ist offen. Würfeln und Ziehen nur vom Gerät
   der Person am Zug, „Weiterspielen“/„Nochmal“ nur vom Gastgeber. Jedes Gerät dreht das Brett, bis die eigene Ecke
   unten links liegt. Würfelrollen und Laufen der Figuren leitet jeder Mitspieler aus dem Unterschied der Stände ab. */
// Mitspieler: Stände der Reihe nach zeigen; trifft während einer Bewegung ein neuer ein, folgt er danach.
let LAEUFT = false, WARTE = null;
async function nachziehen(alt) {
  LAEUFT = true; busy = true;
  try { await effekte(alt, S); }
  finally { LAEUFT = false; busy = false; zeichne(); }
  if (WARTE) { const w = WARTE; WARTE = null; uebernehmen(w); }
}
function uebernehmen(d) {
  const alt = S;
  S = d.S; namen = d.namen; farben = d.farben;
  if (setupZiel) { setupZiel.remove(); setupZiel = null; }
  document.querySelectorAll('.k-scroll').forEach(e => e.remove());
  const neuePartie = !alt || alt.n !== S.n || S.zugNr < alt.zugNr || S.wurfNr < alt.wurfNr;
  if (ENDE_FE && S.phase !== 'ende') { ENDE_FE.schliessen(); ENDE_FE = null; }
  if (!stage || !$('hl-figuren') || neuePartie) { aufbauen(); zeichne(); return; }
  nachziehen(alt);
}
Netz.einrichten({
  spiel: 'heimlauf', min: 2, max: 4,
  starten(spieler, o) {
    const start = o.start === 'zufall' ? Kern.zufall(spieler.length) : 0;
    beginnen({S: H.neu({anzahl: spieler.length, optionen: o, start}), namen: spieler.map(p => p.name), farben: spieler.map(p => p.farbe), opt: o});
  },
  aktion(name, d, sitz) {
    if (!S) return;
    if (sitz !== null) {
      const darf = (name === 'weiter' || name === 'nochmal') ? sitz === 0 : sitz === S.am;
      if (!darf) return Netz.melden();
    }
    if (name === 'wuerfeln') return wuerfeln();
    if (name === 'ziehe') { const f = Number(d.f); if (!(Number.isInteger(f) && f >= 0 && f < 4)) return Netz.melden(); return ziehe(f); }
    if (name === 'weiter') return weiterspielen();
    if (name === 'nochmal') return S.phase === 'ende' ? nochmal() : Netz.melden();
    Netz.melden();
  },
  zustand: () => ({S, namen, farben}),
  stand(d) { if (LAEUFT) { WARTE = d; return; } uebernehmen(d); },
  ereignis(d) {
    if (!d.ende) return;
    const ichGewinne = S.sieger === ich() && !S.weiter;
    Kern.ton(ichGewinne ? 'sieg' : 'runde'); if (ichGewinne) Kern.feier();
    Kern.hinweis(`${d.ende} – ${namen[0]} entscheidet, wie es weitergeht.`, 4000);
  },
  beendet: () => startseite(),
});
startseite();
window.__test = {zustand: () => S, wuerfe: (...w) => { TEST.wuerfe.push(...w); }, leeren: () => { TEST.wuerfe.length = 0; }, laden: s => { S = s; speichern(); zeichne(); Netz.melden(); }, busy: () => busy};
</script>
