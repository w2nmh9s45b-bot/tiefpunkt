<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="icon" href="../icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c2430">
<title>Halma · Spieltisch</title>
<link rel="stylesheet" href="../gemeinsam/kern.css">
<style>
.ha-stage{padding:0}
.ha-svg{position:absolute;left:0;right:0;top:60px;bottom:60px;width:100%;height:calc(100% - 120px);display:block;touch-action:none}
.ha-loch{fill:rgba(255,255,255,.07);stroke:rgba(143,211,209,.28);stroke-width:1.5}
.ha-stein{pointer-events:none}
.ha-stein .k{stroke:rgba(0,0,0,.4);stroke-width:2}
.ha-stein .m{fill:none;stroke:rgba(0,0,0,.42);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.ha-stein .mf{fill:rgba(0,0,0,.38);stroke:none}
.ha-ziel{fill:none;stroke-width:3;stroke-dasharray:3 5;stroke-linecap:round;pointer-events:none;opacity:.9}
.ha-weg{fill:color-mix(in srgb,var(--akzent) 22%,transparent);stroke:var(--akzent);stroke-width:4;pointer-events:none;animation:ha-puls 1.3s ease-in-out infinite}
.ha-sprung{stroke-dasharray:6 4}
.ha-wahl{fill:none;stroke:#fff;stroke-width:4;pointer-events:none}
.ha-spur{fill:none;stroke:#fff;stroke-width:3;stroke-dasharray:2 7;stroke-linecap:round;opacity:.75;pointer-events:none}
@keyframes ha-puls{0%,100%{opacity:1}50%{opacity:.4}}
.ha-hit{fill:transparent;cursor:pointer}
.ha-neu{animation:ha-pop .3s ease-out}
@keyframes ha-pop{from{opacity:.4}}
.ha-liste{position:absolute;left:50%;transform:translateX(-50%);top:max(10px,var(--sicher-o));display:flex;gap:6px;z-index:5;pointer-events:none;max-width:calc(100% - 260px);justify-content:center;flex-wrap:nowrap}
.ha-pl{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 7px;border-radius:99px;background:var(--panel);border:2px solid var(--line);font-weight:700;font-size:15px;white-space:nowrap}
.ha-pl.am{border-color:var(--pc);background:rgba(9,32,42,.92);box-shadow:0 0 18px color-mix(in srgb,var(--pc) 40%,transparent)}
.ha-pl small{color:var(--ink2);font-weight:400;margin-left:2px}
.ha-pl .nm{max-width:90px;overflow:hidden;text-overflow:ellipsis}
.ha-pl{padding:5px 11px 5px 6px;font-size:14px}
.ha-hint{position:absolute;z-index:6;width:min(300px,42vw);padding:10px 14px;border-radius:18px;background:rgba(7,24,32,.9);border:2px solid var(--pc);
  box-shadow:0 0 22px color-mix(in srgb,var(--pc) 30%,transparent);text-align:center;font-size:17px;line-height:1.3;transform:translate(-50%,-50%) rotate(var(--rot,0deg))}
.ha-hint b{color:var(--pc);font-family:var(--f-disp);font-size:1.1em}
.ha-akt{display:flex;gap:8px;justify-content:center;margin-top:8px;flex-wrap:wrap}
.ha-akt .k-btn{min-height:46px;font-size:16px;padding:0 16px}
.ha-ende{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;gap:10px;z-index:7}
@media (max-aspect-ratio:1/1){.ha-hint{width:min(230px,34vw);font-size:15px;padding:8px 10px}.ha-pl{font-size:14px}}
/* Telefon hoch: Spielerliste rechts neben den Kopfknöpfen (bricht um), Hinweis unten bzw. für die Gegenseite oben,
   Brett dazwischen – die Lage rechnet handyLage() */
@media (max-width:700px){
  .ha-liste{left:calc(max(10px,var(--sicher-l)) + 108px);right:max(10px,var(--sicher-r));transform:none;max-width:none;flex-wrap:wrap;justify-content:flex-end;gap:5px}
  .ha-pl{font-size:14px;padding:4px 9px 4px 4px;gap:6px}
  .ha-pl .nm{max-width:84px}
  .ha-hint{width:min(380px,calc(100% - 24px));font-size:16px;padding:10px 14px}
  .ha-akt .k-btn{min-height:44px}
  .ha-ende{bottom:max(10px,calc(var(--sicher-u) + 6px));width:max-content;max-width:calc(100% - 20px)}
  .ha-netz .ha-liste{right:calc(max(10px,var(--sicher-r)) + 92px)} /* Platz für die Code-Plakette */
}
</style>
</head>
<body class="chart">
<script src="../gemeinsam/kern.js"></script>
<script src="../gemeinsam/netz.js"></script>
<script src="halma.logik.js"></script>
<script>
"use strict";
const H = window.Halma;
const REGELN = `
<h3>Ziel</h3><p>Bringe als Erste oder Erster alle deine Steine in die Ecke, die deiner Startecke genau gegenüberliegt.</p>
<h3>Steine</h3><p>Zu zweit oder zu dritt spielt jede Person mit 15 Steinen, zu viert oder zu sechst mit 10. Zu zweit stehen die Ecken gegenüber, zu dritt wird jede zweite Ecke besetzt, zu viert zwei gegenüberliegende Paare.</p>
<h3>Ziehen</h3><p>In jedem Zug bewegst du genau einen eigenen Stein. Entweder du schiebst ihn auf ein angrenzendes freies Feld, oder du hüpfst über einen direkt angrenzenden Stein (egal ob eigen oder fremd) auf das freie Feld dahinter. Hüpfen darfst du in alle sechs Richtungen und mehrfach hintereinander. Du kannst nach jedem Hüpfer aufhören. Schieben und Hüpfen lassen sich im selben Zug nicht mischen. Es wird nichts geschlagen.</p>
<h3>Blockade</h3><p>Bleibt ein einzelner fremder Stein in deinem Zielhof stehen und hindert dich, ihn zu füllen, zählt der Hof als gefüllt, sobald alle übrigen Felder deine Steine tragen. Im Menü vor dem Start kannst du die strenge Regel wählen: Dann müssen wirklich alle Steine im Ziel stehen.</p>
<h3>Bedienung</h3><p>Tippe einen Stein an. Leuchtende Felder zeigen, wohin er darf. Ein Hüpfer verschiebt den Stein sofort. Geht es weiter, tippst du das nächste Feld an oder wählst „Zug beenden“. Mit „Zurück“ nimmst du einen Hüpfer zurück. Gestrichelte Ringe markieren dein Ziel.</p>`;
const SVGNS = 'http://www.w3.org/2000/svg', U = 26;
const MARKEN = ['', 'ring', 'punkt', 'quadrat', 'dreieck', 'kreuz'];
const P = i => ({x: H.PUNKT[i].px * U, y: H.PUNKT[i].py * U});
const GRENZE = (() => { let a = 1e9, b = -1e9, c = 1e9, d = -1e9; H.PUNKT.forEach((p, i) => { const q = P(i); a = Math.min(a, q.x); b = Math.max(b, q.x); c = Math.min(c, q.y); d = Math.max(d, q.y); }); return {a: a - 34, b: b + 34, c: c - 34, d: d + 34}; })();
const px = n => `calc(100% - ${n}px)`;
function anker(sitz) { // Mittelpunkt der Hinweisbox je Sitzecke; quer: seitlich, hoch: oben/unten und in den leeren Ecken
  if (innerWidth > innerHeight) return {3: [165, px(100)], 4: [165, '66%'], 5: [165, '42%'], 0: [px(165), 100], 1: [px(165), '42%'], 2: [px(165), '66%']}[sitz];
  return {3: ['50%', px(100)], 0: ['50%', 100], 1: [px(130), '24%'], 2: [px(130), '76%'], 4: [130, '76%'], 5: [130, '24%']}[sitz];
}
let S = null, namen = [], farben = [], opt = {}, sel = null, weg = [], busy = false, stage = null, setupZiel = null, gesendet = false;
// Netzspiel: Das Brett dreht sich, bis die eigene Startecke unten liegt (Zacke 3 = unten, je Zacke 60°).
const ich = () => (Netz.laeuft ? Netz.meinSitz + 1 : 0);
const drehWinkel = () => (Netz.laeuft && S ? ((3 - S.sitze[ich()]) * 60 + 360) % 360 : 0);
const $ = id => document.getElementById(id);

function bild() {
  return `<svg width="130" height="130" viewBox="-60 -62 120 124"><g>${[[0, -50], [-10, -34], [10, -34], [-20, -18], [0, -18], [20, -18], [0, 0], [-30, 0], [30, 0], [0, 40], [-10, 24], [10, 24], [-20, 8], [20, 8]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="7" fill="${i < 6 ? '#f2c14e' : i > 8 ? '#ef7d6d' : 'rgba(255,255,255,.18)'}"/>`).join('')}</g></svg>`;
}

function startseite() {
  if (stage) { stage.remove(); stage = null; }
  document.querySelectorAll('.k-scroll').forEach(e => e.remove());
  const g = Kern.speicher.laden(), ok = g && g.S && !g.S.sieger;
  const s = Kern.setup({
    titel: 'Halma', unter: 'Der Stern aus Löchern: Hüpfe über Steine und bringe als Erste oder Erster alle Steine in die gegenüberliegende Ecke.',
    bild: bild(), fakten: ['2 bis 6 Personen', 'ca. 20 Minuten'],
    spieler: {min: 2, max: 6, standard: 2, frage: 'Wie viele spielen mit? (2, 3, 4 oder 6)', namenLabel: 'Namen, Startecken im Uhrzeigersinn ab unten'},
    optionen: [
      {id: 'gegenueber', label: 'Hinweise zur eigenen Seite drehen?', standard: matchMedia('(max-width:700px)').matches ? 'aus' : 'an', werte: [{wert: 'an', text: 'Ja, gegenüber sitzen'}, {wert: 'aus', text: 'Nein, alle gleich'}]},
      {id: 'regel', label: 'Blockiert ein fremder Stein dein Ziel', standard: 'blockade', werte: [{wert: 'blockade', text: 'Zählt als belegt'}, {wert: 'streng', text: 'Streng: alle Steine ins Ziel'}]}
    ],
    fortsetzen: ok ? `${g.S.n} Personen · ${g.namen[g.S.am - 1]} ist dran` : null,
    onFortsetzen: () => beginnen(g),
    onStart: ({anzahl, namen: n, farben: f, optionen}) => {
      if (anzahl === 5) return Kern.hinweis('Halma gibt es für 2, 3, 4 oder 6 Personen.');
      beginnen({S: H.neu({anzahl, regel: optionen.regel}), namen: n, farben: f, opt: optionen});
    }
  });
  setupZiel = s.ziel;
  const b5 = $('k-anzahl-5'); if (b5) b5.hidden = true;
  const st = Kern.einst.laden(); if (st.anzahl === 5) { const b = $('k-anzahl-6'); b && b.click(); }
}
function beginnen(d) {
  S = d.S; namen = d.namen; farben = d.farben; opt = d.opt; sel = null; weg = []; busy = false;
  if (setupZiel) { setupZiel.remove(); setupZiel = null; }
  Kern.speicher.speichern({S, namen, farben, opt});
  aufbauen(); zeichne(); Netz.melden();
}

function aufbauen() {
  if (stage) stage.remove();
  stage = Kern.el('div', 'k-buehne ha-stage' + (Netz.laeuft ? ' ha-netz' : ''));
  document.body.appendChild(stage);
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('viewBox', `${GRENZE.a} ${GRENZE.c} ${GRENZE.b - GRENZE.a} ${GRENZE.d - GRENZE.c}`); svg.setAttribute('class', 'ha-svg'); svg.id = 'ha-svg';
  const tint = Array(H.N).fill(null);
  for (let p = 1; p <= S.n; p++) H.startFelder(S, p).forEach(f => tint[f] = farben[p - 1]);
  let h = '';
  for (let i = 0; i < H.N; i++) { const c = P(i); h += `<circle class="ha-loch" cx="${c.x}" cy="${c.y}" r="15" ${tint[i] ? `style="fill:color-mix(in srgb,${tint[i]} 24%,transparent)"` : ''}/>`; }
  h += `<g id="ha-ziel"></g><g id="ha-wege"></g><g id="ha-spur"></g><g id="ha-steine"></g><g id="ha-hits"></g>`;
  svg.innerHTML = drehWinkel() ? `<g id="ha-dreh" transform="rotate(${drehWinkel()})">${h}</g>` : h; stage.appendChild(svg);
  const hits = svg.querySelector('#ha-hits');
  for (let i = 0; i < H.N; i++) {
    const c = P(i), k = document.createElementNS(SVGNS, 'circle');
    k.setAttribute('class', 'ha-hit'); k.setAttribute('cx', c.x); k.setAttribute('cy', c.y); k.setAttribute('r', 24); k.dataset.i = i;
    Kern.tap(k, () => tippe(i)); hits.appendChild(k);
  }
  stage.insertAdjacentHTML('beforeend', `<div class="ha-liste" id="ha-liste"></div><div class="ha-hint" id="ha-hint"></div>`);
}

function marke(m, c) {
  switch (m) {
    case 'ring': return `<circle class="m" cx="${c.x}" cy="${c.y}" r="9"/>`;
    case 'punkt': return `<circle class="mf" cx="${c.x}" cy="${c.y}" r="6"/>`;
    case 'quadrat': return `<rect class="mf" x="${c.x - 6}" y="${c.y - 6}" width="12" height="12" rx="1.5"/>`;
    case 'dreieck': return `<path class="mf" d="M${c.x} ${c.y - 8}L${c.x + 8} ${c.y + 6}H${c.x - 8}Z"/>`;
    case 'kreuz': return `<path class="m" d="M${c.x - 7} ${c.y}H${c.x + 7}M${c.x} ${c.y - 7}V${c.y + 7}"/>`;
  }
  return '';
}
const feldJetzt = () => weg.length > 1 ? H.mitWeg(S, weg) : S.feld;
function steineHtml() {
  const f = feldJetzt();
  return f.map((v, i) => { if (!v) return ''; const c = P(i);
    return `<g class="ha-stein" data-i="${i}"><circle class="k" cx="${c.x}" cy="${c.y}" r="19" fill="${farben[v - 1]}"/><circle cx="${c.x}" cy="${c.y}" r="15" fill="none" stroke="rgba(255,255,255,.28)" stroke-width="2"/>${marke(MARKEN[v - 1], c)}</g>`; }).join('');
}
function aktuelleZiele() {
  if (S.sieger) return {schritte: [], huepfer: []};
  if (weg.length > 1) return {schritte: [], huepfer: H.weiter(S, weg)};
  if (sel != null) return H.ersteZiele(S, sel);
  return {schritte: [], huepfer: []};
}
function nachrichtText() {
  const n = namen[S.am - 1];
  if (S.sieger) return '';
  if (!Netz.binDran(S.am - 1)) return 'Warte auf den Zug.';
  if (weg.length > 1) return `Weiter hüpfen oder „Zug beenden“.`;
  if (sel != null) return `Tippe ein leuchtendes Feld.`;
  return `Tippe einen deiner Steine an.`;
}
function zeichne() {
  const z = aktuelleZiele(), am = S.am;
  $('ha-steine').innerHTML = steineHtml();
  const ring = (i, kl, r) => { const c = P(i); return `<circle class="${kl}" cx="${c.x}" cy="${c.y}" r="${r}"/>`; };
  $('ha-ziel').innerHTML = S.sieger ? '' : H.zielFelder(S, am).map(i => ring(i, 'ha-ziel', 17)).join('').replace(/class="ha-ziel"/g, `class="ha-ziel" style="stroke:${farben[am - 1]}"`);
  let w = '';
  if (!S.sieger) {
    if (sel != null) w += ring(weg.length > 1 ? weg[weg.length - 1] : sel, 'ha-wahl', 24);
    z.schritte.forEach(i => w += ring(i, 'ha-weg', 17)); z.huepfer.forEach(i => w += ring(i, 'ha-weg ha-sprung', 17));
  }
  $('ha-wege').innerHTML = w;
  $('ha-spur').innerHTML = weg.length > 1 ? `<polyline class="ha-spur" points="${weg.map(i => { const c = P(i); return c.x + ',' + c.y; }).join(' ')}"/>` : '';
  // Spieler
  $('ha-liste').innerHTML = Array.from({length: S.n}, (_, k) => k + 1).map(p => `<div class="ha-pl${!S.sieger && S.am === p ? ' am' : ''}" style="--pc:${farben[p - 1]}"><span class="k-dot" style="--pc:${farben[p - 1]}">${Kern.esc(namen[p - 1].charAt(0).toUpperCase())}</span>${S.n <= 3 ? `<span class="nm">${Kern.esc(namen[p - 1])}</span>` : ''}<small class="k-zahl">${H.imZiel(S, p)}/${S.steine}</small></div>`).join('');
  // Hinweis
  const hn = $('ha-hint'), an = opt.gegenueber === 'an' ? S.sitze[am] : 3, a = anker(an).map(v => typeof v === 'number' ? v + 'px' : v);
  hn.hidden = !!S.sieger; hn.style.setProperty('--pc', farben[am - 1]);
  hn.style.left = a[0]; hn.style.top = a[1]; hn.style.setProperty('--rot', opt.gegenueber === 'an' ? (an * 60 + 180) % 360 + 'deg' : '0deg');
  const wer = Netz.laeuft && am === ich() ? '<b>Du</b> bist dran' : `<b>${Kern.esc(namen[am - 1])}</b> ist dran`;
  hn.innerHTML = `${wer}<br>${Kern.esc(nachrichtText())}${weg.length ? `<div class="ha-akt"><button class="k-btn leise" id="ha-zurueck">Zurück</button>${weg.length > 1 ? '<button class="k-btn" id="ha-fertig">Zug beenden</button>' : ''}</div>` : ''}`;
  const zb = $('ha-zurueck'), fb = $('ha-fertig');
  if (zb) Kern.tap(zb, zurueck); if (fb) Kern.tap(fb, beenden);
  handyLage(hn, an);
}
// Telefon hoch: Brett zwischen Spielerliste und Hinweisband; Hinweis unten aufrecht, für Sitze oben (0, 1, 5) oben gedreht.
const HANDY = matchMedia('(max-width:700px)'), BAND = 142;
let sicherEl = null;
function sicher() {
  if (!sicherEl) { sicherEl = Kern.el('div'); sicherEl.style.cssText = 'position:fixed;visibility:hidden;pointer-events:none;padding:var(--sicher-o) 0 var(--sicher-u)'; document.body.appendChild(sicherEl); }
  const c = getComputedStyle(sicherEl); return {o: parseFloat(c.paddingTop) || 0, u: parseFloat(c.paddingBottom) || 0};
}
function handyLage(hn, an) {
  const svg = $('ha-svg'); if (!svg) return;
  if (!HANDY.matches || innerWidth > innerHeight) { svg.style.top = svg.style.height = ''; return; }
  const H = innerHeight, si = sicher(), oben = opt.gegenueber === 'an';
  const lu = $('ha-liste').getBoundingClientRect().bottom + 8, kopf = document.querySelector('.k-kopf'), ku = kopf ? kopf.getBoundingClientRect().bottom + 8 : 0;
  const start = Math.max(lu, ku), unten = Math.max(10, si.u) + BAND;
  const top = start + (oben ? BAND : 0);
  svg.style.top = top + 'px'; svg.style.height = Math.max(160, H - top - unten) + 'px';
  if (S.sieger) return;
  const obenSitz = oben && [0, 1, 5].includes(an);
  hn.style.left = '50%';
  hn.style.top = (obenSitz ? start + BAND / 2 : H - unten + BAND / 2) + 'px';
  hn.style.setProperty('--rot', obenSitz ? '180deg' : '0deg');
}

function tippe(i) {
  if (busy || S.sieger || gesendet) return;
  const am = S.am, z = aktuelleZiele();
  if (!Netz.binDran(am - 1)) { Kern.ton('fehler'); return Kern.hinweis(`${namen[am - 1]} ist dran.`); }
  if (weg.length > 1) {
    if (z.huepfer.includes(i)) return hupf(i);
    Kern.ton('fehler'); return Kern.hinweis('Hüpfe weiter auf ein leuchtendes Feld oder tippe „Zug beenden“.');
  }
  if (S.feld[i] === am) {
    if (sel === i) { sel = null; Kern.ton('tipp'); return zeichne(); }
    const e = H.ersteZiele(S, i);
    if (!e.schritte.length && !e.huepfer.length) { Kern.ton('fehler'); return Kern.hinweis('Dieser Stein steckt fest und kann nicht ziehen.'); }
    sel = i; Kern.ton('tipp'); return zeichne();
  }
  if (sel != null) {
    if (z.schritte.includes(i)) return commit([sel, i]);
    if (z.huepfer.includes(i)) return hupf(i);
    Kern.ton('fehler');
    return Kern.hinweis(S.feld[i] ? 'Dieses Feld ist besetzt.' : 'Dorthin geht es nicht. Nur leuchtende Felder.');
  }
  Kern.ton('fehler'); Kern.hinweis(S.feld[i] ? 'Das ist kein Stein von dir. Tippe einen eigenen Stein an.' : 'Tippe zuerst einen eigenen Stein an.');
}
function animiere(von, nach) {
  const e = document.querySelector(`#ha-steine [data-i="${nach}"]`), a = P(von), b = P(nach);
  if (e && e.animate) e.animate([{transform: `translate(${a.x - b.x}px,${a.y - b.y}px)`}, {transform: 'none'}], {duration: 260, easing: 'cubic-bezier(.3,.7,.3,1)'});
}
function hupf(i) {
  const von = weg.length > 1 ? weg[weg.length - 1] : sel;
  if (weg.length === 0) weg = [sel];
  weg.push(i); zeichne(); animiere(von, i); Kern.ton('stein');
  if (!H.weiter(S, weg).length) setTimeout(beenden, 380);
}
function zurueck() {
  if (busy) return;
  if (weg.length > 1) { const von = weg.pop(); const nach = weg[weg.length - 1]; if (weg.length === 1) weg = []; zeichne(); animiere(von, nach); }
  else { weg = []; sel = null; zeichne(); }
  Kern.ton('tipp');
}
function beenden() { if (weg.length > 1 && !busy) commit(weg.slice()); }
// Der fertige Zug (Schritt oder ganze Hüpfkette) geht über Netz.tun; die Kette selbst bleibt bis dahin auf dem Gerät.
function commit(w) {
  if (busy || gesendet) return;
  gesendet = Netz.istGast;
  return Netz.tun('zug', {weg: w});
}
async function zugAusfuehren(w, eigen) {
  if (busy) return Netz.melden(); busy = true;
  try {
    const von = w[0], nach = w[w.length - 1];
    const wasChain = eigen && weg.length > 1;
    try { S = H.ziehen(S, w); } catch (e) { if (eigen) { sel = null; weg = []; zeichne(); } return Netz.melden(); }
    sel = null; weg = [];
    Kern.speicher.speichern({S, namen, farben, opt}); Netz.melden();
    zeichne(); if (!wasChain) animiere(von, nach); Kern.ton('stein');
    if (S.sieger) { await Kern.warte(350); await ende(); }
  } finally { busy = false; }
}
async function ende() {
  Kern.speicher.loeschen(); zeichne();
  let t, u;
  if (S.sieger === 'remis') { t = 'Remis'; u = 'Niemand kann mehr ziehen.'; }
  else { t = `${namen[S.sieger - 1]} gewinnt!`; u = S.regel === 'blockade' && H.imZiel(S, S.sieger) < S.steine ? 'Der Zielhof zählt als gefüllt, ein fremder Stein blockiert nur noch das letzte Feld.' : 'Alle Steine stehen im gegenüberliegenden Ziel.'; Kern.ton('sieg'); Kern.feier(); }
  if (Netz.laeuft) Netz.ereignis({daten: {ende: t}});
  const w = await dialog(t, u, [{text: 'Nochmal (Anfang wechselt)', wert: 'nochmal', art: 'gut'}, {text: 'Brett ansehen', wert: 'sehen', art: 'leise'}, {text: 'Neues Spiel', wert: 'neu', art: 'leise'}]);
  if (w === 'nochmal') return nochmal();
  if (w === 'neu') return neuesSpiel();
  const l = Kern.el('div', 'ha-ende'), a = Kern.el('button', 'k-btn gut', 'Nochmal'), b = Kern.el('button', 'k-btn leise', 'Neues Spiel');
  a.onclick = nochmal; b.onclick = neuesSpiel; l.append(a, b); stage.appendChild(l);
}
function nochmal() { beginnen({S: H.neu({anzahl: S.n, regel: S.regel, start: (S.start || 1) % S.n + 1}), namen, farben, opt}); S.start = S.am; Kern.speicher.speichern({S, namen, farben, opt}); Netz.melden(); }
function neuesSpiel() { if (Netz.aktiv) Netz.verlassen(); Kern.speicher.loeschen(); startseite(); }


// Eigene Rückfrage statt Kern.frage: Kern.frage löst beim Schließen zuerst mit null auf, die gewählte Antwort ginge verloren.
function dialog(titel, text, knoepfe) {
  return new Promise(res => {
    const box = Kern.el('div', '', `<h2>${Kern.esc(titel)}</h2><p>${text}</p>`), zeile = Kern.el('div', 'k-knoepfe'); box.appendChild(zeile);
    const fe = Kern.fenster(box, {schliessbar: false});
    knoepfe.forEach(b => { const k = Kern.el('button', 'k-btn' + (b.art ? ' ' + b.art : ''), Kern.esc(b.text)); k.onclick = () => { fe.schliessen(); res(b.wert); }; zeile.appendChild(k); });
  });
}

Kern.init({id: 'halma', name: 'Halma', akzent: '#7fd49a', regeln: REGELN, onNeu: () => { Kern.speicher.loeschen(); startseite(); }});

/* Netzspiel: Sitz k = Spieler k+1 (Startecken im Uhrzeigersinn ab dem Gastgeber). Jedes Gerät dreht das Brett so,
   dass die eigene Startecke unten liegt. Hüpfketten bleiben bis „Zug beenden“ auf dem eigenen Gerät. */
Netz.einrichten({
  spiel: 'halma', min: 2, max: 6, erlaubt: [2, 3, 4, 6],
  starten(spieler, optionen) {
    beginnen({S: H.neu({anzahl: spieler.length, regel: optionen.regel}), namen: spieler.map(p => p.name), farben: spieler.map(p => p.farbe),
      opt: Object.assign({}, optionen, {gegenueber: 'aus'})});
  },
  aktion(name, d, sitz) {
    if (name !== 'zug' || !S || S.sieger) return Netz.melden();
    if (sitz !== null && sitz !== S.am - 1) return Netz.melden(); // nicht dran
    const w = Array.isArray(d.weg) ? d.weg.map(Number).filter(Number.isInteger) : [];
    return zugAusfuehren(w, sitz === null || sitz === Netz.meinSitz);
  },
  zustand: () => ({S, namen, farben}),
  stand(d) {
    const alt = S, neu = d.S;
    const neuePartie = !alt || neu.n !== alt.n || neu.zuege < alt.zuege || (neu.zuege === 0 && alt.zuege > 0);
    S = neu; namen = d.namen; farben = d.farben; opt = {gegenueber: 'aus'};
    if (setupZiel) { setupZiel.remove(); setupZiel = null; }
    document.querySelectorAll('.k-scroll').forEach(e => e.remove());
    const eigen = gesendet; gesendet = false;
    if (!stage || neuePartie) { sel = null; weg = []; aufbauen(); }
    else if (neu.zuege !== alt.zuege || eigen) { sel = null; weg = []; }
    zeichne();
    if (alt && !neuePartie && neu.zuege > alt.zuege && neu.letzter) {
      if (!eigen) animiere(neu.letzter[0], neu.letzter[neu.letzter.length - 1]);
      Kern.ton('stein');
    }
  },
  ereignis(d) {
    if (!d.ende) return;
    if (S.sieger && S.sieger !== 'remis') { Kern.ton(S.sieger === ich() ? 'sieg' : 'runde'); if (S.sieger === ich()) Kern.feier(); }
    Kern.hinweis(`${d.ende} – ${namen[0]} entscheidet, wie es weitergeht.`, 4000);
  },
  beendet: () => startseite(),
});
startseite();
addEventListener('resize', () => { if (S && stage) zeichne(); });
window.__test = {zustand: () => S, laden: s => { S = s; sel = null; weg = []; zeichne(); }, hat: () => ({sel, weg: weg.slice()})};
</script>
