<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="icon" href="../icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c2430">
<title>Zahnweh · Spieltisch</title>
<link rel="stylesheet" href="../gemeinsam/kern.css">
<style>
/* Zahnweh: oben die Spielerleiste, in der Mitte das Nilpferd mit offenem Maul, unten die Lage. Präfix .zw- */
.zw-buehne{display:flex;flex-direction:column;align-items:center;gap:8px}
.zw-leiste{flex:none;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:4px 120px 0;max-width:100%}
.zw-pl{display:flex;align-items:center;gap:8px;padding:6px 13px 6px 7px;border-radius:99px;background:var(--panel);border:2px solid var(--line);font-weight:700;font-size:16px;white-space:nowrap;transition:border-color .3s,box-shadow .3s,opacity .3s}
.zw-pl.am{border-color:var(--pc);background:rgba(9,32,42,.92);box-shadow:0 0 20px color-mix(in srgb,var(--pc) 40%,transparent)}
.zw-pl.raus{opacity:.45}
.zw-pl.raus .nm{text-decoration:line-through}
.zw-pl .k-dot{width:26px;height:26px;font-size:13px}
.zw-pl .nm{max-width:120px;overflow:hidden;text-overflow:ellipsis}
.zw-pl .pk{display:flex;gap:3px;align-items:center;color:var(--ink2);font-size:13px}
.zw-pl .pk i{width:9px;height:12px;border-radius:3px 3px 5px 5px;background:#ef8a8a;display:block}
.zw-pl .du{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.zw-mitte{flex:1;min-height:0;width:100%;position:relative;display:grid;place-items:center}
.zw-svg{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;overflow:hidden}
.zw-fuss{flex:none;width:min(720px,100%);display:flex;align-items:center;justify-content:center;gap:14px;min-height:64px;padding:8px 18px;border-radius:20px;
  background:var(--panel);border:2px solid var(--line);transition:border-color .3s}
.zw-fuss.am{border-color:var(--pc)}
.zw-satz{font-size:19px;font-weight:700;text-align:center;text-wrap:balance;line-height:1.25}
.zw-satz small{display:block;font-weight:400;font-size:14px;color:var(--ink2);margin-top:2px}
.zw-fuss .k-btn{flex:none}
/* Nilpferd */
.zw-zahn{cursor:pointer}
.zw-zahn .z{fill:#fffdf7;stroke:#c9b9a6;stroke-width:3}
.zw-zahn .g{fill:rgba(170,150,130,.22)}
.zw-zahn .l{fill:#fff;opacity:.85}
.zw-zahn .hit{fill:transparent}
.zw-zahn.unten{cursor:default}
.zw-zahn.unten .zk{transform:scaleY(.34)}
.zw-zahn.unten .z{fill:#e8dccd}
.zw-zahn.unten .l{opacity:0}
.zw-zahn .zk{transition:transform .24s cubic-bezier(.3,1.3,.5,1);transform-box:fill-box;transform-origin:50% 100%}
.zw-zahn.wund .z{fill:#ffd9d4;stroke:#d84d4d}
.zw-zahn.lockt .z{stroke:color-mix(in srgb,var(--pc) 60%,#c9b9a6);stroke-width:3.5}
@media (hover:hover){.zw-zahn.lockt:hover .zk{transform:scaleY(.94)}}
.zw-puls{fill:none;stroke:#ff6b6b;stroke-width:5;stroke-linecap:round;animation:zw-puls 1s ease-in-out infinite}
@keyframes zw-puls{0%,100%{opacity:1}50%{opacity:.2}}
.zw-schweiss{animation:zw-tropf 2.2s ease-in infinite}
@keyframes zw-tropf{0%{transform:translateY(0);opacity:0}15%{opacity:1}80%{opacity:1}100%{transform:translateY(26px);opacity:0}}
.zw-wackel{animation:zw-wackel .45s ease-out}
@keyframes zw-wackel{0%,100%{transform:translateX(0)}15%{transform:translateX(-14px) rotate(-1.5deg)}35%{transform:translateX(12px) rotate(1.2deg)}55%{transform:translateX(-8px)}75%{transform:translateX(5px)}}
.zw-ende{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);display:flex;gap:10px;z-index:5;width:max-content;max-width:calc(100% - 16px)}
@media (max-aspect-ratio:1/1){.zw-leiste{padding:58px 0 0}}
@media (max-width:700px){
  .zw-leiste{padding:4px 0 0 112px;justify-content:flex-start;gap:5px;min-height:52px;align-content:center}
  .zw-pl{font-size:14px;padding:4px 9px 4px 4px;gap:5px}
  .zw-pl .k-dot{width:22px;height:22px;font-size:12px}
  .zw-pl .nm{max-width:72px}
  .zw-pl .du{display:none}
  .zw-fuss{flex-wrap:wrap;gap:8px;min-height:56px;padding:8px 12px;margin-bottom:4px}
  .zw-satz{font-size:17px}
  .zw-netz .zw-leiste{padding-right:96px}
}
</style>
</head>
<body class="chart">
<script src="../gemeinsam/kern.js"></script>
<script src="../gemeinsam/netz.js"></script>
<script src="zahnweh.logik.js"></script>
<script>
"use strict";
const ZW = window.Zahnweh;
const REGELN = `
<h3>Worum es geht</h3><p>Das Nilpferd hat Zahnweh – aber nur ein einziger Zahn tut weh. Welcher es ist, weiß niemand. Wer ihn erwischt, wird gebissen.</p>
<h3>Ablauf</h3><p>Reihum drückt jede Person genau einen Zahn hinunter. Ein gedrückter Zahn bleibt unten. Erwischst du den wunden Zahn, schnappt das Maul zu: Du hast diese Runde verloren.</p>
<h3>Neue Runde</h3><p>Vor jeder Runde wird das Maul neu gespannt und ein anderer, geheimer Zahn tut weh. Wer zuletzt gebissen wurde, beginnt.</p>
<h3>Spielarten</h3><ul><li><b>Eine Runde</b> (Grundregel): Wer gebissen wird, verliert – alle anderen gewinnen.</li>
<li><b>Ausscheiden:</b> Wer gebissen wird, scheidet aus. Die letzte Person im Spiel gewinnt.</li>
<li><b>Fünf Runden:</b> Jeder Biss gibt einen Zahnwehpunkt. Nach fünf Runden gewinnt, wer die wenigsten hat.</li></ul>
<h3>Bedienung</h3><p>Tippe einen Zahn an, der noch oben steht. Mit eigenen Geräten drückt jede Person auf ihrem Gerät, wenn sie dran ist.</p>`;
const SVGNS = 'http://www.w3.org/2000/svg';
let S = null, namen = [], farben = [], opt = {}, busy = false, stage = null, setupZiel = null, ENDE_FE = null, offenGleich = false;
const TEST = {zahn: []};
const $ = id => document.getElementById(id);
const zufall = n => TEST.zahn.length ? TEST.zahn.shift() % n : Kern.zufall(n);
const ich = () => (Netz.laeuft ? Netz.meinSitz : null);
const REDUZIERT = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Zähne: 13 im Unterkiefer, auf einem Lächelbogen ---------- */
const BOGEN_Y = u => 452 + 118 * (1 - u * u);           // u = −1 … 1 quer übers Maul
const ZAHN = Array.from({length: 13}, (_, i) => {
  const u = i / 6 - 1, q = 1 - u * u, steig = -236 * u / 262;  // dy/dx der Bogenlinie
  return {x: 400 + 262 * u, y: BOGEN_Y(u), w: 31 + 6 * q, h: 54 + 18 * q, r: Math.atan(steig) * 180 / Math.PI};
});

/* ---------- Klang: Zuschnappen (eigene kleine Tonquelle, achtet auf „Ton aus“) ---------- */
let AC = null;
function schnappTon() {
  try { if (localStorage.getItem('spieltisch.ton') === 'aus') return; } catch (e) {}
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === 'suspended') AC.resume();
    const t = AC.currentTime, len = Math.floor(AC.sampleRate * .22), buf = AC.createBuffer(1, len, AC.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
    const src = AC.createBufferSource(), lp = AC.createBiquadFilter(), g = AC.createGain();
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(1800, t); lp.frequency.exponentialRampToValueAtTime(160, t + .2);
    g.gain.setValueAtTime(.9, t); src.buffer = buf; src.connect(lp).connect(g).connect(AC.destination); src.start(t);
    const o = AC.createOscillator(), og = AC.createGain(); o.type = 'triangle';
    o.frequency.setValueAtTime(170, t); o.frequency.exponentialRampToValueAtTime(48, t + .28);
    og.gain.setValueAtTime(.0001, t); og.gain.exponentialRampToValueAtTime(.55, t + .01); og.gain.exponentialRampToValueAtTime(.0001, t + .34);
    o.connect(og).connect(AC.destination); o.start(t); o.stop(t + .36);
  } catch (e) {}
}
const ruetteln = muster => { try { navigator.vibrate && navigator.vibrate(muster); } catch (e) {} };

function bild() {
  return `<svg width="150" height="130" viewBox="0 0 150 130"><ellipse cx="75" cy="118" rx="60" ry="9" fill="rgba(0,0,0,.25)"/>
    <path d="M18 70Q75 132 132 70Q132 60 120 58H30Q18 60 18 70Z" fill="#8f86d8"/><path d="M30 64Q75 104 120 64Z" fill="#c9476f"/>
    ${[0, 1, 2, 3, 4, 5, 6].map(i => { const t = Math.PI * (1 - i / 6); return `<rect x="${75 + 40 * Math.cos(t) - 5}" y="${66 + 14 * Math.sin(t) - 7}" width="10" height="13" rx="4" fill="#fffdf7"/>`; }).join('')}
    <path d="M14 56Q12 14 75 10Q138 14 136 56Q105 46 75 46Q45 46 14 56Z" fill="#9d95e0"/><circle cx="50" cy="22" r="12" fill="#9d95e0"/><circle cx="100" cy="22" r="12" fill="#9d95e0"/>
    <circle cx="50" cy="21" r="6" fill="#fff"/><circle cx="100" cy="21" r="6" fill="#fff"/><circle cx="51" cy="22" r="3" fill="#1d1d33"/><circle cx="99" cy="22" r="3" fill="#1d1d33"/>
    <path d="M72 8l-10 -7 2 12zM78 8l10 -7-2 12z" fill="#f7f3ea"/></svg>`;
}

function startseite() {
  if (stage) { stage.remove(); stage = null; }
  if (ENDE_FE) { ENDE_FE.schliessen(); ENDE_FE = null; }
  document.querySelectorAll('.k-scroll').forEach(e => e.remove());
  const g = Kern.speicher.laden(), ok = g && g.S && g.S.phase !== 'ende';
  const s = Kern.setup({
    titel: 'Zahnweh', unter: 'Das Nilpferd hat einen wunden Zahn. Drückt reihum auf die Zähne – wen es beißt, der verliert.',
    bild: bild(), fakten: ['2 bis 6 Personen', 'ca. 5 Minuten'],
    spieler: {min: 2, max: 6, standard: 3},
    optionen: [
      {id: 'modus', label: 'Spielart', standard: 'eine', werte: [{wert: 'eine', text: 'Eine Runde (Grundregel)'}, {wert: 'raus', text: 'Ausscheiden'}, {wert: 'punkte', text: 'Fünf Runden'}]},
      {id: 'start', label: 'Wer beginnt?', standard: '0', werte: [{wert: '0', text: 'Spieler 1'}, {wert: 'zufall', text: 'Zufall'}]},
    ],
    fortsetzen: ok ? `${g.S.n} Personen · Runde ${g.S.runde} · ${g.namen[g.S.am]} ist dran` : null,
    onFortsetzen: () => beginnen(g),
    onStart: ({anzahl, namen: n, farben: f, optionen}) => {
      const start = optionen.start === 'zufall' ? Kern.zufall(anzahl) : 0;
      beginnen({S: ZW.neu({anzahl, modus: optionen.modus, start, zufall}), namen: n, farben: f, opt: optionen});
    },
  });
  setupZiel = s.ziel;
}
function beginnen(d) {
  S = d.S; namen = d.namen; farben = d.farben; opt = d.opt || {}; busy = false;
  if (setupZiel) { setupZiel.remove(); setupZiel = null; }
  speichern(); aufbauen(); zeichne(); Netz.melden();
  if (S.phase === 'ende') setTimeout(ende, 300);
}
function speichern() { if (S.phase === 'ende') Kern.speicher.loeschen(); else Kern.speicher.speichern({S, namen, farben, opt}); }

/* ---------- Bühne ---------- */
function aufbauen() {
  if (stage) stage.remove();
  stage = Kern.el('div', 'k-buehne zw-buehne' + (Netz.laeuft ? ' zw-netz' : ''));
  stage.innerHTML = `<div class="zw-leiste" id="zw-leiste"></div><div class="zw-mitte" id="zw-mitte"></div><div class="zw-fuss" id="zw-fuss"><div class="zw-satz" id="zw-satz"></div></div>`;
  document.body.appendChild(stage);
  const svg = document.createElementNS(SVGNS, 'svg');
  svg.setAttribute('viewBox', ausschnitt()); svg.setAttribute('class', 'zw-svg'); svg.id = 'zw-svg';
  svg.innerHTML = nilpferdSvg(); $('zw-mitte').appendChild(svg);
  svg.querySelectorAll('.zw-zahn').forEach(z => Kern.tap(z, () => tippeZahn(Number(z.dataset.z))));
}
// Ausschnitt: auf schmalen Bildschirmen nur Kopf und Maul, damit die Zähne groß genug zum Antippen sind
function ausschnitt() {
  const m = $('zw-mitte'), r = m && m.clientHeight ? m.clientWidth / m.clientHeight : 1;
  return r < .75 ? '100 30 600 700' : r < 1.05 ? '60 0 680 790' : '0 0 800 840';
}
function nilpferdSvg() {
  const K = '#8f86d8', KH = '#a59de6', KD = '#6f66bd', SCH = '#b9b2ef', MUND = '#a33a62', MUNDH = '#c9476f', ZUNGE = '#ef8aa6', ROSA = '#f3a7c0';
  const defs = `<defs>
    <radialGradient id="zw-kopf" cx="45%" cy="30%" r="75%"><stop offset="0" stop-color="${KH}"/><stop offset="1" stop-color="${K}"/></radialGradient>
    <radialGradient id="zw-schnauze" cx="50%" cy="25%" r="80%"><stop offset="0" stop-color="#cdc7f6"/><stop offset="1" stop-color="${SCH}"/></radialGradient>
    <radialGradient id="zw-maul" cx="50%" cy="40%" r="70%"><stop offset="0" stop-color="${MUNDH}"/><stop offset="1" stop-color="${MUND}"/></radialGradient>
    <linearGradient id="zw-binde" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e9e3d6"/><stop offset=".5" stop-color="#fffdf7"/><stop offset="1" stop-color="#e9e3d6"/></linearGradient>
  </defs>`;
  // Körper und Füße
  let h = `<ellipse cx="400" cy="822" rx="330" ry="20" fill="rgba(0,0,0,.28)"/>
    <path d="M118 830C96 700 176 620 400 620C624 620 704 700 682 830Z" fill="url(#zw-kopf)"/>
    <g fill="${KD}"><rect x="170" y="748" width="120" height="80" rx="38"/><rect x="510" y="748" width="120" height="80" rx="38"/></g>
    <g fill="#e9e3f8">${[195, 230, 265, 535, 570, 605].map(x => `<ellipse cx="${x}" cy="824" rx="13" ry="8"/>`).join('')}</g>`;
  // Maulhöhle und Zunge (hinter den Zähnen)
  h += `<path d="M118 392Q400 300 682 392L700 530Q400 680 100 530Z" fill="url(#zw-maul)"/>
    <ellipse cx="400" cy="502" rx="186" ry="70" fill="${ZUNGE}"/><path d="M400 452v64" stroke="#d96a8a" stroke-width="5" stroke-linecap="round"/>`;
  // Unterkiefer: Lippe unterhalb der Zahnreihe
  h += `<path d="${unterkiefer()}" fill="url(#zw-kopf)" pointer-events="none"/>
    <path d="M282 688Q400 716 518 688" fill="none" stroke="${KD}" stroke-width="6" stroke-linecap="round" opacity=".45"/>
    <g fill="${KD}" opacity=".4"><circle cx="300" cy="660" r="5"/><circle cx="330" cy="674" r="5"/><circle cx="470" cy="674" r="5"/><circle cx="500" cy="660" r="5"/></g>`;
  // Zähne
  h += '<g id="zw-zaehne">' + ZAHN.map((z, i) => `<g class="zw-zahn" data-z="${i}" transform="translate(${z.x.toFixed(1)} ${z.y.toFixed(1)}) rotate(${z.r.toFixed(1)})">
      <rect class="hit" x="${-z.w / 2 - 6}" y="${-z.h - 14}" width="${z.w + 12}" height="${z.h + 34}"/>
      <g class="zk"><rect class="z" x="${-z.w / 2}" y="${-z.h}" width="${z.w}" height="${z.h + 16}" rx="${z.w * .42}"/>
      <rect class="g" x="${-z.w / 2 + 3}" y="${-z.h * .25}" width="${z.w - 6}" height="${z.h * .25 + 12}" rx="6"/>
      <rect class="l" x="${-z.w / 2 + 6}" y="${-z.h + 8}" width="${z.w * .22}" height="${z.h * .45}" rx="4"/></g></g>`).join('') + '</g>';
  // Zahnfleischkante vor den Zahnwurzeln
  h += `<path d="${zahnfleisch()}" fill="none" stroke="${ROSA}" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" pointer-events="none"/><g id="zw-wund" pointer-events="none"></g>`;
  // Oberkopf (klappt beim Zuschnappen herunter)
  h += `<g id="zw-oben" pointer-events="none" style="transform-box:view-box;transform-origin:400px 120px">
    <path d="M128 372C110 300 120 210 170 150C220 90 300 70 400 70C500 70 580 90 630 150C680 210 690 300 672 372Q400 300 128 372Z" fill="url(#zw-kopf)"/>
    <circle cx="190" cy="92" r="40" fill="${K}"/><circle cx="610" cy="92" r="40" fill="${K}"/><circle cx="190" cy="92" r="20" fill="${ROSA}"/><circle cx="610" cy="92" r="20" fill="${ROSA}"/>
    <path d="M150 368C140 290 180 220 260 200Q400 170 540 200C620 220 660 290 650 368Q400 304 150 368Z" fill="url(#zw-schnauze)"/>
    <g fill="${KD}"><ellipse cx="335" cy="236" rx="22" ry="13" transform="rotate(-14 335 236)"/><ellipse cx="465" cy="236" rx="22" ry="13" transform="rotate(14 465 236)"/></g>
    <g fill="#fffdf7" stroke="#c9b9a6" stroke-width="3"><path d="M196 360Q210 410 226 352Z"/><path d="M604 360Q590 410 574 352Z"/></g>
    <ellipse cx="225" cy="300" rx="34" ry="18" fill="${ROSA}" opacity=".55"/><ellipse cx="575" cy="300" rx="34" ry="18" fill="${ROSA}" opacity=".55"/>
    <g id="zw-augen"></g>
    <path d="M140 300C130 240 140 180 180 140L206 154C176 196 170 248 176 300Z" fill="url(#zw-binde)" stroke="#d8d0bf" stroke-width="2"/>
    <path d="M660 300C670 240 660 180 620 140L594 154C624 196 630 248 624 300Z" fill="url(#zw-binde)" stroke="#d8d0bf" stroke-width="2"/>
    <path d="M180 140C240 76 330 58 400 58C470 58 560 76 620 140L594 154C540 104 470 88 400 88C330 88 260 104 206 154Z" fill="url(#zw-binde)" stroke="#d8d0bf" stroke-width="2"/>
    <g stroke="#d8d0bf" stroke-width="2" fill="#fffdf7"><path d="M398 70C370 30 320 20 318 46C316 70 360 76 398 74Z"/><path d="M402 70C430 30 480 20 482 46C484 70 440 76 402 74Z"/>
      <path d="M392 76L372 120L392 112Z"/><path d="M408 76L428 120L408 112Z"/><circle cx="400" cy="72" r="13"/></g>
  </g>
  <g id="zw-aua" opacity="0" pointer-events="none"></g>`;
  return defs + h;
}
const bogen = (i, d) => { const u = i / 6 - 1; return [400 + 262 * u, BOGEN_Y(u) + d]; };
const pfad = pts => pts.map(p => p.map(v => v.toFixed(1)).join(' ')).join('L');
function zahnfleisch() {
  // rosa Band über den Zahnwurzeln (als dicke Linie mit runden Enden)
  const pts = []; for (let i = -0.3; i <= 12.31; i += .2) pts.push(bogen(i, 8));
  return 'M' + pfad(pts);
}
function unterkiefer() {
  // Oberkante folgt knapp unter dem Zahnfleisch, außen breite runde Backen
  const kante = []; for (let i = -0.6; i <= 12.61; i += .2) kante.push(bogen(i, 14));
  const [lx, ly] = kante[0], [rx, ry] = kante[kante.length - 1];
  return `M${lx.toFixed(1)} ${ly.toFixed(1)}L${pfad(kante)}C${rx + 40} ${ry - 8} ${rx + 70} ${ry + 20} ${rx + 70} ${ry + 70}C${rx + 50} ${ry + 220} 570 740 400 740C230 740 ${lx - 50} ${ly + 220} ${lx - 70} ${ly + 70}C${lx - 70} ${ly + 20} ${lx - 40} ${ly - 8} ${lx} ${ly}Z`;
}
function augen(stufe, blick) {
  // stufe 0..3 nervöser, 4 = gebissen (zugekniffen)
  const ax = [300, 500], ay = 150, r = 44 + Math.min(stufe, 3) * 3;
  let h = '';
  ax.forEach((x, k) => {
    h += `<circle cx="${x}" cy="${ay + 8}" r="${r + 10}" fill="#8f86d8"/>`;
    if (stufe === 4) { h += `<path d="M${x - 26} ${ay - 12}L${x + 22} ${ay + 8}L${x - 26} ${ay + 26}" fill="none" stroke="#1d1d33" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" transform="${k ? `scale(-1 1) translate(${-2 * x} 0)` : ''}"/>`; return; }
    h += `<ellipse cx="${x}" cy="${ay}" rx="${r - 6}" ry="${r - 4}" fill="#fff"/>`;
    const px = x + blick[0] * 12, py = ay + blick[1] * 12 + 6;
    h += `<circle cx="${px}" cy="${py}" r="${17 - stufe}" fill="#1d1d33"/><circle cx="${px - 6}" cy="${py - 7}" r="5" fill="#fff"/>`;
    // Lid und Braue: je nervöser, desto schräger
    const neig = [0, 8, 14, 20][stufe], s = k ? -1 : 1;
    h += `<path d="M${x - 40} ${ay - r + 2 - neig * s * .2} Q${x} ${ay - r - 18} ${x + 40} ${ay - r + 2 + neig * s * .2}" fill="none" stroke="#5b5299" stroke-width="9" stroke-linecap="round" transform="rotate(${neig * s} ${x} ${ay - r})"/>`;
  });
  if (stufe >= 2) h += `<path class="zw-schweiss" d="M640 190C628 210 626 222 640 226C654 222 652 210 640 190Z" fill="#9fe0f0" stroke="#5aaec4" stroke-width="2"/>`;
  if (stufe >= 3) h += `<path class="zw-schweiss" style="animation-delay:1.1s" d="M162 210C150 230 148 242 162 246C176 242 174 230 162 210Z" fill="#9fe0f0" stroke="#5aaec4" stroke-width="2"/>`;
  return h;
}

/* ---------- Zeichnen ---------- */
function zeichne(blick = [0, .6]) {
  if (!stage || !$('zw-zaehne')) return;
  const darf = S.phase === 'spiel' && !S.zu && Netz.binDran(S.am) && !busy;
  stage.style.setProperty('--pc', farben[S.am]);
  stage.querySelectorAll('.zw-zahn').forEach(el => {
    const z = Number(el.dataset.z), unten = S.gedrueckt.includes(z), wund = S.zu && S.schnapp === z;
    el.classList.toggle('unten', unten && !wund); el.classList.toggle('wund', wund); el.classList.toggle('lockt', darf && !unten);
  });
  const w = S.zu && S.schnapp != null ? ZAHN[S.schnapp] : null;
  $('zw-wund').innerHTML = w && !offenGleich ? `<g transform="translate(${w.x} ${w.y}) rotate(${w.r})"><path class="zw-puls" d="M${-w.w / 2 - 14} ${-w.h - 6}l-14 -12M0 ${-w.h - 16}v-18M${w.w / 2 + 14} ${-w.h - 6}l14 -12"/></g>` : '';
  $('zw-augen').innerHTML = augen(ZW.nervoes(S), blick);
  // Spielerleiste
  $('zw-leiste').innerHTML = namen.map((nm, p) => {
    const pk = S.modus === 'punkte' ? `<span class="pk k-zahl">${S.punkte[p] ? Array(S.punkte[p]).fill('<i></i>').join('') : '0'}</span>` : '';
    const am = (S.phase === 'spiel' && !S.zu && p === S.am) || (S.zu && p === S.gebissen);
    return `<div class="zw-pl${am ? ' am' : ''}${S.raus[p] ? ' raus' : ''}" style="--pc:${farben[p]}"><span class="k-dot" style="--pc:${farben[p]}">${Kern.esc(nm.charAt(0).toUpperCase())}</span><span class="nm">${Kern.esc(nm)}</span>${Netz.laeuft && p === ich() ? '<span class="du">du</span>' : ''}${pk}</div>`;
  }).join('');
  // Fuß
  const fuss = $('zw-fuss'); fuss.classList.toggle('am', S.phase === 'spiel' && !S.zu);
  fuss.style.setProperty('--pc', S.zu ? farben[S.gebissen] : farben[S.am]);
  $('zw-satz').innerHTML = satz();
  fuss.querySelectorAll('.k-btn').forEach(b => b.remove());
  if (S.phase === 'rundenende' && !busy) {
    if (!Netz.laeuft || Netz.istHost) { const b = Kern.el('button', 'k-btn gut', 'Nächste Runde'); b.id = 'zw-weiter'; Kern.tap(b, () => Netz.tun('runde')); fuss.appendChild(b); }
  }
}
function satz() {
  const nm = namen[S.am], frei = ZW.frei(S).length, runde = S.modus === 'eine' ? '' : ` · Runde ${S.runde}${S.rundenZiel ? ' von ' + S.rundenZiel : ''}`;
  if (S.zu) {
    const g = namen[S.gebissen], selbst = Netz.laeuft && S.gebissen === ich();
    const was = S.modus === 'raus' ? (selbst ? 'Du bist raus.' : `${Kern.esc(g)} ist raus.`) : S.modus === 'punkte' ? `Ein Zahnwehpunkt für ${selbst ? 'dich' : Kern.esc(g)}.` : '';
    if (S.phase === 'rundenende') return `Aua! ${selbst ? 'Dich' : Kern.esc(g)} hat es erwischt. ${was}<small>${Netz.laeuft && !Netz.istHost ? `${Kern.esc(namen[0])} spannt das Maul neu.` : 'Das Maul wird für die nächste Runde neu gespannt.'}</small>`;
    return `Aua! ${selbst ? 'Dich' : Kern.esc(g)} hat es erwischt. ${was}`;
  }
  const rest = `<small>Noch ${frei} ${frei === 1 ? 'Zahn' : 'Zähne'} oben${runde}</small>`;
  if (!Netz.binDran(S.am)) return `${Kern.esc(nm)} sucht einen Zahn aus …${rest}`;
  if (Netz.laeuft) return `Du bist dran: Drück einen Zahn.${rest}`;
  return `${Kern.esc(nm)}, drück einen Zahn.${rest}`;
}

/* ---------- Bedienung ---------- */
function tippeZahn(z) {
  if (!S || busy) return;
  if (S.phase !== 'spiel' || S.zu) return;
  if (!Netz.binDran(S.am)) { Kern.ton('fehler'); return Kern.hinweis(`${namen[S.am]} ist dran.`); }
  if (S.gedrueckt.includes(z)) { Kern.ton('fehler'); return Kern.hinweis('Dieser Zahn ist schon unten. Nimm einen anderen.'); }
  if (Netz.istGast) { const el = document.querySelector(`.zw-zahn[data-z="${z}"]`); el && el.classList.add('unten'); } // gleich nachgeben, der Gastgeber bestätigt
  Netz.tun('druecken', {z});
}
async function druecken(z) {
  if (busy || S.phase !== 'spiel' || S.zu || S.gedrueckt.includes(z)) return Netz.melden();
  busy = true; const alt = S;
  try {
    S = ZW.druecken(S, z); speichern(); Netz.melden();
    await effekte(alt, S);
  } finally { busy = false; zeichne(); Netz.melden(); }
  if (S.phase === 'ende') { await Kern.warte(500); ende(); }
}
function naechsteRunde() {
  if (S.phase !== 'rundenende') return Netz.melden();
  S = ZW.naechsteRunde(S, zufall); speichern(); zeichne(); Netz.melden();
  Kern.ton('runde'); spannen();
}
/** Bewegung aus dem Unterschied zweier Stände: Zahn sinkt, Maul zuckt oder schnappt zu. */
async function effekte(alt, neu) {
  const neuer = neu.gedrueckt.filter(z => !alt.gedrueckt.includes(z));
  if (!neuer.length) { zeichne(); return; }
  const z = neuer[neuer.length - 1], zahn = ZAHN[z];
  const blick = [(zahn.x - 400) / 232, .9];
  if (neu.zu) {
    // Spannung: Zahn geht runter, kurze Stille, dann schnappt es zu
    zeichneOhneSchnapp(neu, blick);
    Kern.ton('stein');
    await Kern.warte(380);
    offenGleich = true; zeichne(blick);
    await schnappen();
    offenGleich = false; zeichne(blick);
    return;
  }
  zeichne(blick); Kern.ton('stein');
  if (Math.random() < .3 + .4 * neu.gedrueckt.length / neu.zaehne) zucken();
  await Kern.warte(260);
}
function zeichneOhneSchnapp(neu, blick) { const echt = S; S = Object.assign({}, neu, {zu: false, phase: 'spiel'}); try { zeichne(blick); } finally { S = echt; } }
function zucken() {
  const o = $('zw-oben'); if (!o || !o.animate || REDUZIERT) return;
  o.animate([{transform: 'translateY(0)'}, {transform: 'translateY(16px)', offset: .3}, {transform: 'translateY(-4px)', offset: .65}, {transform: 'translateY(0)'}], {duration: 320, easing: 'ease-out'});
  Kern.ton('tipp');
}
async function schnappen() {
  const o = $('zw-oben'), svg = $('zw-svg');
  schnappTon(); ruetteln([90, 50, 180]);
  if (o && o.animate && !REDUZIERT) {
    o.animate([{transform: 'translateY(0) scaleY(1)', easing: 'ease-out'}, {transform: 'translateY(-16px) scaleY(1.02)', offset: .1, easing: 'cubic-bezier(.75,0,1,.7)'},
      {transform: 'translateY(206px) scaleY(.93)', offset: .2, easing: 'ease-out'}, {transform: 'translateY(192px) scaleY(.97)', offset: .28},
      {transform: 'translateY(196px) scaleY(.96)', offset: .8, easing: 'cubic-bezier(.3,.8,.4,1)'}, {transform: 'translateY(0) scaleY(1)'}], {duration: 1800, easing: 'linear'});
    setTimeout(() => { svg.classList.remove('zw-wackel'); void svg.getBBox(); svg.classList.add('zw-wackel'); aua(); }, 360);
    await Kern.warte(1820);
  } else { aua(); await Kern.warte(400); }
  svg.classList.remove('zw-wackel');
  Kern.ton('fehler');
}
function aua() {
  const a = $('zw-aua'); if (!a) return;
  const cx = 640, cy = 150;
  const zack = Array.from({length: 18}, (_, i) => { const t = i / 18 * Math.PI * 2, r = i % 2 ? 58 : 96; return `${(cx + r * Math.cos(t) * 1.45).toFixed(1)},${(cy + r * Math.sin(t)).toFixed(1)}`; }).join(' ');
  a.innerHTML = `<g transform="rotate(-10 ${cx} ${cy})"><polygon points="${zack}" fill="#ffd34d" stroke="#e8792f" stroke-width="6" stroke-linejoin="round"/><text x="${cx}" y="${cy + 19}" text-anchor="middle" font-family="var(--f-disp)" font-weight="800" font-size="56" fill="#a3311f">AUA!</text></g>`;
  if (a.animate && !REDUZIERT) a.animate([{opacity: 0, transform: 'scale(.3)'}, {opacity: 1, transform: 'scale(1.12)', offset: .2}, {opacity: 1, transform: 'scale(1)', offset: .85}, {opacity: 0, transform: 'scale(1.04)'}], {duration: 1400, easing: 'ease-out'});
  a.style.transformBox = 'view-box'; a.style.transformOrigin = `${cx}px ${cy}px`;
}
function spannen() {
  // neue Runde: Maul öffnet sich weit und alle Zähne springen hoch
  const o = $('zw-oben'); if (o && o.animate && !REDUZIERT) o.animate([{transform: 'translateY(190px)'}, {transform: 'translateY(-20px)', offset: .6}, {transform: 'translateY(0)'}], {duration: 600, easing: 'cubic-bezier(.3,.8,.4,1)'});
}

/* ---------- Ende ---------- */
async function ende() {
  if (ENDE_FE) return;
  zeichne();
  let t, u;
  const liste = ps => ps.map(p => Kern.esc(namen[p])).join(', ').replace(/, ([^,]*)$/, ' und $1');
  if (S.modus === 'eine') { t = `${namen[S.gebissen]} wurde gebissen`; u = `Gewonnen haben ${liste(S.sieger)}.`; }
  else if (S.modus === 'raus') { t = `${namen[S.sieger[0]]} gewinnt!`; u = `Als Letzte oder Letzter übrig – alle anderen hat das Nilpferd erwischt.`; }
  else {
    t = S.sieger.length > 1 ? 'Geteilter Sieg!' : `${namen[S.sieger[0]]} gewinnt!`;
    u = 'Zahnwehpunkte nach fünf Runden:<br>' + [...Array(S.n).keys()].sort((a, b) => S.punkte[a] - S.punkte[b]).map(p => `${Kern.esc(namen[p])}: <b class="k-zahl">${S.punkte[p]}</b>`).join('<br>');
  }
  Kern.ton('sieg'); Kern.feier();
  if (Netz.laeuft) Netz.ereignis({daten: {ende: t}});
  const w = await dialog(t, u, [{text: 'Nochmal', wert: 'nochmal', art: 'gut'}, {text: 'Nilpferd ansehen', wert: 'sehen', art: 'leise'}, {text: 'Neues Spiel', wert: 'neu', art: 'leise'}]);
  if (w === 'nochmal') return Netz.tun('nochmal');
  if (w === 'neu') return neuesSpiel();
  const l = Kern.el('div', 'zw-ende'); $('zw-mitte').appendChild(l);
  const b = Kern.el('button', 'k-btn gut', 'Nochmal'), c = Kern.el('button', 'k-btn leise', 'Neues Spiel');
  Kern.tap(b, () => Netz.tun('nochmal')); Kern.tap(c, neuesSpiel); l.append(b, c);
}
function nochmal() { S = ZW.nochmal(S, zufall); speichern(); aufbauen(); zeichne(); Netz.melden(); spannen(); }
function neuesSpiel() { if (Netz.aktiv) Netz.verlassen(); Kern.speicher.loeschen(); startseite(); }
function dialog(titel, text, knoepfe) {
  return new Promise(res => {
    const box = Kern.el('div', '', `<h2>${Kern.esc(titel)}</h2><p>${text}</p>`), zeile = Kern.el('div', 'k-knoepfe'); box.appendChild(zeile);
    const fe = Kern.fenster(box, {schliessbar: false}); ENDE_FE = fe;
    knoepfe.forEach(b => { const k = Kern.el('button', 'k-btn' + (b.art ? ' ' + b.art : ''), Kern.esc(b.text)); k.onclick = () => { ENDE_FE = null; fe.schliessen(); res(b.wert); }; zeile.appendChild(k); });
  });
}

Kern.init({id: 'zahnweh', name: 'Zahnweh', akzent: '#f0849f', regeln: REGELN, onNeu: () => { Kern.speicher.loeschen(); startseite(); }});

/* ---------- Netzspiel ----------
   Gastgeber = Sitz 0. Nur er kennt den wunden Zahn: zustand() schickt den Stand ohne ihn (Zahnweh.sicht), erst nach dem
   Zuschnappen steht er darin. Drücken darf nur das Gerät der Person am Zug; „Nächste Runde“ und „Nochmal“ nur der
   Gastgeber. Zahn sinken, Zucken und Zuschnappen leitet jedes Gerät aus dem Unterschied der Stände ab. */
// Mitspieler: Stände der Reihe nach zeigen; trifft während einer Bewegung ein neuer ein, folgt er danach.
let LAEUFT = false, WARTE = null;
async function nachziehen(alt) {
  LAEUFT = true; busy = true;
  try { await effekte(alt, S); }
  finally { LAEUFT = false; busy = false; zeichne(); }
  if (WARTE) { const w = WARTE; WARTE = null; uebernehmen(w); }
}
function uebernehmen(d) {
  const alt = S;
  S = d.S; namen = d.namen; farben = d.farben;
  if (setupZiel) { setupZiel.remove(); setupZiel = null; }
  document.querySelectorAll('.k-scroll').forEach(e => e.remove());
  if (ENDE_FE && S.phase !== 'ende') { ENDE_FE.schliessen(); ENDE_FE = null; }
  const neueRunde = alt && (S.runde !== alt.runde || S.gedrueckt.length < alt.gedrueckt.length);
  if (!stage || !$('zw-zaehne') || !alt || (neueRunde && S.runde < alt.runde)) { aufbauen(); zeichne(); return; }
  if (neueRunde) { zeichne(); spannen(); Kern.ton('runde'); return; }
  nachziehen(alt);
}
Netz.einrichten({
  spiel: 'zahnweh', min: 2, max: 6,
  starten(spieler, o) {
    const start = o.start === 'zufall' ? Kern.zufall(spieler.length) : 0;
    beginnen({S: ZW.neu({anzahl: spieler.length, modus: o.modus, start, zufall}), namen: spieler.map(p => p.name), farben: spieler.map(p => p.farbe), opt: o});
  },
  aktion(name, d, sitz) {
    if (!S) return;
    if (sitz !== null) { const darf = (name === 'runde' || name === 'nochmal') ? sitz === 0 : sitz === S.am; if (!darf) return Netz.melden(); }
    if (name === 'druecken') { const z = Number(d.z); if (!(Number.isInteger(z) && z >= 0 && z < S.zaehne)) return Netz.melden(); return druecken(z); }
    if (name === 'runde') return naechsteRunde();
    if (name === 'nochmal') return S.phase === 'ende' ? nochmal() : Netz.melden();
    Netz.melden();
  },
  zustand: () => ({S: ZW.sicht(S), namen, farben}),
  stand(d) { if (LAEUFT) { WARTE = d; return; } uebernehmen(d); },
  ereignis(d) {
    if (!d.ende) return;
    const gewonnen = Array.isArray(S.sieger) && S.sieger.includes(ich());
    Kern.ton(gewonnen ? 'sieg' : 'runde'); if (gewonnen) Kern.feier();
    Kern.hinweis(`${d.ende} – ${namen[0]} entscheidet, wie es weitergeht.`, 4000);
  },
  beendet: () => startseite(),
});
startseite();
addEventListener('resize', () => { const v = $('zw-svg'); if (v) v.setAttribute('viewBox', ausschnitt()); if (S && stage) zeichne(); });
window.__test = {zustand: () => S, zahn: (...z) => { TEST.zahn.push(...z); }, laden: s => { S = s; speichern(); zeichne(); Netz.melden(); }, busy: () => busy};
</script>
