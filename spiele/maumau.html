<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="icon" href="../icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c2430">
<title>Mau-Mau · Spieltisch</title>
<link rel="stylesheet" href="../gemeinsam/kern.css">
<style>
/* Mau-Mau: französische Karten des Kerns, Akzent Pflaume. Wunsch und Ziehpflicht stehen als große Marken an der Ablage. */
.mm-buehne{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px}
.mm-oben{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding-left:118px;padding-right:118px;min-height:56px;align-content:flex-start}
.mm-platz{display:flex;align-items:center;gap:9px;min-width:0;padding:6px 12px 6px 7px;border-radius:14px;background:var(--panel);border:1px solid var(--line);
  transition:box-shadow .3s, background-color .3s;position:relative}
.mm-platz.dran{background:rgba(9,32,42,.92);box-shadow:inset 0 0 0 2px var(--pc), 0 0 22px color-mix(in srgb,var(--pc) 35%,transparent)}
.mm-platz .k-dot{width:30px;height:30px;font-size:14px}
.mm-platz b{display:block;font-size:15px;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mm-platz small{display:flex;gap:10px;color:var(--ink2);font-size:13px;white-space:nowrap}
.mm-platz small i{font-style:normal;color:var(--ink);font-weight:700}
.mm-mini{display:inline-block;width:10px;height:14px;border-radius:2px;background:#e8f1ee;opacity:.8;vertical-align:-2px;margin-right:3px;box-shadow:3px -2px 0 -1px rgba(232,241,238,.45)}
.mm-platz .mm-eins{position:absolute;right:-6px;top:-7px;background:var(--akzent);color:#2a1030;font:800 12px var(--f-ui);border-radius:99px;padding:1px 7px}
.mm-platz .mm-naechst{position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);font:700 10px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;
  background:var(--sea);border:1px solid var(--line);color:var(--ink2);border-radius:99px;padding:0 6px;white-space:nowrap}
.mm-luecke{display:none}

.mm-mitte{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--pw)*.15 + 6px);min-height:0}
.mm-tisch{display:flex;align-items:center;gap:calc(var(--pw)*.5)}
.mm-stapel,.mm-ablage{position:relative;width:var(--pw);height:calc(var(--pw)*1.4);--kw:var(--pw)}
.mm-stapel{cursor:pointer;border-radius:calc(var(--pw)*.11)}
.mm-stapel .k-karte,.mm-ablage .k-karte{position:absolute;left:0;top:0}
.mm-stapel .k-karte:nth-child(1){transform:translate(6px,6px)}.mm-stapel .k-karte:nth-child(2){transform:translate(3px,3px)}
.mm-stapel.ziel::after,.mm-ablage.ziel::after{content:"";position:absolute;inset:-7px;border-radius:calc(var(--pw)*.16);box-shadow:0 0 0 3px var(--akzent);
  animation:mm-puls 1.5s ease-in-out infinite;pointer-events:none}
.mm-ablage.ueber::after{content:"";position:absolute;inset:-9px;border-radius:calc(var(--pw)*.17);box-shadow:0 0 0 5px var(--akzent);pointer-events:none}
@keyframes mm-puls{0%,100%{opacity:1}50%{opacity:.35}}
.mm-ablage .k-karte.alt1{transform:rotate(-10deg) translate(-7%,2%)}
.mm-ablage .k-karte.alt2{transform:rotate(8deg) translate(6%,1%)}
.mm-ablage .k-karte.neu{animation:mm-ein .38s cubic-bezier(.2,.8,.3,1)}
@keyframes mm-ein{from{transform:translateY(40%) scale(.85) rotate(-6deg);opacity:0}}
.mm-cap{position:absolute;left:50%;top:calc(100% + 12px);transform:translateX(-50%);white-space:nowrap;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.mm-cnt{position:absolute;right:-10px;top:-10px;z-index:3;min-width:30px;height:30px;padding:0 7px;border-radius:99px;background:#e8f1ee;color:#132f4a;
  font:700 14px var(--f-ui);display:grid;place-items:center}
/* Marke an der Ablage: gewünschte Farbe bzw. offene Ziehpflicht */
.mm-marke{position:absolute;left:calc(100% + 14px);top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:2px;
  background:#fbf8f1;color:#1e2a30;border-radius:16px;padding:8px 12px;box-shadow:0 6px 18px rgba(0,0,0,.35);font:800 13px var(--f-ui);letter-spacing:.06em;text-transform:uppercase;
  animation:k-hoch .3s cubic-bezier(.2,.8,.3,1);white-space:nowrap}
.mm-marke big{font:800 calc(var(--pw)*.42)/1 var(--f-disp);letter-spacing:0;text-transform:none}
.mm-marke.rot big{color:#c0392b}
.mm-marke.zieh{background:var(--akzent);color:#2a1030}
.mm-infos{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:calc(var(--pw)*.06 + 10px)}
.mm-infos .k-chip{font-size:14px;padding:.3em .8em}
.mm-satz{font-size:clamp(17px,2vw,21px);text-align:center;line-height:1.3;max-width:min(760px,96vw);text-wrap:balance;min-height:1.3em}
.mm-satz b{color:var(--pc,var(--akzent));font-family:var(--f-disp);font-weight:800}
.mm-log{font-size:15px;color:var(--ink2);text-align:center;min-height:1.2em;max-width:min(760px,96vw)}
.mm-wahl{display:flex;flex-direction:column;align-items:center;gap:10px;background:rgba(6,21,28,.92);border:1px solid var(--line);border-radius:20px;padding:12px 18px;max-width:620px}
.mm-wahl p{margin:0;text-align:center;color:#d2e2e0}

.mm-unten{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.mm-leiste{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;min-height:52px}
#mm-ruf.an{background:var(--akzent);color:#2a1030}
.mm-hand{position:relative;height:calc(var(--hw)*1.4 + 22px);--kw:var(--hw)}
.mm-hand .k-karte{position:absolute;top:18px;transition:transform .18s, opacity .25s, filter .25s, left .3s cubic-bezier(.3,.7,.3,1);touch-action:none}
.mm-hand .k-karte.ja{cursor:pointer}
.mm-hand .k-karte.ja:hover{transform:translateY(-8px)}
.mm-hand .k-karte.nein{filter:brightness(.55) saturate(.8)}
.mm-hand .k-karte.frisch{transform:translateY(-14px);outline:3px solid var(--akzent);outline-offset:2px}
.mm-hand .k-karte.weg{opacity:.25}
.mm-hand .k-karte.neuhand{animation:mm-hand .4s cubic-bezier(.2,.8,.3,1) both}
@keyframes mm-hand{from{transform:translateY(-60%);opacity:0}}
.mm-geist{position:fixed;left:0;top:0;z-index:120;pointer-events:none;--kw:var(--hw)}

/* Fenster */
.mm-farben{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.mm-farben button{min-height:84px;border-radius:18px;border:0;background:#fbf8f1;color:#1e2a30;font:800 22px var(--f-disp);display:flex;align-items:center;justify-content:center;gap:10px;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.4),0 4px 12px rgba(0,0,0,.3)}
.mm-farben button span{font-size:38px;line-height:1}
.mm-farben button.rot{color:#c0392b}
.mm-wahl .mm-farben{grid-template-columns:repeat(4,1fr);width:min(520px,82vw);margin:0}
.mm-wahl .mm-farben button{min-height:60px;font-size:18px}
.mm-wahl .mm-farben button span{font-size:28px}
.mm-tab{width:100%;border-collapse:collapse;margin:10px 0 4px;font-size:16px}
.mm-tab td,.mm-tab th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.mm-tab th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.mm-tab .r{text-align:right;font-variant-numeric:tabular-nums}
.mm-tab .sieg td{color:var(--akzent);font-weight:700}
.mm-reste{display:flex;gap:3px;flex-wrap:wrap;--kw:30px}
.mm-meldung{position:fixed;left:50%;top:40%;transform:translateX(-50%);z-index:300;pointer-events:none;background:#f4efe4;color:#14262b;font-weight:700;
  padding:11px 20px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 40px);text-align:center;animation:k-hoch .25s cubic-bezier(.2,.8,.3,1)}
.mm-meldung.gross{white-space:nowrap;font:800 34px var(--f-disp);padding:14px 30px;background:var(--akzent);color:#2a1030}
.mm-start{display:flex;--kw:76px}
@media (prefers-reduced-motion:reduce){.mm-hand .k-karte,.mm-ablage .k-karte{animation:none!important;transition:none!important}}
/* Telefon hoch: Plätze als Raster (erste Zelle frei für die Kopfknöpfe) */
@media (max-width:700px){
  .mm-buehne{gap:6px}
  .mm-oben{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px 6px;padding:0;min-height:46px;align-content:start}
  .mm-luecke{display:block;min-height:46px}
  .mm-platz{gap:6px;padding:4px 6px 4px 4px;border-radius:12px;min-height:46px}
  .mm-platz .k-dot{width:24px;height:24px;font-size:12px}
  .mm-platz > span:nth-child(2){min-width:0}
  .mm-platz b{font-size:14px;max-width:none}
  .mm-platz small{font-size:13px;gap:7px}
  .mm-platz .mm-naechst{font-size:11px;bottom:-10px}
  .mm-mitte{gap:calc(var(--pw)*.12 + 4px)}
  .mm-tisch{gap:calc(var(--pw)*.3)}
  .mm-marke{left:calc(100% + 8px);padding:6px 9px;font-size:11px;border-radius:13px}
  .mm-marke big{font-size:calc(var(--pw)*.34)}
  .mm-satz{font-size:16px}
  .mm-infos{gap:6px;margin-top:calc(var(--pw)*.06 + 14px)}
  .mm-infos .k-chip{font-size:13px;padding:.25em .65em}
  .mm-log{font-size:13px;line-height:1.3}
  .mm-cap{font-size:12px;top:calc(100% + 8px)}
  .mm-unten{gap:8px}
  .mm-leiste{gap:8px;min-height:46px}
  .mm-leiste > .k-btn{flex:1 1 0;min-height:46px;padding:4px 10px;font-size:15px;white-space:normal;line-height:1.15;border-radius:12px}
  .mm-leiste > .mm-wahl{flex:1 1 100%;padding:10px 12px}
  .mm-wahl .mm-farben{width:100%;gap:8px}
  .mm-tab{font-size:15px}
  .mm-tab td,.mm-tab th{padding:7px 4px}
  .mm-tab td:first-child{white-space:nowrap}
  .mm-reste{--kw:24px}
  .mm-farben button{min-height:70px}
}
</style>
</head>
<body class="chart">
<script src="../gemeinsam/kern.js"></script>
<script src="../gemeinsam/netz.js"></script>
<script src="maumau.logik.js"></script>
<script>
"use strict";
(() => {
const M = window.MauMau;
const AKZENT = '#d49be6';
const esc = Kern.esc;
const TEST = {rnd: null};
const R = n => TEST.rnd ? TEST.rnd(n) : Kern.zufall(n);
const HANDY = matchMedia('(max-width:700px)');
let S = null, OFFEN = null, BUSY = false, WEITERGEBEN = false, FRISCH = new Set(), START = null, B = null, ZULETZT_OBEN = null;

const REGELN = `
<p>Werde als Erste oder Erster alle Handkarten los. Gespielt wird mit 32 französischen Karten (7 bis Ass in Kreuz ♣, Pik ♠, Herz ♥ und Karo ♦).</p>
<h3>Ablauf</h3>
<p>Alle bekommen 5 Karten, eine Karte liegt offen in der Mitte. Reihum legst du eine Karte, die in <b>Farbe oder Rang</b> zur obersten passt. Kannst oder willst du nicht legen, ziehst du eine Karte. Passt sie, darfst du genau diese sofort legen – oder behalten. Passt sie nicht, ist die nächste Person dran.</p>
<h3>Sonderkarten</h3>
<ul>
<li><b>7:</b> Die nächste Person zieht 2 Karten, damit ist ihr Zug vorbei. Mit der Option „Sieben weitergeben“ darf sie stattdessen selbst eine 7 legen – dann zieht die übernächste 4, und so weiter.</li>
<li><b>8:</b> Die nächste Person setzt aus. Zu zweit bist du gleich noch einmal dran.</li>
<li><b>Bube:</b> passt auf jede Karte, nur nicht auf einen Buben. Du wünschst dir eine Farbe; die nächste Person muss diese Farbe legen oder ziehen.</li>
<li><b>Ass:</b> Mit der Option „Ass: noch einmal“ legst du nach einem Ass gleich noch eine Karte (oder ziehst).</li>
</ul>
<h3>Mau und Mau-Mau</h3>
<p>Bevor du deine vorletzte Karte legst, tippst du <b>„Mau!“</b>, bevor du die letzte legst, <b>„Mau-Mau!“</b>. Vergessen kostet eine Strafkarte – wer beim Ausmachen „Mau-Mau“ vergisst, ist dann nicht draußen. Das Spiel passt selbst auf.</p>
<h3>Erste Karte</h3>
<p>7: Die Person nach dem Geber zieht 2. 8: Sie setzt aus. Bube: Sie wünscht sich die Farbe und spielt dann.</p>
<h3>Wertung</h3>
<p>Wer alle Karten los ist, gewinnt die Runde. War die letzte Karte eine 7, zieht die nächste Person die Karten noch. Alle anderen schreiben die Punkte ihrer Restkarten auf: 7 bis 10 nach Augen, Dame 3, König 4, Ass 11, Bube 20. Sobald jemand 100 Punkte hat, ist das Spiel vorbei – es gewinnt, wer die <b>wenigsten</b> Punkte hat. Oder ihr spielt nur bis zum ersten Sieger. Ist der Stapel leer, wird die Ablage bis auf die oberste Karte gemischt. Der Geber wechselt jede Runde.</p>`;

Kern.init({id: 'maumau', name: 'Mau-Mau', akzent: AKZENT, regeln: REGELN,
  onNeu: () => { Kern.speicher.loeschen(); startseite(); }, menue: [{text: 'Punktestand', aktion: () => punkteFenster()}]});

/* ---------- Karten ---------- */
function karteHtml(k, cls = '') {
  if (!k) return '';
  const e = Kern.karte({rang: k.r, farbe: k.f});
  if (cls) e.className += ' ' + cls.trim();
  e.dataset.id = k.id; e.setAttribute('aria-label', M.name(k));
  return e.outerHTML;
}
const rueckHtml = (cls = '') => `<div class="k-karte zu ${cls}"></div>`;
const rot = f => f === 'herz' || f === 'karo';
function frage({titel = '', text = '', knoepfe = []}) {
  return new Promise(res => {
    const box = Kern.el('div'); box.innerHTML = `<h2>${esc(titel)}</h2><p>${text}</p><div class="k-knoepfe"></div>`;
    let wert = null; const fe = Kern.fenster(box, {schliessbar: false, beimSchliessen: () => res(wert)});
    knoepfe.forEach(b => { const k = Kern.el('button', 'k-btn ' + (b.art || ''), esc(b.text)); k.onclick = () => { wert = b.wert; fe.schliessen(); }; box.querySelector('.k-knoepfe').appendChild(k); });
  });
}
/* Kurzer Hinweis über der Hand (der Kern-Hinweis läge unten auf den Karten). */
function hinweis(text, ms = 2600, gross = false) {
  document.querySelectorAll('.mm-meldung').forEach(e => e.remove());
  const m = Kern.el('div', 'mm-meldung' + (gross ? ' gross' : ''), esc(text)); document.body.appendChild(m);
  const h = B && B.querySelector('.mm-leiste'); if (h) m.style.top = Math.max(70, h.getBoundingClientRect().top - (gross ? 84 : 64)) + 'px';
  setTimeout(() => m.remove(), ms);
}

/* ---------- Netzspiel: Hilfen ---------- */
const NETZ = () => Netz.laeuft;
const meins = sitz => sitz == null || !Netz.laeuft || sitz === Netz.meinSitz;
function sag(sitz, text, ms) { if (meins(sitz)) hinweis(text, ms); else Netz.ereignis({daten: {an: sitz, hinweis: text, ms}}); }
const ichDran = () => (NETZ() ? S.dran === Netz.meinSitz : OFFEN === S.dran);
const amEnde = () => S.phase === 'rundenende' || S.phase === 'spielende';
let WERT_FE = null, WERT_MARKE = '', LETZTE_HAND = null;

/* ---------- Startseite ---------- */
function startseite() {
  document.querySelectorAll('.mm-buehne').forEach(e => e.remove());
  if (WERT_FE) { WERT_FE.schliessen(); WERT_FE = null; }
  WERT_MARKE = ''; LETZTE_HAND = null; WEITERGEBEN = false;
  if (!START) { START = Kern.el('div', 'k-scroll chart'); document.body.appendChild(START); }
  START.hidden = false; S = null; OFFEN = null;
  const alt = Kern.speicher.laden(), lauf = alt && alt.s && alt.s.phase !== 'spielende' ? alt.s : null;
  const bsp = [{f: 'herz', r: '7'}, {f: 'pik', r: 'B'}, {f: 'karo', r: 'A'}, {f: 'kreuz', r: '8'}];
  Kern.setup({
    ziel: START, titel: 'Mau-Mau', unter: 'Farbe auf Farbe, Bild auf Bild – und wer fast fertig ist, sagt Mau.',
    bild: `<div class="mm-start">${bsp.map((k, i) => `<div style="transform:translateY(${Math.abs(i - 1.5) * 10}px) rotate(${(i - 1.5) * 9}deg);margin-left:${i ? -24 : 0}px">${karteHtml({id: -1 - i, ...k})}</div>`).join('')}</div>`,
    fakten: ['2–6 Personen', '32 Karten', 'ca. 20 Minuten'],
    spieler: {min: 2, max: 6, standard: 3},
    optionen: [
      {id: 'wertung', label: 'Spieldauer', werte: [{wert: 'punkte', text: 'Bis 100 Punkte'}, {wert: 'eine', text: 'Bis zum ersten Sieger'}], standard: 'punkte'},
      {id: 'sieben', label: 'Sieben', werte: [{wert: 'nein', text: 'Zwei ziehen'}, {wert: 'stapeln', text: 'Sieben weitergeben'}], standard: 'nein'},
      {id: 'ass', label: 'Ass', werte: [{wert: 'nein', text: 'Ohne Wirkung'}, {wert: 'nochmal', text: 'Noch einmal legen'}], standard: 'nein'},
      {id: 'mau', label: 'Mau sagen', werte: [{wert: 'strafe', text: 'Vergessen = Strafkarte'}, {wert: 'aus', text: 'Ohne Mau'}], standard: 'strafe'},
      {id: 'hand', label: 'Handkarten', werte: [{wert: 5, text: '5 Karten'}, {wert: 6, text: '6 Karten (bis 5 Personen)'}], standard: 5},
    ],
    fortsetzen: lauf ? `Runde ${lauf.runde} · ${lauf.namen.join(', ')}` : null,
    onFortsetzen: () => { S = lauf; spielen(); },
    onStart: ({namen, farben, optionen}) => { neuesSpiel(namen, farben, optionen); }
  });
}
function neuesSpiel(namen, farben, opt) {
  S = M.neu({namen, opt}, R); S.farben = farben; speichern();
  if (NETZ()) { LETZTE_HAND = null; buehneBauen(); Netz.melden(); return; }
  spielen();
}
const speichern = () => Kern.speicher.speichern({s: S});

/* ---------- Spielfläche ---------- */
function spielen() { buehneBauen(); weiterAn(); }
function buehneBauen() {
  if (START) START.hidden = true;
  document.querySelectorAll('.mm-buehne').forEach(e => e.remove());
  B = Kern.el('div', 'k-buehne mm-buehne');
  B.innerHTML = `<div class="mm-oben"></div><div class="mm-mitte"></div><div class="mm-unten"><div class="mm-leiste"></div><div class="mm-hand"></div></div>`;
  document.body.appendChild(B);
  OFFEN = null; ZULETZT_OBEN = M.oben(S).id;
  masse(); zeichnen();
}
function masse() {
  if (!B) return;
  const W = innerWidth, H = innerHeight, hoch = H > W * 1.05;
  let hw = Math.round(Math.max(56, Math.min(hoch ? 150 : 126, W / (hoch ? 5.6 : 9.4), H * (hoch ? 0.13 : 0.17))));
  let pw = Math.round(Math.max(60, Math.min(hoch ? 200 : 156, H * (hoch ? 0.17 : 0.19), W / (hoch ? 4.2 : 7.5))));
  if (HANDY.matches && hoch) { hw = Math.round(Math.min(W / 5.4, H * .115)); pw = Math.round(Math.min(W / 4, H * .15)); }
  B.style.setProperty('--hw', hw + 'px'); B.style.setProperty('--pw', pw + 'px');
}
addEventListener('resize', () => { if (B && S) zeichnen(); });

const nm = i => esc(S.namen[i]);
const farbe = i => S.farben[i];
function zeichnen() {
  if (!B || !S) return;
  masse();
  const netz = NETZ(), ich = netz ? Netz.meinSitz : null;
  const offen = netz ? S.dran === ich && !amEnde() : OFFEN !== null && (OFFEN === S.dran || WEITERGEBEN) && !amEnde();
  if (netz) { const ids = S.haende[ich].map(k => k.id); if (LETZTE_HAND) ids.forEach(id => { if (!LETZTE_HAND.has(id)) FRISCH.add(id); }); LETZTE_HAND = new Set(ids); }
  // Plätze
  const naechst = M.weiter(S, S.dran), hervor = WEITERGEBEN ? OFFEN : S.dran;
  B.querySelector('.mm-oben').innerHTML = '<div class="mm-luecke"></div>' + S.namen.map((n, i) => `<div class="mm-platz${i === hervor && !amEnde() ? ' dran' : ''}" style="--pc:${farbe(i)}" id="mm-platz-${i}">
    <span class="k-dot">${esc(n.charAt(0).toUpperCase())}</span><span><b>${esc(n)}${netz && i === ich ? ' (du)' : ''}</b><small><span><span class="mm-mini"></span><i class="k-zahl">${S.haende[i].length}</i></span>${S.opt.wertung === 'punkte' ? `<span><i class="k-zahl">${S.punkte[i]}</i> P</span>` : ''}</small></span>
    ${S.haende[i].length === 1 && !amEnde() ? '<span class="mm-eins">1</span>' : ''}${i === naechst && i !== S.dran && !amEnde() && !WEITERGEBEN ? '<span class="mm-naechst">danach</span>' : ''}</div>${netz && i === 0 ? '<div class="mm-luecke"></div>' : ''}`).join('');
  // Mitte
  const top = M.oben(S), alt = S.ablage.slice(-3, -1);
  const darfZiehen = offen && S.phase === 'zug' && !WEITERGEBEN;
  let marke = '';
