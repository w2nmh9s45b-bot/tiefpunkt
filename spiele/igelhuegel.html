<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="icon" href="../icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c2430">
<title>Igelhügel · Spieltisch</title>
<link rel="stylesheet" href="../gemeinsam/kern.css">
<style>
.ih-stage{padding:0}
.ih-drei{position:absolute;inset:0;touch-action:none}
.ih-drei canvas{display:block;width:100%;height:100%;outline:none;-webkit-tap-highlight-color:transparent}
.ih-liste{position:absolute;z-index:5;top:max(12px,var(--sicher-o));left:50%;transform:translateX(-50%);display:flex;gap:8px;max-width:calc(100% - 300px);
  justify-content:center;flex-wrap:wrap;pointer-events:none}
.ih-pl{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 7px;border-radius:99px;background:var(--panel);border:2px solid var(--line);
  font-weight:700;font-size:15px;white-space:nowrap;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);transition:border-color .3s,box-shadow .3s}
.ih-pl.am{border-color:var(--pc);background:rgba(9,32,42,.88);box-shadow:0 0 18px color-mix(in srgb,var(--pc) 40%,transparent)}
.ih-pl.aus{opacity:.5}
.ih-pl .nm{max-width:110px;overflow:hidden;text-overflow:ellipsis}
.ih-pips{display:flex;gap:3px}
.ih-pip{width:11px;height:11px;border-radius:50%;background:var(--pc);box-shadow:inset 0 0 0 1.5px rgba(0,0,0,.25)}
.ih-pip.pfad{background:transparent;box-shadow:inset 0 0 0 2.5px var(--pc)}
.ih-pip.raus{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-stark);position:relative}
.ih-pip.raus::after{content:"";position:absolute;left:5px;top:-1px;width:1.5px;height:13px;background:var(--ink3);transform:rotate(45deg)}
.ih-pip.ziel{background:#fff;box-shadow:0 0 0 2px var(--pc)}
.ih-leiste{position:absolute;z-index:6;left:50%;transform:translateX(-50%);bottom:max(12px,var(--sicher-u));width:min(860px,calc(100% - 24px));
  display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:16px;align-items:center;padding:12px 14px;border-radius:22px;
  background:rgba(7,24,32,.82);border:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 16px 40px rgba(0,0,0,.35)}
.ih-kplatz{display:flex;align-items:center;gap:10px}
.ih-stapel{position:relative;width:58px;height:82px;flex:none}
.ih-stapel svg,.ih-karte svg{display:block;width:100%;height:100%}
.ih-stapel .zahl{position:absolute;right:-6px;bottom:-6px;min-width:26px;height:24px;padding:0 6px;border-radius:99px;background:var(--papier);color:var(--papier-ink);
  font:800 13px/24px var(--f-ui);text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.ih-karte{width:66px;height:94px;flex:none;perspective:400px}
.ih-karte .in{width:100%;height:100%;transform-style:preserve-3d}
.ih-karte.dreht .in{animation:ih-flip .5s cubic-bezier(.3,.7,.3,1)}
@keyframes ih-flip{0%{transform:translateX(-70px) rotateY(180deg) scale(.88)}100%{transform:none}}
.ih-karte.leer{border-radius:10px;box-shadow:inset 0 0 0 2px var(--line);opacity:.6}
.ih-mitte{min-width:0;display:flex;flex-direction:column;gap:8px}
.ih-text{font-size:18px;line-height:1.3;color:var(--ink)}
.ih-text b{color:var(--pc,var(--akzent))}
.ih-text small{display:block;color:var(--ink2);font-size:14px;margin-top:2px}
.ih-wahl{display:flex;gap:8px;flex-wrap:wrap}
.ih-wahl:empty{display:none}
.ih-opt{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:0 13px 0 9px;border-radius:12px;border:1px solid var(--line);
  background:var(--panel-hell);font-weight:700;font-size:15px;white-space:nowrap}
.ih-opt .k-dot{width:18px;height:18px}
.ih-opt[aria-pressed="true"]{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 22%,transparent);box-shadow:0 0 0 2px var(--pc)}
.ih-opt.loch{border-style:dashed;border-color:var(--fehler)}
.ih-opt.loch em{font-style:normal;color:var(--fehler);font-size:13px}
.ih-akt .k-btn{min-width:190px}
.ih-akt .k-btn.puls{animation:ih-puls 1.6s ease-in-out infinite}
@keyframes ih-puls{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--akzent) 55%,transparent)}50%{box-shadow:0 0 0 9px transparent}}
.ih-ohne{position:absolute;inset:0;display:grid;place-items:center;padding:120px 24px 220px;text-align:center;color:var(--ink2);pointer-events:none}
.ih-ohne b{display:block;color:var(--ink);font-size:20px;margin-bottom:6px}
.ih-ohne .loecher{margin-top:10px;color:var(--ink)}
.ih-ende{position:absolute;left:50%;transform:translateX(-50%);bottom:max(12px,var(--sicher-u));display:flex;gap:10px;z-index:7}
.ih-hilfe{position:absolute;z-index:5;right:max(14px,var(--sicher-r));bottom:calc(max(12px,var(--sicher-u)) + 130px);font-size:13px;color:var(--ink3);pointer-events:none;text-align:right}
@media (max-aspect-ratio:1/1){.ih-liste{max-width:calc(100% - 260px)}}
/* Telefon hoch: Spielerliste rechts neben den Kopfknöpfen, Leiste unten über die ganze Breite */
@media (max-width:700px){
  .ih-liste{left:calc(max(10px,var(--sicher-l)) + 108px);right:max(10px,var(--sicher-r));transform:none;max-width:none;display:grid;grid-template-columns:repeat(2,max-content);justify-content:end;gap:5px}
  .ih-netz .ih-liste{right:calc(max(10px,var(--sicher-r)) + 92px);grid-template-columns:max-content}
  .ih-pl{font-size:12.5px;padding:4px 8px 4px 4px;gap:5px}
  .ih-pl .nm{max-width:52px}
  .ih-pl .k-dot{width:18px;height:18px;font-size:10px}
  .ih-pip{width:7px;height:7px}
  .ih-pip.pfad{box-shadow:inset 0 0 0 2px var(--pc)}
  .ih-pip.raus::after{left:3.5px;top:-1px;height:10px}
  .ih-pips{gap:2px}
  .ih-leiste{width:calc(100% - 16px);bottom:max(8px,var(--sicher-u));grid-template-columns:auto minmax(0,1fr);gap:10px 12px;padding:10px 12px;border-radius:18px}
  .ih-stapel{width:40px;height:57px}
  .ih-stapel .zahl{min-width:22px;height:20px;font-size:11px;line-height:20px;right:-5px;bottom:-5px}
  .ih-karte{width:48px;height:68px}
  .ih-text{font-size:16px}
  .ih-text small{font-size:13px}
  .ih-akt{grid-column:1/-1}
  .ih-akt .k-btn{width:100%;min-width:0}
  .ih-opt{min-height:42px;font-size:14px;padding:0 10px 0 7px}
  .ih-hilfe{display:none}
  .ih-ende{width:max-content;max-width:calc(100% - 20px)}
}
</style>
</head>

<script src="../gemeinsam/kern.js"></script>
<script src="../gemeinsam/netz.js"></script>

<script type="module">
/* ===================== 3D-Ansicht (three.js) ===================== */
import * as THREE from '../gemeinsam/three.module.min.js';
const REDUZIERT = matchMedia('(prefers-reduced-motion: reduce)').matches;
const R_HUEGEL = 6.4, H_HUEGEL = 3.3, R_ENDE = 1.05, R_ANF = 5.65, WINDUNGEN = 2.25, TH0 = Math.PI * 0.62;
const hoehe = r => r >= R_HUEGEL ? 0 : H_HUEGEL * 0.5 * (1 + Math.cos(Math.PI * r / R_HUEGEL));
const spiral = t => { const r = R_ANF - (R_ANF - R_ENDE) * t, th = TH0 - t * WINDUNGEN * Math.PI * 2; return {r, th, x: r * Math.cos(th), z: r * Math.sin(th), y: hoehe(r)}; };

// Feldpunkte 1..28 mit gleichen Abständen entlang der Spirale
const FELD = [null];
(() => {
  const N = 3000, pts = [], len = [0];
  for (let i = 0; i <= N; i++) { const p = spiral(i / N); pts.push(p); if (i) { const q = pts[i - 1]; len.push(len[i - 1] + Math.hypot(p.x - q.x, p.y - q.y, p.z - q.z)); } }
  const L = len[N], a0 = 0.35; // Feld 1 kurz nach dem Anfang
  let j = 0;
  for (let k = 1; k <= 28; k++) {
    const ziel = a0 + (L - a0) * (k - 1) / 27;
    while (j < N && len[j + 1] < ziel) j++;
    const p = pts[j], q = pts[Math.min(N, j + 1)];
    FELD.push({x: p.x, y: p.y, z: p.z, r: p.r, th: p.th, dir: Math.atan2(q.x - p.x, q.z - p.z)});
  }
})();
const STARTPLATZ = (p, i) => { // Startwiese vor dem Aufgang
  const f = FELD[1], aus = Math.atan2(f.z, f.x), seit = aus + (p - 1.5) * 0.25 + (i % 2 ? 0.065 : -0.065);
  const r = 7.05 + Math.floor(i / 2) * 0.78 + Math.abs(p - 1.5) * 0.12;
  return {x: r * Math.cos(seit), y: 0, z: r * Math.sin(seit)};
};

function sanft(k) { return k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2; }
function rausS(k) { const c = 1.6; return 1 + (c + 1) * Math.pow(k - 1, 3) + c * Math.pow(k - 1, 2); }

function erstellen(huelle, {farben = [], onTipp = () => {}, onHuepf = () => {}} = {}) {
  let renderer;
  try {
    const probe = document.createElement('canvas');
    if (!(probe.getContext('webgl2') || probe.getContext('webgl'))) return null;
    renderer = new THREE.WebGLRenderer({antialias: true, alpha: true, powerPreference: 'high-performance'});
  } catch (e) { return null; }
  const klein = Math.min(innerWidth, innerHeight) < 700;
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, klein ? 2 : 1.75));
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  renderer.setClearColor(0x000000, 0);
  huelle.appendChild(renderer.domElement);
  const szene = new THREE.Scene();
  szene.fog = new THREE.Fog(0x0c2430, 40, 90);
  const kamera = new THREE.PerspectiveCamera(36, 1, 0.5, 120);

  /* ---------- Licht ---------- */
  szene.add(new THREE.HemisphereLight(0xe6f4ff, 0x2d4a36, 1.35));
  const sonne = new THREE.DirectionalLight(0xfff1d6, 2.4);
  sonne.position.set(-7, 14, 9); sonne.castShadow = true;
  sonne.shadow.mapSize.set(klein ? 1024 : 2048, klein ? 1024 : 2048);
  Object.assign(sonne.shadow.camera, {left: -11, right: 11, top: 11, bottom: -11, near: 2, far: 40});
  sonne.shadow.bias = -0.0006; sonne.shadow.normalBias = 0.03; sonne.shadow.radius = 3;
  szene.add(sonne);
  const fuell = new THREE.DirectionalLight(0x9fd9ff, 0.45); fuell.position.set(8, 6, -6); szene.add(fuell);

  const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({color: c, roughness: .85, metalness: 0}, o));
  const mesh = (g, m, schatten = true, empf = true) => { const x = new THREE.Mesh(g, m); x.castShadow = schatten; x.receiveShadow = empf; return x; };

  /* ---------- Sockel und Hügel ---------- */
  const sockel = new THREE.Group(); szene.add(sockel);
  const erde = mesh(new THREE.CylinderGeometry(9.5, 9.2, 0.7, 72), [M(0x6b4527), M(0x3e7a3c, {roughness: .95}), M(0x3a2414)], false, true);
  erde.position.y = -0.35; sockel.add(erde);
  const rand = mesh(new THREE.TorusGeometry(9.5, 0.09, 8, 96), M(0x8c6238), false, false); rand.rotation.x = Math.PI / 2; rand.position.y = 0.0; sockel.add(rand);
  { // Hügel als Drehkörper, Farbe von unten (sattes Grün) nach oben (Lindgrün)
    const prof = []; for (let i = 0; i <= 48; i++) { const r = R_HUEGEL * (1 - i / 48); prof.push(new THREE.Vector2(Math.max(r, 0.0001), hoehe(r))); }
    const g = new THREE.LatheGeometry(prof, 96); const c = [], col = new THREE.Color(), a = new THREE.Color(0x3f8a3a), b = new THREE.Color(0x9ccf5f);
    const pos = g.attributes.position;
    for (let i = 0; i < pos.count; i++) { const k = Math.min(1, pos.getY(i) / H_HUEGEL); col.copy(a).lerp(b, Math.pow(k, 0.8)); const n = Math.sin(pos.getX(i) * 3.1) * Math.cos(pos.getZ(i) * 2.7) * 0.03; col.offsetHSL(0, 0, n); c.push(col.r, col.g, col.b); }
    g.setAttribute('color', new THREE.Float32BufferAttribute(c, 3));
    const h = mesh(g, M(0xffffff, {vertexColors: true, roughness: .95}), false, true); sockel.add(h);
  }
  { // Weg als Band auf dem Hügel
    const N = 600, b = 0.68, pos = [], idx = [], uvs = [];
    for (let i = 0; i <= N; i++) {
      const t = -0.03 + 1.03 * i / N, r0 = R_ANF - (R_ANF - R_ENDE) * t, th = TH0 - t * WINDUNGEN * Math.PI * 2;
      for (const s of [-1, 1]) { const r = Math.max(0.2, r0 + s * b); pos.push(r * Math.cos(th), hoehe(r) + 0.035, r * Math.sin(th)); uvs.push(s, t); }
      if (i) { const k = i * 2; idx.push(k - 2, k - 1, k, k - 1, k + 1, k); }
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2)); g.setIndex(idx); g.computeVertexNormals();
    const w = mesh(g, M(0xc7a77a, {roughness: 1, side: THREE.DoubleSide}), false, true); sockel.add(w);
  }
  // Treppe vom Startplatz zum ersten Feld
  { const f = FELD[1], aus = Math.atan2(f.z, f.x);
    for (let s = 0; s < 3; s++) {
      const r = 6.25 + s * 0.42, st = mesh(new THREE.BoxGeometry(0.42, 0.12 + (2 - s) * 0.1, 1.5), M(0xb88550), true, true);
      st.position.set(r * Math.cos(aus), (0.12 + (2 - s) * 0.1) / 2, r * Math.sin(aus)); st.rotation.y = -aus; sockel.add(st);
    }
    const pf = mesh(new THREE.CylinderGeometry(0.06, 0.07, 1.1, 8), M(0x7a5230)); pf.position.set(6.9 * Math.cos(aus - 0.17), 0.55, 6.9 * Math.sin(aus - 0.17)); sockel.add(pf);
    const schild = mesh(new THREE.BoxGeometry(0.75, 0.38, 0.06), M(0xe9d7b2)); schild.position.set(pf.position.x, 1.0, pf.position.z); schild.rotation.y = -aus + Math.PI / 2; sockel.add(schild);
  }

  /* ---------- Gras, Blumen, Büsche (Instanzen, fester Zufall) ---------- */
  let seed = 7; const zz = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const frei = (x, z) => { // nicht auf dem Weg, nicht auf Feldern, nicht am Baum
    const r = Math.hypot(x, z); if (r < 1.9 && r > 0.0) return false;
    for (let k = 1; k <= 28; k++) if (Math.hypot(FELD[k].x - x, FELD[k].z - z) < 0.95) return false;
    for (let t = 0; t <= 1; t += 0.004) { const p = spiral(t); if (Math.hypot(p.x - x, p.z - z) < 0.82) return false; }
    return true;
  };
  const platz = (anz, rMin, rMax) => { const o = []; let v = 0; while (o.length < anz && v++ < anz * 40) { const r = rMin + (rMax - rMin) * Math.sqrt(zz()), a = zz() * Math.PI * 2, x = r * Math.cos(a), z = r * Math.sin(a); if (frei(x, z)) o.push([x, z, r]); } return o; };
  const dummy = new THREE.Object3D();
  { const gp = platz(150, 1.5, 9.0), g = new THREE.ConeGeometry(0.07, 0.34, 5), im = new THREE.InstancedMesh(g, M(0x4f9a3c, {flatShading: true}), gp.length);
    gp.forEach(([x, z, r], i) => { dummy.position.set(x, hoehe(r) + 0.12, z); dummy.rotation.set((zz() - .5) * .5, zz() * 6, (zz() - .5) * .5); const s = 0.7 + zz() * 0.8; dummy.scale.set(s, s, s); dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix); });
    im.receiveShadow = true; sockel.add(im); }
  { const gp = platz(70, 1.6, 8.9), g = new THREE.IcosahedronGeometry(0.075, 0), im = new THREE.InstancedMesh(g, M(0xffffff, {roughness: .6}), gp.length), c = new THREE.Color();
    const tone = [0xfff6e0, 0xffd34d, 0xf4a6c6, 0xffffff, 0xb9a0f4];
    gp.forEach(([x, z, r], i) => { dummy.position.set(x, hoehe(r) + 0.1, z); dummy.rotation.set(0, 0, 0); dummy.scale.set(1, 1, 1); dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix); im.setColorAt(i, c.set(tone[i % tone.length])); });
    sockel.add(im); }
  { const gp = platz(16, 2.6, 8.8), g = new THREE.IcosahedronGeometry(0.42, 1), im = new THREE.InstancedMesh(g, M(0x3f7f34, {flatShading: true}), gp.length * 2);
    let k = 0; gp.forEach(([x, z, r]) => { for (let j = 0; j < 2; j++) { const s = 0.55 + zz() * 0.5; dummy.position.set(x + (j ? 0.32 : 0), hoehe(r) + s * 0.25, z + (j ? 0.12 : 0)); dummy.rotation.set(zz(), zz(), zz()); dummy.scale.set(s, s * 0.8, s); dummy.updateMatrix(); im.setMatrixAt(k++, dummy.matrix); } });
    im.castShadow = true; im.receiveShadow = true; sockel.add(im); }
  { const gp = platz(12, 2.2, 9.0), g = new THREE.DodecahedronGeometry(0.22, 0), im = new THREE.InstancedMesh(g, M(0xa7a39a, {flatShading: true}), gp.length);
    gp.forEach(([x, z, r], i) => { const s = 0.6 + zz() * 0.9; dummy.position.set(x, hoehe(r) + 0.05, z); dummy.rotation.set(zz() * 3, zz() * 3, zz() * 3); dummy.scale.set(s, s * 0.6, s); dummy.updateMatrix(); im.setMatrixAt(i, dummy.matrix); });
    im.castShadow = true; im.receiveShadow = true; sockel.add(im); }

  /* ---------- Felder ---------- */
  const HOHL = window.Igelhuegel.HOHL;
  const zahlTex = (n, hell) => { const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
    x.fillStyle = hell; x.fillRect(0, 0, 128, 128); x.fillStyle = 'rgba(70,48,25,.55)'; x.font = '700 46px "Atkinson Hyperlegible", system-ui, sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(String(n), 64, 68);
    const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t; };
  function hangLage(r, th, dir, anteil) {
    const dhdr = -H_HUEGEL * 0.5 * Math.PI / R_HUEGEL * Math.sin(Math.PI * Math.min(r, R_HUEGEL) / R_HUEGEL) * anteil;
    const n = new THREE.Vector3(-dhdr * Math.cos(th), 1, -dhdr * Math.sin(th)).normalize(), up = new THREE.Vector3(0, 1, 0);
    return new THREE.Quaternion().setFromUnitVectors(up, n).multiply(new THREE.Quaternion().setFromAxisAngle(up, dir));
  }
  const steinGeo = new THREE.CylinderGeometry(0.5, 0.56, 0.18, 28), lochGeo = new THREE.CircleGeometry(0.44, 28), rimGeo = new THREE.TorusGeometry(0.5, 0.075, 8, 28);
  const deckelGeo = new THREE.CylinderGeometry(0.47, 0.47, 0.09, 28), planke = new THREE.BoxGeometry(0.05, 0.02, 0.86);
  const steinSeite = M(0xd9c8a5), deckelSeite = M(0x7d532c), dunkel = new THREE.MeshBasicMaterial({color: 0x0a0706}), erdRand = M(0x4d321b, {roughness: 1}), plankenM = M(0x5c3b1e);
  const felder = [null], deckel = {}, trefferFelder = [];
  for (let k = 1; k <= 27; k++) {
    const f = FELD[k], g = new THREE.Group(); g.position.set(f.x, f.y, f.z);
    g.quaternion.copy(hangLage(f.r, f.th, f.dir, 0.8)); // an den Hang geneigt
    if (HOHL.includes(k)) {
      const loch = new THREE.Mesh(lochGeo, dunkel); loch.rotation.x = -Math.PI / 2; loch.position.y = 0.03; g.add(loch);
      const rim = mesh(rimGeo, erdRand, false, true); rim.rotation.x = Math.PI / 2; rim.position.y = 0.04; g.add(rim);
      const piv = new THREE.Group(); piv.position.set(0, 0.1, -0.47); g.add(piv);
      const d = mesh(deckelGeo, [deckelSeite, M(0xffffff, {map: zahlTex(k, '#a8743f')}), deckelSeite]); d.position.set(0, 0, 0.47); piv.add(d);
      for (const dx of [-0.17, 0.17]) { const pl = new THREE.Mesh(planke, plankenM); pl.position.set(dx, 0.055, 0.47); piv.add(pl); }
      deckel[k] = {piv, offen: 0}; d.userData.tipp = {art: 'feld', f: k}; trefferFelder.push(d);
    } else {
      const hell = ['#efe3c8', '#ebdcc0', '#f1e6cf'][k % 3];
      const s = mesh(steinGeo, [steinSeite, M(0xffffff, {map: zahlTex(k, hell)}), steinSeite]); s.position.y = 0.06; g.add(s);
      s.userData.tipp = {art: 'feld', f: k}; trefferFelder.push(s);
    }
    sockel.add(g); felder.push(g);
  }
  // Ziel: Holzdeck am Apfelbaum

<script>

  else wl.querySelectorAll('.ih-opt').forEach(b => b.setAttribute('aria-pressed', Number(b.dataset.i) === wahl));
  kn.textContent = knopfText; kn.disabled = !knopfAn; kn.classList.toggle('puls', puls); kn.hidden = S.phase === 'ende';
  if (ohne3D) { const o = $('ih-ohne'); o.hidden = false; o.innerHTML = `<div><b>Die 3D-Ansicht steht auf diesem Gerät nicht zur Verfügung.</b>Gespielt wird über die Leiste unten.<div class="loecher">${S.n ? S.igel.map((r, p) => `${Kern.esc(namen[p])}: ${r.map(x => x === 0 ? 'Wiese' : x === -1 ? 'Loch' : x === 28 ? 'Baum' : 'Feld ' + x).join(' · ')}`).join('<br>') : ''}</div></div>`; }
  // 3D-Markierungen
  if (drei) {
    if (S.phase === 'zug' && dran && frei) {
      const z = L.zuege(S), w = z.find(m => m.igel === wahl);
      drei.markieren({igel: z.map(m => [am, m.igel]), wahl: w ? [am, w.igel] : null, ziel: w ? w.nach : null, loch: !!(w && w.fiel)});
    } else drei.markieren({muehle: S.phase === 'drehen' && dran && frei});
  }
  requestAnimationFrame(rahmenMessen);
}

/* ---------- Bedienung ---------- */
function nichtDran() { Kern.ton('fehler'); Kern.hinweis(`${namen[S.am]} ist dran.`); }
function knopf() {
  if (!S || busy || animiert) return;
  if (!Netz.binDran(S.am)) return nichtDran();
  if (S.phase === 'ziehen') return Netz.tun('ziehen');
  if (S.phase === 'drehen') return Netz.tun('drehen');
  if (S.phase === 'zug' && wahl != null) { const i = wahl; wahl = null; return Netz.tun('zug', {igel: i}); }
}
function optTipp(i) {
  if (!S || busy || animiert || S.phase !== 'zug') return;
  if (!Netz.binDran(S.am)) return nichtDran();
  if (wahl === i) { wahl = null; return Netz.tun('zug', {igel: i}); }
  wahl = i; Kern.ton('tipp'); zeichne();
}
function tippe3D(t) {
  if (!S || S.phase === 'ende') return;
  if (busy || animiert) return;
  if (t.art === 'leer') return;
  const dran = Netz.binDran(S.am);
  if (t.art === 'muehle') {
    if (S.phase === 'drehen') return dran ? Netz.tun('drehen') : nichtDran();
    return Kern.hinweis(S.phase === 'ziehen' ? 'Die Windmühle dreht nur, wer die Windmühlen-Karte zieht.' : 'Erst hüpfen – die Karte zeigt Felder, keine Windmühle.');
  }
  if (S.phase !== 'zug') { if (S.phase === 'ziehen' && t.art === 'igel') Kern.hinweis(dran ? 'Zieh zuerst eine Karte.' : `${namen[S.am]} ist dran.`); return; }
  if (!dran) return nichtDran();
  const z = L.zuege(S);
  if (t.art === 'igel') {
    if (t.p !== S.am) return Kern.hinweis('Das ist nicht dein Igel.');
    let m = z.find(x => x.igel === t.i);
    if (!m) return Kern.hinweis('Dieser Igel kann nicht mehr ziehen.');
    if (m.gleich) m = z.find(x => x.neu && !x.gleich); // wartende Igel sind gleichwertig
    return optTipp(m.igel);
  }
  if (t.art === 'feld') {
    const w = z.find(m => m.igel === wahl);
    if (w && w.nach === t.f) { wahl = null; return Netz.tun('zug', {igel: w.igel}); }
    const m = z.find(x => x.nach === t.f && !x.gleich);
    if (m) return optTipp(m.igel);
  }
}

/* ---------- Züge (am Gerät bzw. beim Gastgeber) ---------- */
async function ausfuehren(fn) {
  if (busy) return Netz.melden();
  busy = true;
  const alt = S;
  try {
    S = fn(S);
  } catch (e) { busy = false; Kern.ton('fehler'); Kern.hinweis(e.message); zeichne(); return Netz.melden(); }
  wahl = null;
  if (S.phase === 'ende') Kern.speicher.loeschen(); else speichern();
  Netz.melden();
  zeichne();
  try { await zeigen(S); } finally { busy = false; }
  geraeusche(alt, S);
  zeichne();
  if (S.phase === 'ende') await ende();
}
function geraeusche(alt, s) {
  const l = s.letzt; if (!l) return;
  if (l.art === 'zug' && l.fiel) { Kern.ton('fehler'); Kern.hinweis(`Plumps! ${namen[l.spieler]}s Igel ist ins Erdloch gefallen.`); }
  if (l.art === 'drehen') {
    if (l.gefallen.length) { Kern.ton('fehler'); Kern.hinweis(l.gefallen.map(g => `${namen[g.spieler]}s Igel`).join(', ') + (l.gefallen.length > 1 ? ' sind' : ' ist') + ' ins Erdloch gefallen.'); }
    else Kern.ton('legen');
  }
  if (l.art === 'karte' && l.gemischt) Kern.hinweis('Der Stapel war leer – die Karten wurden neu gemischt.');
  const raus = alt && s.phase !== 'ende' && alt.am !== s.am && (s.am - alt.am + s.n) % s.n > 1;
  if (raus) Kern.hinweis('Wer keine Igel mehr hat, setzt aus.');
}
async function ende() {
  zeichne();
  let t, u;
  if (S.sieger === 'niemand') { t = 'Niemand gewinnt'; u = 'Alle Igel sind in Erdlöchern verschwunden.'; }
  else { t = `${namen[S.sieger]} gewinnt!`; u = `Ein Igel von ${Kern.esc(namen[S.sieger])} hat den Apfelbaum erreicht.`; Kern.ton('sieg'); Kern.feier(); }
  if (Netz.laeuft) Netz.ereignis({daten: {ende: t}});
  const w = await dialog(t, u, [{text: 'Nochmal', wert: 'nochmal', art: 'gut'}, {text: 'Hügel ansehen', wert: 'sehen', art: 'leise'}, {text: 'Neues Spiel', wert: 'neu', art: 'leise'}]);
  if (w === 'nochmal') return nochmal();
  if (w === 'neu') return neuesSpiel();
  const l = Kern.el('div', 'ih-ende'), a = Kern.el('button', 'k-btn gut', 'Nochmal'), b = Kern.el('button', 'k-btn leise', 'Neues Spiel');
  a.onclick = nochmal; b.onclick = neuesSpiel; l.append(a, b); stage.appendChild(l);
}
function nochmal() {
  const start = ((S.start || 0) + 1) % S.n;
  document.querySelectorAll('.ih-ende').forEach(e => e.remove());
  S = L.neu({anzahl: S.n, start}); wahl = null; gezeigt = null; speichern();
  zeigen(S); zeichne(); Netz.melden();
}
function neuesSpiel() { if (Netz.aktiv) Netz.verlassen(); Kern.speicher.loeschen(); startseite(); }
// Eigene Rückfrage: die gewählte Antwort darf beim Schließen nicht verloren gehen.
function dialog(titel, text, knoepfe) {
  return new Promise(res => {
    const box = Kern.el('div', '', `<h2>${Kern.esc(titel)}</h2><p>${text}</p>`), zeile = Kern.el('div', 'k-knoepfe'); box.appendChild(zeile);
    const fe = Kern.fenster(box, {schliessbar: false});
    knoepfe.forEach(b => { const k = Kern.el('button', 'k-btn' + (b.art ? ' ' + b.art : ''), Kern.esc(b.text)); k.onclick = () => { fe.schliessen(); res(b.wert); }; zeile.appendChild(k); });
  });
}

Kern.init({id: 'igelhuegel', name: 'Igelhügel', akzent: AKZENT, regeln: REGELN, onNeu: () => { Kern.speicher.loeschen(); startseite(); }});

/* Netzspiel: Gastgeber = Sitz 0. Er zieht Karten, mischt und kennt die Scheibe unter dem Hügel; die Mitspieler sehen
   den Stapel nur als Anzahl und die Scheibe gar nicht. Animationen entstehen beim Mitspieler aus dem Stand-Unterschied. */
Netz.einrichten({
  spiel: 'igelhuegel', min: 2, max: 4,
  starten(spieler, optionen) {
    const start = optionen.start === 'zufall' ? Kern.zufall(spieler.length) : 0;
    beginnen({S: L.neu({anzahl: spieler.length, start}), namen: spieler.map(p => p.name), farben: spieler.map(p => p.farbe), opt: optionen});
  },
  aktion(name, d, sitz) {
    if (!S || S.phase === 'ende') return Netz.melden();
    if (sitz !== null && sitz !== S.am) return Netz.melden(); // nicht dran
    if (name === 'ziehen' && S.phase === 'ziehen') return ausfuehren(s => L.ziehen(s));
    if (name === 'drehen' && S.phase === 'drehen') return ausfuehren(s => L.drehen(s));
    if (name === 'zug' && S.phase === 'zug') { const i = Number(d.igel); if (!Number.isInteger(i)) return Netz.melden(); return ausfuehren(s => L.ziehe(s, i)); }
    return Netz.melden();
  },
  zustand: () => ({S: L.oeffentlich(S), namen, farben}),
  async stand(d) {
    const alt = S, neu = d.S;
    const neuePartie = !alt || neu.n !== alt.n || neu.nr < alt.nr || (neu.zuege === 0 && neu.nr === 0 && alt.nr > 0);
    S = neu; namen = d.namen; farben = d.farben;
    if (setupZiel) { setupZiel.remove(); setupZiel = null; }
    document.querySelectorAll('.k-scroll').forEach(e => e.remove());
    if (neuePartie) { document.querySelectorAll('.ih-ende').forEach(e => e.remove()); gezeigt = null; wahl = null; }
    if (!stage) await aufbauen();
    if (alt && neu.am !== alt.am) wahl = null;
    zeichne();
    const vorher = gezeigt;
    await zeigen(neu);
    if (vorher && neu.nr === vorher.nr + 1) geraeusche(vorher, neu);
  },
  ereignis(d) {
    if (!d.ende) return;
    if (S && S.sieger !== 'niemand') { const ichs = S.sieger === ich(); Kern.ton(ichs ? 'sieg' : 'runde'); if (ichs) Kern.feier(); }
    Kern.hinweis(`${d.ende} – ${namen[0]} entscheidet, wie es weitergeht.`, 4000);
  },
  beendet: () => startseite(),
});
startseite();
addEventListener('resize', () => { if (S && stage) { zeichne(); } });
window.__test = {
  zustand: () => S, wahl: () => wahl, frei: () => !busy && animiert === 0, drei: () => drei, ohne3D: () => ohne3D,
  laden: s => { S = s; wahl = null; gezeigt = null; zeigen(S); zeichne(); },
  karteOben: k => { S.stapel.push(k); },              // nächste Karte festlegen (nur Gastgeber / am Gerät)
  scheibe: folge => { S.kurbel.folge = folge; S.kurbel.pos = -1; },
  punkt: was => drei && drei.bildschirm(was),
  ruhig: () => !drei || drei.ruhig(),
};
</script>
</body>
</html>
