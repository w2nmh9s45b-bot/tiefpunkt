<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="icon" href="../icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c2430">
<title>Rheinbaron · Spieltisch</title>
<link rel="stylesheet" href="../gemeinsam/kern.css">
<style>
/* Rheinbaron: helles Brett (Papier) als Ring auf dem Seekarten-Tisch, in der Mitte ein dunkles Kartenfenster mit
   dem Motiv der Ausgabe, dort stehen Würfel, wer dran ist, Kontostände und die nächsten Schritte.
   Felder an den Seiten sind zu ihrer Tischseite gedreht wie bei einem echten Brett. Präfix: .rb-
   Farben der Ausgabe (rheinbaron.ausgabe-*.js, design): --rb-papier, --rb-rand, --rb-mitte, --rb-motiv, --akzent. */
:root{--rb-papier:#f6f0e3;--rb-rand:#1b2a2f;--rb-mitte:#133a49;--rb-motiv:none}
.rb-buehne{padding:0}
#rb-brett{position:absolute;width:var(--B);height:var(--B);border-radius:calc(var(--c)*.1);background:color-mix(in srgb,var(--rb-papier) 92%,var(--rb-rand));
  box-shadow:0 26px 70px rgba(0,0,0,.5),0 0 0 2px var(--rb-rand);overflow:hidden;--fs:max(9px,calc(var(--w)*.155))}
.rb-feld{position:absolute;box-sizing:border-box;color:var(--rb-rand);background:var(--rb-papier);box-shadow:inset 0 0 0 .6px color-mix(in srgb,var(--rb-rand) 45%,transparent);overflow:hidden;
  cursor:pointer}
.rb-feld:active{filter:brightness(.95)}
.rb-in{position:absolute;display:flex;flex-direction:column;align-items:center;text-align:center;box-sizing:border-box}
.rb-bar{flex:none;width:100%;height:22%;background:var(--gc);display:flex;align-items:center;justify-content:center;gap:5%;
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.35)}
.rb-name{font:700 var(--fs)/1.06 var(--f-ui);padding:7% 4% 0;letter-spacing:-.01em;max-width:100%;box-sizing:border-box;overflow-wrap:break-word;-webkit-hyphens:manual;hyphens:manual}
.rb-name.auto,.rb-sub.auto,.rb-ecke-t.auto{-webkit-hyphens:auto;hyphens:auto}
.rb-sub{font-size:calc(var(--fs)*.82);color:color-mix(in srgb,var(--rb-rand) 70%,var(--rb-papier));margin-top:2%;font-weight:700;letter-spacing:.02em;max-width:100%;padding:0 3%;box-sizing:border-box;overflow-wrap:break-word}
.rb-preis{margin-top:auto;margin-bottom:calc(var(--c)*.155);font:700 calc(var(--fs)*.95) var(--f-ui);font-variant-numeric:tabular-nums}
.rb-ico{width:52%;height:auto;margin-top:6%;flex:none}
.rb-band{position:absolute;left:0;right:0;bottom:0;height:14%;background:var(--oc);display:none;place-items:center;
  font:800 calc(var(--fs)*.9) var(--f-ui);color:#0f2229;box-shadow:inset 0 1px 0 rgba(0,0,0,.35)}
.rb-feld.besessen .rb-band{display:grid}
.rb-feld.hy .rb-in::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(27,42,47,.20) 0 3px,transparent 3px 8px);pointer-events:none}
.rb-feld.hy .rb-band{background:repeating-linear-gradient(135deg,var(--oc) 0 5px,#fff 5px 8px)}
.rb-haus{width:16%;aspect-ratio:1/1;background:#fff;clip-path:polygon(50% 0,100% 42%,100% 100%,0 100%,0 42%);filter:drop-shadow(0 0 .6px #000)}
.rb-hotel{width:50%;height:62%;background:#fff;border-radius:2px;box-shadow:0 0 0 1px #1b2a2f;background-image:repeating-linear-gradient(90deg,transparent 0 18%,#1b2a2f 18% 28%);background-size:100% 40%;background-repeat:no-repeat;background-position:0 55%}
.rb-feld.ziel{z-index:3;animation:rb-puls 1.3s ease-in-out infinite;box-shadow:inset 0 0 0 3px var(--akzent),0 0 18px color-mix(in srgb,var(--akzent) 90%,transparent)}
@keyframes rb-puls{50%{box-shadow:inset 0 0 0 3px var(--akzent),0 0 4px color-mix(in srgb,var(--akzent) 40%,transparent)}}
.rb-feld.ecke .rb-in{justify-content:flex-start;padding:9% 6% 0;gap:3%}
.rb-ecke-t{font:800 calc(var(--fs)*1.35)/1 var(--f-disp);letter-spacing:-.02em;max-width:100%;overflow-wrap:break-word}
.rb-ecke-s{font:700 calc(var(--fs)*.9)/1.15 var(--f-ui);color:color-mix(in srgb,var(--rb-rand) 74%,var(--rb-papier));max-width:100%}
.rb-ecke-t.klein{font-size:calc(var(--fs)*1.12)}
.rb-besuch.rb-senk{left:6%;top:6%;writing-mode:vertical-rl;transform:rotate(180deg);font-size:calc(var(--fs)*.78)}
.rb-eck-img{display:block;flex:0 1 auto;min-height:0;height:auto;object-fit:contain}
/* Gefängnis-Ecke */
.rb-zelle{position:absolute;right:0;top:0;width:64%;height:64%;background:color-mix(in srgb,var(--rb-rand) 82%,#7d8a90);box-shadow:inset 0 0 0 2px var(--rb-rand);display:grid;place-items:center}
.rb-zelle .rb-eck-img{width:62%;max-height:84%;opacity:.95}
.rb-besuch{position:absolute;font:800 calc(var(--fs)*.85) var(--f-ui);letter-spacing:.05em;color:color-mix(in srgb,var(--rb-rand) 74%,var(--rb-papier));white-space:nowrap}
/* Figuren */
.rb-figur{position:absolute;width:var(--fg);height:var(--fg);margin:calc(var(--fg)*-.5) 0 0 calc(var(--fg)*-.5);z-index:6;pointer-events:none;
  transition:left .1s linear,top .1s linear;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.rb-figur.weit{transition:left .45s cubic-bezier(.4,.1,.2,1),top .45s cubic-bezier(.4,.1,.2,1)}
.rb-figur.dran{z-index:7;filter:drop-shadow(0 0 4px #fff) drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.rb-figur svg{width:100%;height:100%;display:block}
/* Mitte */
#rb-mitte{position:absolute;left:var(--c);top:var(--c);width:var(--M);height:var(--M);box-sizing:border-box;
  background:radial-gradient(ellipse at 50% 45%,color-mix(in srgb,var(--rb-mitte) 92%,#fff),color-mix(in srgb,var(--rb-mitte) 72%,#000) 75%);box-shadow:inset 0 0 0 2px var(--rb-rand),inset 0 10px 40px rgba(0,0,0,.35);
  padding:calc(var(--M)*.035);display:flex;flex-direction:column;gap:calc(var(--M)*.022);font-size:var(--mf);overflow:hidden}
#rb-fluss{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;background:var(--rb-motiv) center/cover no-repeat}
#rb-mitte > *:not(#rb-fluss){position:relative}
.rb-titel{text-align:center;font:800 calc(var(--mf)*.78) var(--f-disp);letter-spacing:.42em;color:rgba(232,241,238,.42);margin-bottom:-.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-titel.lang{letter-spacing:.22em}
.rb-titel.sehrlang{letter-spacing:.12em;font-size:calc(var(--mf)*.7)}
.rb-status{display:flex;align-items:center;gap:.7em;min-height:3.1em}
.rb-status .rb-fg{width:2.6em;height:2.6em;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
.rb-wer{display:block;font:800 1.3em/1.05 var(--f-disp);color:var(--pc);letter-spacing:-.02em}
.rb-satz{display:block;color:var(--ink);font-size:1.02em;line-height:1.25;text-wrap:balance}
.rb-aktion{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:calc(var(--M)*.028)}
.rb-wuerfel{display:flex;gap:calc(var(--M)*.03)}
.rb-knoepfe{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.rb-knoepfe .k-btn{font-size:max(15px,calc(var(--mf)*1.05))}
.rb-leise{color:var(--ink2);font-size:.9em;text-align:center;line-height:1.3;max-width:34em;text-wrap:balance}
.rb-leiste{display:flex;gap:8px;justify-content:center}
.rb-leiste .k-btn{min-height:44px;font-size:max(14px,calc(var(--mf)*.92))}
.rb-spieler{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:calc(var(--M)*.014)}
.rb-sk{position:relative;display:flex;align-items:center;gap:.5em;padding:.45em .6em;border-radius:12px;background:rgba(255,255,255,.06);
  box-shadow:inset 0 0 0 1px var(--line);min-width:0;text-align:left;border:0;color:var(--ink);font:inherit;min-height:46px}
.rb-sk.dran{background:color-mix(in srgb,var(--pc) 20%,rgba(7,24,32,.6));box-shadow:inset 0 0 0 2px var(--pc)}
.rb-sk.raus{opacity:.4}
/* Netzspiel: eigene Figur und eigenes Konto hervorgehoben, Handelsangebot */
.rb-sk.ich{outline:2px dashed var(--pc);outline-offset:2px}
.rb-sk .rb-du{font-size:.68em;font-weight:800;letter-spacing:.06em;text-transform:uppercase;margin-left:.4em;padding:.05em .45em;border-radius:99px;background:var(--pc);color:#0c2430;vertical-align:.12em}
.rb-figur.ich{filter:drop-shadow(0 0 3px var(--akzent)) drop-shadow(0 0 6px var(--akzent))}
.rb-angebot{border-radius:14px;padding:.6em .8em;background:color-mix(in srgb,var(--akzent) 12%,transparent);box-shadow:inset 0 0 0 2px var(--akzent);font-size:.95em;display:grid;gap:.5em}
.rb-angebot p{margin:0;color:var(--ink)}
.rb-angebot .rb-knoepfe{justify-content:flex-start}
.rb-sk svg{width:2em;height:2em;flex:none}
.rb-sk .rb-skn{font-weight:700;font-size:.92em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.rb-sk .rb-skg{font:800 1.12em var(--f-disp);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.rb-sk .rb-skx{font-size:.74em;color:var(--ink2);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-delta{position:absolute;right:.4em;top:-.6em;font:800 .82em var(--f-ui);padding:.1em .45em;border-radius:99px;background:var(--gut);color:#0d2416;
  animation:rb-delta 1.8s ease-out forwards;pointer-events:none}
.rb-delta.minus{background:var(--fehler);color:#2a0b07}
@keyframes rb-delta{0%{opacity:0;transform:translateY(6px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-6px)}}
/* Karten im Mittelfeld */
.rb-karte{width:min(100%,24em);background:#fbf8f1;color:#1b2a2f;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.45);overflow:hidden;
  animation:rb-karte .45s cubic-bezier(.2,.8,.3,1)}
@keyframes rb-karte{from{transform:rotateY(80deg) scale(.9);opacity:0}}
.rb-karte header{padding:.5em .9em;font:800 .85em var(--f-ui);letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--kc)}
.rb-karte p{margin:0;padding:.9em 1em 1.1em;font-size:1.05em;line-height:1.38}
.rb-urkunde{width:min(100%,22em);background:#fbf8f1;color:#1b2a2f;border-radius:12px;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.4);font-size:.9em}
.rb-urkunde header{background:var(--gc);color:var(--gi);padding:.45em .8em;text-align:center}
.rb-urkunde header small{display:block;font-size:.72em;letter-spacing:.12em;text-transform:uppercase;font-weight:700;opacity:.85}
.rb-urkunde header b{display:block;font:800 1.25em/1.1 var(--f-disp);letter-spacing:-.02em}
.rb-urkunde .rb-zeilen{padding:.5em .9em .7em;display:grid;grid-template-columns:1fr auto;gap:.12em 1em;font-variant-numeric:tabular-nums}
.rb-urkunde .rb-zeilen .t{grid-column:1/-1;border-top:1px solid #d9d0bf;margin:.25em 0}
.rb-urkunde .rb-zeilen b{text-align:right}
.rb-urkunde .rb-zeilen .an{background:rgba(92,196,138,.25);border-radius:4px}
.rb-urkunde .rb-ort{padding:0 .9em .7em;font-size:.86em;color:#5b6a6e;font-style:italic}
.rb-betrag{font:800 2.2em/1 var(--f-disp);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
/* Versteigerung */
.rb-auk{width:100%;display:flex;flex-direction:column;gap:6px}
.rb-auk-kopf{display:flex;align-items:baseline;justify-content:center;gap:.6em;flex-wrap:wrap;text-align:center}
.rb-auk-kopf b{font:800 1.9em var(--f-disp);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.rb-auk-z{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:12px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line)}
.rb-auk-z.hoch{box-shadow:inset 0 0 0 2px var(--pc);background:color-mix(in srgb,var(--pc) 18%,rgba(7,24,32,.6))}
.rb-auk-z.raus{opacity:.38}
.rb-auk-z svg{width:30px;height:30px;flex:none}
.rb-auk-z .n{flex:1;min-width:0;line-height:1.1}
.rb-auk-z .n b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb-auk-z .n small{color:var(--ink2)}
.rb-auk-z .k-btn{min-height:44px;padding:0 12px;font-size:15px;min-width:64px}
/* Seitenleiste */
.rb-seite{position:absolute;display:flex;flex-direction:column;gap:12px;color:var(--ink2);font-size:14px;overflow:hidden}
.rb-seite h3{font:700 12px var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);margin:0 0 6px}
.rb-seite .rb-log{display:flex;flex-direction:column;gap:6px;overflow:hidden}
.rb-seite .rb-log div{line-height:1.3;color:#c7d8d6}
.rb-seite .rb-log div:first-child{color:var(--ink)}
.rb-box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.rb-bank{display:flex;gap:6px 14px;max-width:16em;align-items:center;flex-wrap:wrap;font-variant-numeric:tabular-nums;color:var(--ink)}
.rb-bank span{display:flex;align-items:center;gap:6px}
.rb-bank i{display:inline-block;width:14px;height:13px;background:#fff;clip-path:polygon(50% 0,100% 42%,100% 100%,0 100%,0 42%)}
.rb-bank i.h{width:22px;height:13px;clip-path:none;border-radius:2px;background:#fff repeating-linear-gradient(90deg,transparent 0 18%,#1b2a2f 18% 28%) 0 55%/100% 40% no-repeat}
.rb-bank span{white-space:nowrap}
/* Fenster: Verwalten, Handeln, Wertung */
.rb-fwahl{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 14px}
.rb-fwahl button{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel-hell);font-weight:700}
.rb-fwahl button[aria-pressed="true"]{background:color-mix(in srgb,var(--pc) 28%,transparent);border-color:var(--pc)}
.rb-fwahl svg{width:24px;height:24px}
.rb-info{color:var(--ink2);margin:0 0 10px}
.rb-schuld{background:color-mix(in srgb,var(--fehler) 18%,transparent);border:1px solid var(--fehler);border-radius:12px;padding:10px 12px;margin-bottom:12px;color:var(--ink)}
.rb-gruppe{border-left:6px solid var(--gc);padding:2px 0 2px 10px;margin:10px 0}
.rb-gruppe h4{margin:0 0 4px;font:700 13px var(--f-ui);letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.rb-zeile{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-bottom:1px solid var(--line)}
.rb-zeile:last-child{border-bottom:0}
.rb-zeile .nm{flex:1 1 9em;min-width:0;font-weight:700}
.rb-zeile .nm small{display:block;font-weight:400;color:var(--ink2)}
.rb-zeile .k-btn{min-height:44px;font-size:15px;padding:0 12px}
.rb-leer{color:var(--ink2);font-style:italic}
.rb-handel{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:640px){.rb-handel{grid-template-columns:1fr}}
.rb-seiteh{background:var(--panel-hell);border:1px solid var(--line);border-radius:14px;padding:10px}
.rb-seiteh h4{margin:0 0 8px;font:800 18px var(--f-disp);color:var(--pc)}
.rb-chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.rb-chips button{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.04);font-size:15px}
.rb-chips button i{width:12px;height:12px;border-radius:3px;background:var(--gc);flex:none}
.rb-chips button[aria-pressed="true"]{background:var(--akzent);color:var(--akzent-ink);border-color:transparent;font-weight:700}
.rb-chips button:disabled{opacity:.45}
.rb-geld{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.rb-geld input{width:5.5em;height:44px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.06);text-align:center;font-size:18px;font-weight:700}
.rb-geld button{min-width:46px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel-hell);font-weight:700}
.rb-ok{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.rb-ok .k-btn{flex:1 1 12em}
.rb-ok .k-btn[aria-pressed="true"]{background:var(--gut);color:#0d2416}
.rb-wert{display:grid;grid-template-columns:auto auto 1fr auto auto auto auto;gap:6px 12px;align-items:center;font-variant-numeric:tabular-nums;margin:12px 0}
.rb-wert svg{width:28px;height:28px}
.rb-wert .k{color:var(--ink2);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.rb-wert b{font-family:var(--f-disp)}

/* ---------- Telefon hoch (iPhone): Brett oben über die ganze Breite, in seiner Mitte Spielerkarten, Bank und Zeit;
   darunter eine rollbare Leiste mit wer dran ist, Würfeln/Kaufen/Bieten und den Knöpfen. Felder antippen = Karte. */
.rb-zentrum{position:absolute;left:var(--c);top:var(--c);width:var(--M);height:var(--M);box-sizing:border-box;overflow:hidden;
  background:radial-gradient(ellipse at 50% 45%,color-mix(in srgb,var(--rb-mitte) 92%,#fff),color-mix(in srgb,var(--rb-mitte) 72%,#000) 75%);box-shadow:inset 0 0 0 2px var(--rb-rand),inset 0 10px 40px rgba(0,0,0,.35);
  padding:8px;display:flex;flex-direction:column;justify-content:center;gap:6px;font-size:13px}
.rb-zentrum > *:not(#rb-fluss){position:relative}
.rb-zentrum .rb-titel{font-size:13px;letter-spacing:.38em;margin:0}
.rb-zentrum .rb-titel.lang{letter-spacing:.2em}.rb-zentrum .rb-titel.sehrlang{letter-spacing:.1em;font-size:12px}
.rb-zentrum .rb-spieler{grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.rb-zentrum .rb-sk{min-height:40px;padding:4px 6px;gap:6px;border-radius:10px}
.rb-zentrum .rb-sk svg{width:24px;height:24px}
.rb-zentrum .rb-sk .rb-skn{font-size:13px}
.rb-zentrum .rb-sk .rb-skg{font-size:15px}
.rb-zentrum .rb-sk .rb-skx{font-size:13px}
.rb-zentrum .rb-zinfo{display:flex;justify-content:center;gap:4px 12px;flex-wrap:wrap;color:var(--ink2);font-size:13px;font-variant-numeric:tabular-nums}
.rb-zentrum .rb-zinfo b{color:var(--ink)}
.rb-handy #rb-mitte{--mf:15px;left:max(10px,var(--sicher-l));right:max(10px,var(--sicher-r));bottom:max(10px,var(--sicher-u));width:auto;height:auto;
  overflow-y:auto;touch-action:pan-y;-webkit-overflow-scrolling:touch;border-radius:20px;padding:12px 12px 14px;gap:10px;
  background:var(--panel-fest);border:1px solid var(--line);box-shadow:none}
.rb-handy #rb-mitte > *{flex-shrink:0}
.rb-handy .rb-aktion{flex:1 0 auto;gap:12px}
.rb-handy .rb-status{min-height:0}
.rb-handy .rb-status .rb-fg{width:2.2em;height:2.2em}
.rb-handy .rb-knoepfe{width:100%}
.rb-handy .rb-knoepfe .k-btn{flex:1 1 auto;max-width:100%;white-space:normal;line-height:1.2;padding-block:8px;text-align:center}
.rb-handy .rb-leiste .k-btn{flex:1 1 0;min-height:46px;font-size:16px}
.rb-handy .rb-auk-z{flex-wrap:wrap;padding:6px 8px}
.rb-handy .rb-auk-z .n{flex:1 1 calc(100% - 46px)}
.rb-handy .rb-auk-z .k-btn{flex:1 1 0;min-width:0;padding:0 6px}
.rb-handy .rb-karte,.rb-handy .rb-urkunde{width:100%}
.rb-handy .rb-urkunde header small{font-size:12px}
.rb-handy .rb-delta{font-size:13px}
.rb-wert2{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.rb-wert2 > div{display:grid;grid-template-columns:auto 28px 1fr auto;gap:2px 10px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--panel-hell);font-variant-numeric:tabular-nums}
.rb-wert2 svg{width:28px;height:28px}
.rb-wert2 b{font-family:var(--f-disp)}
.rb-wert2 small{grid-column:1/-1;color:var(--ink2);font-size:14px}
@media (max-width:700px){
  .rb-zeile .k-btn{flex:1 1 auto}
  .rb-fwahl button{flex:1 1 auto}
  .rb-geld input{flex:1 1 4em;min-width:4em}
}
/* ---------- Ausgabenwahl auf der Startseite ---------- */
.rb-aw{display:grid;gap:10px}
.rb-aw .k-lab{margin-bottom:0}
.rb-aw-reihe{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:8px}
@media (max-width:700px){.rb-aw-reihe{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}}
.rb-aw-k{min-width:0;display:flex;flex-direction:column;align-items:stretch;gap:7px;padding:7px 7px 9px;border-radius:14px;
  border:1px solid var(--line);background:var(--panel-hell);text-align:center;cursor:pointer;transition:transform .15s,box-shadow .2s,background .2s}
.rb-aw-k:active{transform:scale(.97)}
.rb-aw-k svg{display:block;width:100%;max-width:88px;margin:0 auto;height:auto;border-radius:8px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.35))}
.rb-aw-k b{font:700 14px/1.15 var(--f-ui);color:var(--ink);min-height:2.3em;display:grid;place-items:center;text-wrap:balance}
.rb-aw-k[aria-checked="true"]{background:color-mix(in srgb,var(--ak) 16%,transparent);border-color:transparent;box-shadow:inset 0 0 0 2px var(--ak)}
.rb-aw-k[aria-checked="true"] b{color:#fff}
.rb-aw-text{margin:0;color:var(--ink2);font-size:15px;line-height:1.4;min-height:2.8em}
.rb-aw-text b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){.rb-figur{transition:none}.rb-feld.ziel{animation:none}.rb-aw-k{transition:none}}

<!-- Ausgaben (Spielbretter für verschiedene Orte): reine Daten, jede meldet sich in window.RheinbaronAusgaben an.
     Fehlt eine Datei, bietet die Startseite nur die vorhandenen an. -->
<script src="rheinbaron.ausgabe-rheinlahn.js"></script>
<script src="rheinbaron.ausgabe-eschbach.js"></script>
<script src="rheinbaron.ausgabe-panzweiler.js"></script>

<script>
"use strict";
const R = window.Rheinbaron, F = R.FELDER, G = R.GRUPPEN, BG = R.BEGRIFFE, E = Kern.esc, euro = R.euro;
const AKZENT = '#5cc48a';
// Spielregeln mit den Begriffen der gewählten Ausgabe (erster Absatz kommt aus der Ausgabe)
function regelnHtml() {
  const b = k => E(BG[k]), gross = t => t.charAt(0).toUpperCase() + t.slice(1);
  return `${A && A.regelnIntro ? A.regelnIntro : '<p>Zieht um das Brett, kauft Grundstücke, baut Häuser und kassiert Miete. Wer am Ende als Einzige oder Einziger nicht pleite ist, gewinnt.</p>'}
<h3>Ablauf</h3>
<p>Alle starten mit 1.500 € auf „${b('start')}“. Wer am höchsten würfelt, beginnt. Würfle und zieh. Bei einem Pasch würfelst du nach deinem Zug noch einmal – beim dritten Pasch in Folge geht es sofort ${b('inDenTurm')}. Wer über „${b('start')}“ zieht oder darauf landet, bekommt 200 €.</p>
<h3>Freie Grundstücke</h3>
<p>Kaufe zum Preis auf dem Feld – oder lass versteigern. Dann bieten alle, auch du, ab 10 € in Schritten von 1 €. Wer am meisten bietet, zahlt an die Bank. Bietet niemand, bleibt das Feld frei.</p>
<h3>Miete</h3>
<ul><li>Straßen: Miete laut Karte, doppelt, wenn dir die ganze Farbgruppe gehört und noch nicht gebaut ist.</li>
<li>${b('bahnhoefe')}: 25, 50, 100 oder 200 € – je nachdem, wie viele davon der Besitzer hat.</li>
<li>${b('werke')}: würfle; die Augen mal 4 (eins davon) oder mal 10 (beide).</li>
<li>Für Grundstücke mit Hypothek gibt es keine Miete.</li></ul>
<h3>Bauen</h3>
<p>Gehört dir eine ganze Farbgruppe, darfst du jederzeit Häuser kaufen – gleichmäßig verteilt, höchstens 4 je Straße, danach ein Hotel (die 4 Häuser gehen zurück). Die Bank hat nur 32 Häuser und 12 Hotels; wollen mehrere das letzte, wird es versteigert. Gebäude verkaufst du zum halben Preis an die Bank.</p>
<h3>Hypothek</h3>
<p>Ohne Gebäude in der Farbgruppe kannst du ein Grundstück beleihen: Die Bank zahlt den halben Kaufpreis. Ablösen kostet diesen Betrag plus 10 %.</p>
<h3>${b('turm')}</h3>
<p>Wer hinein muss, zieht nicht über „${b('start')}“. Raus kommst du zu Beginn deines Zuges: 50 € zahlen und normal würfeln, die Karte „${b('schluessel')}“ nutzen, oder einen Pasch würfeln (dann ziehst du damit, ohne Extrawurf). Nach dem dritten Fehlversuch zahlst du 50 € und ziehst. Auch ${b('imTurm')} darfst du Miete kassieren, bauen, bieten und handeln.</p>
<h3>${b('ereignis')} und ${b('gemeinschaft')}</h3>
<p>Ziehe eine Karte und führe sie sofort aus; sie kommt unter den Stapel. Die Karte „${b('schluessel')}“ darfst du behalten oder verkaufen.</p>
<h3>Handeln</h3>
<p>Jederzeit zu zweit: Grundstücke (ohne Gebäude in der Farbgruppe), Geld und ${b('schluesselMz')} – beide müssen zustimmen. Wer ein belastetes Grundstück bekommt, löst es sofort ab oder zahlt sofort 10 % Zinsen.</p>
<h3>Pleite</h3>
<p>Kannst du nicht zahlen, verkaufe Gebäude und nimm Hypotheken auf. Reicht es dann noch nicht, scheidest du aus. Schulden bei einer Person: Sie bekommt alles, was dir gehört. Schulden bei der Bank: Deine Grundstücke werden einzeln versteigert.</p>
<p>${gross(b('pause'))}: ${E(String(BG.pauseText).replace(/[.!]+$/, ''))}. Geld gibt es dort keins.</p>
<h3>Variante Zeitlimit</h3>
<p>Auf Wunsch endet das Spiel nach einer festen Zeit. Dann zählt das Vermögen: Bargeld, Grundstücke zum Kaufpreis (belastete zum Hypothekenwert) und Gebäude zum Kaufpreis.</p>`;
}

/* ---------- Ausgaben (Spielbretter für verschiedene Orte) ----------
   Jede Ausgabe tauscht Namen, Karten, Begriffe und die Gestaltung; Regeln und Zahlen bleiben gleich (AUSGABEN.md).
   WAHL = auf der Startseite gewählt (Geräte-Einstellung), A = gerade angezeigte bzw. gespielte Ausgabe. */
const AUSGABEN = Object.values(window.RheinbaronAusgaben || {})
  .filter(a => a && a.id && Array.isArray(a.felder) && a.felder.length === 40)
  .sort((x, y) => (x.reihenfolge ?? 99) - (y.reihenfolge ?? 99) || String(x.name).localeCompare(String(y.name), 'de'));
const ausgabeVon = id => AUSGABEN.find(a => a.id === id) || AUSGABEN.find(a => a.id === 'rheinlahn') || AUSGABEN[0] || null;
let A = null;
let WAHL = Kern.einst.laden({ausgabe: 'eschbach'}).ausgabe;   // Vorgabe beim allerersten Start: Eschbach
const D = () => (A && A.design) || {};
const spielname = () => (A && A.spielname) || 'Rheinbaron';
const ausgabeName = id => { const a = ausgabeVon(id || 'rheinlahn'); return a ? a.name : ''; };
function svgUrl(svg) {
  let x = String(svg || '').trim(); if (!/^<svg[\s>]/.test(x)) return '';
  if (!/\sxmlns=/.test(x.slice(0, x.indexOf('>')))) x = x.replace(/^<svg/, '<svg xmlns="http://www.w3.org/2000/svg"');
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(x);
}
function istHell(farbe) {
  const m = /^#?([0-9a-f]{6})$/i.exec(String(farbe || '').trim()); if (!m) return true;
  const n = parseInt(m[1], 16), lin = c => { c /= 255; return c <= .04045 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4; };
  return .2126 * lin(n >> 16) + .7152 * lin((n >> 8) & 255) + .0722 * lin(n & 255) > .23;
}
function ausgabeAnwenden(id) {
  const a = ausgabeVon(id);
  try { R.ausgabeSetzen(a); A = a; } catch (e) { console.warn(e.message); R.ausgabeSetzen(null); A = null; }
  const d = D(), st = document.documentElement.style, akz = d.akzent || AKZENT;
  st.setProperty('--rb-papier', d.papier || '#f6f0e3'); st.setProperty('--rb-rand', d.rand || '#1b2a2f');
  st.setProperty('--rb-mitte', d.mitte || '#133a49');
  const motiv = svgUrl(d.mitteMotiv); st.setProperty('--rb-motiv', motiv ? `url("${motiv}")` : 'none');
  Kern.init(Object.assign({}, KERN, {name: spielname(), akzent: akz, regeln: regelnHtml()}));
  st.setProperty('--akzent-ink', istHell(akz) ? '#0b2229' : '#ffffff');
  return A;
}
// Kleines Brett als Vorschau: Papierring mit den Farbgruppen, in der Mitte Farbe und Motiv der Ausgabe
function brettMini(a, figuren) {
  const d = (a && a.design) || {}, pap = d.papier || '#f6f0e3', rand = d.rand || '#1b2a2f', mi = d.mitte || '#133a49';
  const motiv = svgUrl(d.mitteMotiv), gf = g => G[g].farbe;
  const seite = (gr, f) => gr.map((g, k) => f(k, gf(g))).join('');
  return `<svg viewBox="0 0 96 96" aria-hidden="true"><rect x="1.5" y="1.5" width="93" height="93" rx="8" fill="${pap}" stroke="${rand}" stroke-width="3"/>
    <rect x="19" y="19" width="58" height="58" fill="${mi}"/>${motiv ? `<image href="${motiv}" x="19" y="19" width="58" height="58" preserveAspectRatio="xMidYMid slice"/>` : ''}
    <rect x="19" y="19" width="58" height="58" fill="none" stroke="${rand}" stroke-width="1.4"/>
    ${seite(['braun', 'hellblau'], (k, c) => `<rect x="${58 - k * 26}" y="78" width="20" height="5" fill="${c}"/>`)}
    ${seite(['pink', 'orange'], (k, c) => `<rect x="13" y="${58 - k * 26}" width="5" height="20" fill="${c}"/>`)}
    ${seite(['rot', 'gelb'], (k, c) => `<rect x="${20 + k * 26}" y="13" width="20" height="5" fill="${c}"/>`)}
    ${seite(['gruen', 'blau'], (k, c) => `<rect x="78" y="${20 + k * 26}" width="5" height="20" fill="${c}"/>`)}
    ${figuren ? `<g transform="translate(51 47) scale(.62)">${figurSvg(1, '#f2c14e').replace(/<\/?svg[^>]*>/g, '')}</g><g transform="translate(23 50) scale(.55)">${figurSvg(0, '#ef7d6d').replace(/<\/?svg[^>]*>/g, '')}</g>` : ''}</svg>`;
}


/* ---------- Figuren (eigene, schlichte Formen) ---------- */
const FIGUR_NAMEN = ['Boot', 'Burg', 'Traube', 'Anker', 'Fisch', 'Weinglas'];
function figurSvg(nr, farbe) {
  const st = `fill="${farbe}" stroke="#0f2229" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"`;
  const k = [
    `<path ${st} d="M5 25h30l-6 9H11z"/><path ${st} d="M20 4v20"/><path ${st} d="M21 6l11 15H21z"/><path ${st} d="M19 9l-9 12h9z"/>`,
    `<path ${st} d="M9 35V15h4v-5h4v5h6v-5h4v5h4v20z"/><path fill="#0f2229" d="M17 35v-7a3 3 0 0 1 6 0v7z"/>`,
    `<path ${st} d="M22 7c4-4 9-2 10 0-3 2-7 3-10 0z"/><g ${st}><circle cx="14" cy="15" r="5"/><circle cx="24" cy="15" r="5"/><circle cx="19" cy="22" r="5"/><circle cx="11" cy="23" r="4.4"/><circle cx="27" cy="23" r="4.4"/><circle cx="19" cy="31" r="5"/></g>`,
    `<g ${st} fill="none"><circle cx="20" cy="8" r="3.5" fill="${farbe}"/><path d="M20 11.5V34"/><path d="M12 17h16"/><path d="M7 24c1 7 7 10 13 10s12-3 13-10"/></g><path ${st} d="M4 25l4-4 3 5zM36 25l-4-4-3 5z"/>`,
    `<path ${st} d="M4 20c6-9 18-10 25 0-7 10-19 9-25 0z"/><path ${st} d="M28 20l8-7v14z"/><circle cx="11" cy="18" r="2" fill="#0f2229"/>`,
    `<path ${st} d="M10 5h20c0 11-4 16-10 16S10 16 10 5z"/><path ${st} d="M20 21v10"/><path ${st} d="M12 35h16"/><path fill="#0f2229" opacity=".35" d="M12 10h16c-1 5-4 8-8 8s-7-3-8-8z"/>`
  ];
  return `<svg viewBox="0 0 40 40" aria-label="${FIGUR_NAMEN[nr % 6]}">${k[nr % 6]}</svg>`;
}

/* ---------- Anzeigenamen: trenn (weiche Trennstellen) vor kurz vor n ---------- */
const anzeigeText = i => { const f = F[i]; return f.trenn ? String(f.trenn).replace(/&shy;/g, '\u00ad') : (f.kurz || f.n); };
const anzeigeName = i => E(anzeigeText(i));
const nameKlasse = i => 'rb-name' + (/\u00ad/.test(anzeigeText(i)) ? '' : ' auto');
const eckBild = (k, stil = '') => { const u = svgUrl((D().ecken || {})[k]); return u ? `<img class="rb-eck-img" alt="" src="${u}" style="${stil}">` : ''; };
const ICON = {
  bahn: '<svg viewBox="0 0 40 30"><rect x="9" y="3" width="22" height="19" rx="5" fill="#1b2a2f"/><rect x="12" y="6" width="16" height="7" rx="2" fill="#f6f0e3"/><circle cx="14" cy="18" r="2" fill="#f6f0e3"/><circle cx="26" cy="18" r="2" fill="#f6f0e3"/><path d="M12 22l-4 6M28 22l4 6" stroke="#1b2a2f" stroke-width="2.4" stroke-linecap="round"/></svg>',
  strom: '<svg viewBox="0 0 40 30"><path d="M23 2L11 17h8l-3 11 13-16h-8z" fill="#e8b92e" stroke="#1b2a2f" stroke-width="2" stroke-linejoin="round"/></svg>',
  wasser: '<svg viewBox="0 0 40 30"><path d="M20 2c6 9 9 13 9 17a9 9 0 0 1-18 0c0-4 3-8 9-17z" fill="#4b9bd4" stroke="#1b2a2f" stroke-width="2"/></svg>',
  ereignis: '<svg viewBox="0 0 40 30"><path d="M20 2l3.5 8.5L32 12l-6.5 6 2 9-7.5-4.5L12.5 27l2-9L8 12l8.5-1.5z" fill="#ef8a2e" stroke="#1b2a2f" stroke-width="2" stroke-linejoin="round"/></svg>',
  gemeinschaft: '<svg viewBox="0 0 40 30"><g fill="none" stroke="#1b2a2f" stroke-width="2.4"><circle cx="15" cy="15" r="8" stroke="#2f9a5a" stroke-width="3.2"/><circle cx="25" cy="15" r="8" stroke="#2c5bb8" stroke-width="3.2"/></g></svg>',
  steuer: '<svg viewBox="0 0 40 30"><rect x="8" y="4" width="24" height="22" rx="3" fill="#fbf8f1" stroke="#1b2a2f" stroke-width="2"/><path d="M13 11h14M13 16h14M13 21h8" stroke="#1b2a2f" stroke-width="2" stroke-linecap="round"/></svg>',
  turm: '<svg viewBox="0 0 40 46"><path d="M8 44V14h3V8h4v6h4V8h4v6h4V8h4v6h3v30z" fill="#c9b99a" stroke="#1b2a2f" stroke-width="2"/><path d="M15 44v-9a5 5 0 0 1 10 0v9z" fill="#1b2a2f"/><rect x="17" y="19" width="6" height="8" rx="3" fill="#1b2a2f"/><path d="M19.5 19v8M17 23h6" stroke="#c9b99a" stroke-width="1.2"/></svg>'
};
const gruppeFarbe = f => F[f].g ? G[F[f].g].farbe : '#9aa';
const hellGruppe = g => ['hellblau', 'gelb'].includes(g);

/* ---------- Zustand und Speicher ---------- */
let S = null, BUSY = false, FEST = [], ANZEIGE = [], LETZT_TICK = 0, ZEIT_SPEICHERN = 0;
const MAN = {fenster: null, sp: null}; // offenes Verwalten-Fenster
const speichern = () => { if (!S) return; if (S.ende) Kern.speicher.loeschen(); else Kern.speicher.speichern(S); };
/* Netzspiel-Hilfen: ICH = eigener Sitz (im Netzspiel), sonst null; darf = darf dieses Gerät für Sitz i bedienen */
const NETZ = () => !!(Netz.laeuft && S);
const ICH = () => (NETZ() ? Netz.meinSitz : null);
const darf = i => Netz.binDran(i);
let WARTE = false;   // Mitspieler: Aktion abgeschickt, Antwort steht aus (gegen Doppeltipps)
function sende(name, d = {}) {
  if (Netz.istGast) { if (WARTE) return; WARTE = true; setTimeout(() => { WARTE = false; }, 2500); }
  return Netz.tun(name, d);
}
function wurf() { return FEST.length ? FEST.shift() : [1 + Kern.zufall(6), 1 + Kern.zufall(6)]; }
window.__test = {zustand: () => S, laden(s) { if (!A || ausgabeVon(s.ausgabe || 'rheinlahn') !== A) ausgabeAnwenden(s.ausgabe || 'rheinlahn'); S = s; ANZEIGE = []; aufbauen(); zeichnen(); speichern(); },
  wuerfel(...p) { FEST.push(...p); }, R, busy: () => BUSY, ausgabe: () => A && A.id, ausgaben: () => AUSGABEN.map(a => a.id)};

/* ---------- Startseite ---------- */
let SETUP = null;
function startseite() {
  document.querySelectorAll('.rb-buehne').forEach(x => x.remove());
  if (SETUP) SETUP.ziel.remove();
  Kern.kopf(true);
  const gesp = Kern.speicher.laden();
  ausgabeAnwenden(WAHL);
  const mehrere = AUSGABEN.length > 1;
  SETUP = Kern.setup({
    titel: spielname(), unter: (A && A.unter) || 'Kaufen, bauen, kassieren.',
    bild: bildSvg(), fakten: ['2–6 Personen', 'ab 90 Minuten', 'Würfeln · Kaufen · Handeln'],
    spieler: {min: 2, max: 6, standard: 3},
    optionen: [{id: 'zeit', label: 'Spielende', werte: [{wert: 0, text: 'Ohne Zeitlimit'}, {wert: 60, text: '60 Min.'}, {wert: 90, text: '90 Min.'}, {wert: 120, text: '120 Min.'}], standard: 0}],
    extra: '<p class="rb-leise" style="text-align:left;margin:0">Zeitlimit ist eine Variante: Nach Ablauf zählt das Vermögen. Ohne Zeitlimit gilt die Grundregel.</p>',
    fortsetzen: gesp && !gesp.ende ? `Zug ${gesp.zug}${mehrere ? ' · ' + ausgabeName(gesp.ausgabe) : ''} · ${gesp.spieler.filter(p => !p.raus).map(p => p.name).join(', ')}` : null,
    onFortsetzen: () => { ausgabeAnwenden(gesp.ausgabe || 'rheinlahn'); S = gesp; spielZeigen(); },
    onStart: cfg => neuesSpiel(cfg.namen, cfg.farben, cfg.optionen)
  });
  if (mehrere) ausgabenWahl(SETUP);
}
/* Ausgabenwahl: Kacheln mit kleinem Brett, Name; darunter die Beschreibung der gewählten Ausgabe */
function ausgabenWahl(setup) {
  const box = Kern.el('div', 'rb-aw');
  box.innerHTML = `<span class="k-lab" id="rb-aw-lab">Welches Spielbrett?</span><div class="rb-aw-reihe" role="radiogroup" aria-labelledby="rb-aw-lab">${AUSGABEN.map(a =>
    `<button class="rb-aw-k" role="radio" data-ausgabe="${E(a.id)}" style="--ak:${E((a.design && a.design.akzent) || AKZENT)}" aria-checked="${a === A}">${brettMini(a)}<b>${E(a.name)}</b></button>`).join('')}</div><p class="rb-aw-text"></p>`;
  const text = () => { box.querySelector('.rb-aw-text').innerHTML = A ? `<b>${E(A.spielname || A.name)}</b> · ${E(A.beschreibung || '')}` : ''; };
  text();
  box.querySelectorAll('[data-ausgabe]').forEach(b => b.onclick = () => {
    const id = b.dataset.ausgabe; if (A && A.id === id) return;
    WAHL = id; Kern.einst.speichern({ausgabe: id}); ausgabeAnwenden(id); Kern.ton('tipp');
    box.querySelectorAll('[data-ausgabe]').forEach(x => x.setAttribute('aria-checked', String(x.dataset.ausgabe === A.id)));
    const t = setup.ziel.querySelector('.k-titel');
    if (t) { const h = t.querySelector('h1'), u = t.querySelector('.k-unter'), bi = t.querySelector('.k-bild'); if (h) h.textContent = spielname(); if (u) u.textContent = A.unter || ''; if (bi) bi.innerHTML = bildSvg(); }
    text();
  });
  const p = setup.panel, weiter = p.querySelector('.k-weiter');
  p.insertBefore(box, weiter ? weiter.nextSibling : p.firstChild);
}
function bildSvg() { return brettMini(A, true).replace('<svg ', '<svg width="124" height="124" '); }
function neuesSpiel(namen, farben, optionen, ausgabe = WAHL) {
  Kern.speicher.loeschen();
  ausgabeAnwenden(ausgabe);
  S = R.neu({namen, farben, figuren: namen.map((n, i) => i), optionen: {zeit: optionen.zeit}, zufall: Kern.zufall});
  S.netzId = Date.now().toString(36) + Kern.zufall(1e6);   // erkennt im Netzspiel ein neues Spiel
  speichern(); spielZeigen();
  startwurfZeigen();
  Kern.ton('runde');
}
function startwurfZeigen() {
  if (!S.startwurf.length) return;
  const r = S.startwurf.map((runde, k) => `<p>${k ? 'Stechen: ' : ''}${runde.map(x => `${E(S.spieler[x.sp].name)} ${x.w[0]}+${x.w[1]}`).join(' · ')}</p>`).join('');
  Kern.fenster(`<h2>${E(S.spieler[S.dran].name)} beginnt</h2><p>Alle haben gewürfelt, die höchste Summe fängt an.</p>${r}`);
}

/* ---------- Spielfläche aufbauen ---------- */
let BUEHNE, BRETT, MITTE, SEITE, ZENTRUM = null, FELDEL = [], FIGEL = [], WUERFEL = [];
const HANDY = matchMedia('(max-width:700px)');   // iPhone hoch: Brett oben, Steuerung als Leiste darunter
function spielZeigen() {
  if (SETUP) { SETUP.ziel.remove(); SETUP = null; }
  ANZEIGE = []; aufbauen(); zeichnen();
}
function aufbauen() {
  document.querySelectorAll('.rb-buehne').forEach(x => x.remove());
  BUEHNE = Kern.el('div', 'k-buehne rb-buehne');
  BRETT = Kern.el('div'); BRETT.id = 'rb-brett';
  SEITE = Kern.el('div', 'rb-seite');
  BUEHNE.append(BRETT, SEITE); document.body.appendChild(BUEHNE);
  FELDEL = F.map((f, i) => {
    const e = Kern.el('div', 'rb-feld'); e.dataset.feld = i; e.setAttribute('role', 'button'); e.setAttribute('aria-label', f.n); e.tabIndex = 0;
    e.innerHTML = feldInnen(i); BRETT.appendChild(e);
    Kern.tap(e, () => feldTippen(i));
    return e;

/* ---------- Handlungen ---------- */
async function tu(fn, sitz = null) {
  if (!S) return;
  if (BUSY) { if (sitz !== null) Netz.melden(sitz); return; }
  BUSY = true;
  const vorher = S.spieler.map(p => p.pos);
  try { fn(); }
  catch (e) { BUSY = false; if (e.regel) { meldeFehler(e.message, sitz); return; } throw e; }
  S.animNr = (S.animNr || 0) + 1; Netz.melden();   // Mitspieler animieren gleichzeitig
  try { await animieren(vorher); } finally { BUSY = false; }
  speichern(); zeichnen();
  S.anim.filter(an => an.art === 'geld').forEach(geldBlitz);
  if (S.ende) spielVorbei();
}
async function wuerfelnUndZiehen(aktion = R.wuerfeln, sitz = null) {
  if (BUSY) { if (sitz !== null) Netz.melden(sitz); return; }
  const w = wurf();
  S.wurfAnim = {nr: ((S.wurfAnim && S.wurfAnim.nr) || 0) + 1, w}; Netz.melden();   // Mitspieler rollen mit
  BUSY = true; Kern.ton('wuerfel');
  await Promise.all([Kern.wuerfelRollen(WUERFEL[0], w[0]), Kern.wuerfelRollen(WUERFEL[1], w[1])]);
  BUSY = false;
  await tu(() => aktion(S, w), sitz);
}
async function animieren(vorher) {

    if (an.art === 'zug') {
      const schritt = Math.sign(an.n);
      for (let k = 0; k < Math.abs(an.n); k++) {
        ANZEIGE[an.sp] = ((ANZEIGE[an.sp] + schritt) % 40 + 40) % 40; figurenSetzen(false);
        if ((k & 1) === 0) Kern.ton('zeit');
        await Kern.warte(115);
      }
      await Kern.warte(120);
    } else if (an.art === 'sprung') {
      FIGEL[an.sp].classList.add('weit'); ANZEIGE[an.sp] = null; figurenSetzen(false); Kern.ton('gong');
      await Kern.warte(500); FIGEL[an.sp].classList.remove('weit');
      ANZEIGE[an.sp] = an.nach;
    } else if (an.art === 'los') Kern.ton('punkt');

}

  const wahl = new Set();
  const box = Kern.el('div');
  box.innerHTML = `<h2>Das letzte ${hotel ? 'Hotel' : 'Haus'}</h2><p>Die Bank hat nur noch eins. Möchte noch jemand eins kaufen? Dann wird es versteigert (ab ${euro(R.MIN_GEBOT)}).</p><div class="rb-fwahl">${andere.map(k => `<button data-k="${k}" aria-pressed="false" style="--pc:${sp(k).farbe}">${figurSvg(sp(k).figur, sp(k).farbe)}${E(sp(k).name)} möchte auch</button>`).join('')}</div><div class="k-knoepfe"><button class="k-btn leise" data-niemand="1">Niemand – ${E(sp(i).name)} kauft</button><button class="k-btn" data-auk="1" disabled>Versteigern</button></div>`;
  const fe = Kern.fenster(box);
  box.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { const k = +b.dataset.k; wahl.has(k) ? wahl.delete(k) : wahl.add(k); b.setAttribute('aria-pressed', wahl.has(k)); box.querySelector('[data-auk]').disabled = !wahl.size; });
  box.querySelector('[data-niemand]').onclick = () => { fe.schliessen(); kaufen(); };
  box.querySelector('[data-auk]').onclick = () => { fe.schliessen(); if (MAN.fenster) MAN.fenster.schliessen(); sende('mangel', {art, teilnehmer: [i, ...wahl]}); };
}

/* ---------- Handeln ---------- */
function handelFenster(a) {
  if (!S || S.ende) return;
  if (!R.verwaltenErlaubt(S)) { Kern.hinweis('Erst die Versteigerung bzw. Karte abschließen.'); return; }
  const akt = R.aktive(S);
  if (NETZ()) { a = ICH(); if (S.angebot && S.angebot.a === a) { Kern.hinweis('Dein Angebot ist noch offen.'); return; } }
  const H = {a, b: akt.find(k => k !== a), gA: {felder: new Set(), karten: new Set(), geld: 0}, gB: {felder: new Set(), karten: new Set(), geld: 0}, okA: false, okB: false};
  const fe = Kern.fenster(Kern.el('div'), {breit: true, beimSchliessen: () => zeichnen()});
  const neuFuellen = () => {
    const box = fe.inhalt;
    const seite = (wer, g, key) => {
      const P = sp(wer);
      const felder = R.felderVon(S, wer);
      return `<div class="rb-seiteh" style="--pc:${P.farbe}"><h4>${E(P.name)} gibt</h4>
        <div class="rb-chips">${felder.length ? felder.map(f => `<button data-f="${key}:${f}" aria-pressed="${g.felder.has(f)}" ${R.handelbar(S, wer, f) ? '' : 'disabled title="Gebäude in der Farbgruppe"'} style="--gc:${gruppeFarbe(f)}"><i></i>${E(F[f].n)}${S.besitz[f].hy ? ' (Hyp.)' : ''}</button>`).join('') : '<span class="rb-leer">keine Grundstücke</span>'}
        ${P.karten.map((k, n) => `<button data-c="${key}:${k}" aria-pressed="${g.karten.has(k)}">${E(BG.schluessel)}</button>`).join('')}</div>
        <div class="rb-geld"><button data-g="${key}:-50">−50</button><button data-g="${key}:-10">−10</button><input data-gi="${key}" inputmode="numeric" value="${g.geld}" aria-label="Betrag"><button data-g="${key}:10">+10</button><button data-g="${key}:50">+50</button><span class="rb-leer" style="font-size:14px">von ${euro(P.geld)}</span></div></div>`;
    };
    const w = R.warumNichtHandeln(S, plan());
    box.innerHTML = `<h2>Handeln</h2>${NETZ() ? '' : `<div class="rb-fwahl">${akt.map(k => `<button data-pa="${k}" aria-pressed="${k === H.a}" style="--pc:${sp(k).farbe}">${figurSvg(sp(k).figur, sp(k).farbe)}${E(sp(k).name)}</button>`).join('')}</div>`}
      <div class="rb-fwahl" style="margin-top:-6px"><span style="align-self:center;color:var(--ink2)">mit</span>${akt.filter(k => k !== H.a).map(k => `<button data-pb="${k}" aria-pressed="${k === H.b}" style="--pc:${sp(k).farbe}">${figurSvg(sp(k).figur, sp(k).farbe)}${E(sp(k).name)}</button>`).join('')}</div>
      <div class="rb-handel">${seite(H.a, H.gA, 'A')}${seite(H.b, H.gB, 'B')}</div>
      <p class="rb-leer" style="margin-top:10px">${w && w !== 'Es wird nichts getauscht.' ? E(w) : 'Belastete Grundstücke: Wer sie bekommt, löst sofort ab oder zahlt 10 % Zinsen.'}</p>
      ${NETZ() ? `<div class="rb-ok"><button class="k-btn" data-angebot="1" ${w ? 'disabled' : ''}>Angebot an ${E(sp(H.b).name)} schicken</button></div>`
      : `<div class="rb-ok"><button class="k-btn leise" data-ok="A" aria-pressed="${H.okA}" ${w ? 'disabled' : ''}>${E(sp(H.a).name)} ist einverstanden</button><button class="k-btn leise" data-ok="B" aria-pressed="${H.okB}" ${w ? 'disabled' : ''}>${E(sp(H.b).name)} ist einverstanden</button></div>`}`;
    const ang = box.querySelector('[data-angebot]');
    if (ang) ang.onclick = () => { fe.schliessen(); sende('angebot', plan()); Kern.hinweis(`Angebot an ${sp(H.b).name} geschickt.`); };
    const geaendert = () => { H.okA = H.okB = false; neuFuellen(); };
    box.querySelectorAll('[data-pa]').forEach(b => b.onclick = () => { H.a = +b.dataset.pa; if (H.b === H.a) H.b = akt.find(k => k !== H.a); leeren(); geaendert(); });
    box.querySelectorAll('[data-pb]').forEach(b => b.onclick = () => { H.b = +b.dataset.pb; H.gB = {felder: new Set(), karten: new Set(), geld: 0}; geaendert(); });
    box.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { const [k, f] = b.dataset.f.split(':'); const g = k === 'A' ? H.gA : H.gB; g.felder.has(+f) ? g.felder.delete(+f) : g.felder.add(+f); geaendert(); });
    box.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { const [k, c] = b.dataset.c.split(':'); const g = k === 'A' ? H.gA : H.gB; g.karten.has(c) ? g.karten.delete(c) : g.karten.add(c); geaendert(); });
    box.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { const [k, d] = b.dataset.g.split(':'); const g = k === 'A' ? H.gA : H.gB, max = sp(k === 'A' ? H.a : H.b).geld; g.geld = Math.max(0, Math.min(max, g.geld + +d)); geaendert(); });
    box.querySelectorAll('[data-gi]').forEach(inp => inp.onchange = () => { const k = inp.dataset.gi, g = k === 'A' ? H.gA : H.gB, max = sp(k === 'A' ? H.a : H.b).geld; g.geld = Math.max(0, Math.min(max, parseInt(inp.value, 10) || 0)); geaendert(); });
    box.querySelectorAll('[data-ok]').forEach(b => b.onclick = () => {
      if (b.dataset.ok === 'A') H.okA = !H.okA; else H.okB = !H.okB;
      if (H.okA && H.okB) { fe.schliessen(); sende('handeln', plan()); return; }
      neuFuellen();
    });
  };
  const leeren = () => { H.gA = {felder: new Set(), karten: new Set(), geld: 0}; H.gB = {felder: new Set(), karten: new Set(), geld: 0}; };
  const plan = () => ({a: H.a, b: H.b, gibA: {felder: [...H.gA.felder], karten: [...H.gA.karten], geld: H.gA.geld}, gibB: {felder: [...H.gB.felder], karten: [...H.gB.karten], geld: H.gB.geld}});
  neuFuellen();
}

/* ---------- Spielende ---------- */
function spielVorbei() {
  Kern.ton('sieg'); Kern.feier(); endeFenster();
}
function endeFenster() {
  const e = S.ende; if (!e) return;
  const namen = e.sieger.map(i => sp(i).name).join(' und ');
  const zeilen = e.wertung.map((w, k) => `<span>${k + 1}.</span>${figurSvg(sp(w.sp).figur, sp(w.sp).farbe)}<b>${E(sp(w.sp).name)}</b>${w.raus ? `<span class="rb-leer" style="grid-column:span 4">pleite in Zug ${w.rausZug}</span>` : `<span class="k-zahl">${euro(w.geld)}</span><span class="k-zahl">+ ${euro(w.grund)}</span><span class="k-zahl">+ ${euro(w.gebaeude)}</span><b class="k-zahl">= ${euro(w.summe)}</b>`}`).join('');
  const box = Kern.el('div');
  box.innerHTML = `<h2>${E(namen)} ${e.sieger.length > 1 ? 'gewinnen' : 'gewinnt'}!</h2><p>${e.art === 'zeit' ? 'Die Zeit ist um. Gewertet wird das Vermögen.' : 'Alle anderen sind pleite.'}</p>
    ${HANDY.matches ? `<div class="rb-wert2">${e.wertung.map((w, k) => `<div><span>${k + 1}.</span>${figurSvg(sp(w.sp).figur, sp(w.sp).farbe)}<b>${E(sp(w.sp).name)}</b>${w.raus ? `<span class="rb-leer">pleite in Zug ${w.rausZug}</span>` : `<b class="k-zahl">${euro(w.summe)}</b><small class="k-zahl">Bargeld ${euro(w.geld)} + Grund ${euro(w.grund)} + Gebäude ${euro(w.gebaeude)}</small>`}</div>`).join('')}</div>`
    : `<div class="rb-wert"><span></span><span></span><span></span><span class="k">Bargeld</span><span class="k">Grund</span><span class="k">Gebäude</span><span class="k">Vermögen</span>${zeilen}</div>`}
    <p class="rb-leer">Grund: Kaufpreis, belastete Grundstücke zum Hypothekenwert. Gebäude: Kaufpreis, ein Hotel zählt fünf Hauspreise.</p>`;
  const k = Kern.el('div', 'k-knoepfe'); box.appendChild(k);
  const fe = Kern.fenster(box, {breit: true});
  if (NETZ() && !Netz.istHost) { box.insertBefore(Kern.el('p', 'rb-leer', `${E(Netz.sitze[0].name)} entscheidet, wie es weitergeht.`), k); k.append(knopf('Brett ansehen', 'leise', () => fe.schliessen())); return; }
  k.append(knopf('Nochmal', '', () => { fe.schliessen(); sende('neustart'); }), knopf('Neues Spiel', 'leise', () => { fe.schliessen(); if (Netz.aktiv) Netz.verlassen(); startseite(); }), knopf('Brett ansehen', 'leise', () => fe.schliessen()));
}
function nochmal() {
  const alt = S; neuesSpiel(alt.spieler.map(p => p.name), alt.spieler.map(p => p.farbe), {zeit: alt.zeit.limit / 60000}, alt.ausgabe || 'rheinlahn');
}

/* ---------- Zeit ---------- */
setInterval(() => {
  const jetzt = performance.now(), d = LETZT_TICK ? jetzt - LETZT_TICK : 0; LETZT_TICK = jetzt;
  if (!S || S.ende || !BRETT || document.hidden || d > 5000) return;
  R.zeitPlus(S, d);
  if ((ZEIT_SPEICHERN += d) > 10000) { ZEIT_SPEICHERN = 0; speichern(); }
  const r = document.getElementById('rb-rest'); if (r && S.zeit.limit) r.textContent = Math.ceil(Math.max(0, S.zeit.limit - S.zeit.gespielt) / 60000) + ' Min.';
}, 1000);

const KERN = {id: 'rheinbaron', onNeu: () => { Kern.speicher.loeschen(); S = null; startseite(); },
  menue: [{text: 'Verlauf', aktion: () => { if (S) Kern.fenster(`<h2>Verlauf</h2>${S.log.slice().reverse().map(t => `<p>${E(t)}</p>`).join('')}`); }}]};
ausgabeAnwenden(WAHL);
/* ---------- Netzspiel: jeder auf seinem Gerät ----------
   Der Gastgeber ist die Bank: nur er würfelt, mischt und rechnet. Jede Entscheidung (würfeln, kaufen oder versteigern,
   zahlen, Karte bestätigen, Hexenturm, Hypothek übernehmen, Gebäude setzen) erscheint nur auf dem Gerät der Person,
   die gerade handelt; bei Versteigerungen bietet jede Person auf ihrem eigenen Gerät. Bauen, verkaufen und beleihen
   geht jederzeit für die eigenen Grundstücke. Handel: Wer anbietet, stellt das Angebot zusammen und schickt es; nur
   die Person, der es gilt, nimmt an oder lehnt ab. Geheim sind nur die Kartenstapel (Reihenfolge). */
const HINW = {};   // Hinweis nur für ein Gerät (abgewiesener Zug): {nr, text}
let HINW_NR = 0, HINW_GESEHEN = 0, STAND_Q = Promise.resolve();
function meldeFehler(text, sitz) {
  if (sitz != null && NETZ() && sitz !== Netz.meinSitz) { HINW[sitz] = {nr: ++HINW_NR, text}; Netz.melden(sitz); return; }
  Kern.hinweis(text); Kern.ton('fehler');
}
function angebotText(h) {
  const teil = (wer, g) => {
    const x = [...(g.felder || []).map(f => F[f].n), ...(g.karten || []).map(() => BG.schluessel)];
    if (g.geld) x.push(euro(g.geld));
    return `<b>${E(sp(wer).name)}</b> gibt ${x.length ? E(x.join(', ')) : 'nichts'}`;
  };
  return `${teil(h.a, h.gibA || {})} · ${teil(h.b, h.gibB || {})}`;
}
function angebotHtml() {
  const h = S && S.angebot; if (!h || !NETZ()) return '';
  if (h.b === ICH()) return `<div class="rb-angebot" id="rb-angebot"><p><b>${E(sp(h.a).name)}</b> bietet dir einen Handel an:</p><p>${angebotText(h)}</p>
    <div class="rb-knoepfe"><button class="k-btn gut klein" id="rb-annehmen">Annehmen</button><button class="k-btn leise klein" id="rb-ablehnen">Ablehnen</button></div></div>`;
  if (h.a === ICH()) return `<div class="rb-angebot" id="rb-angebot"><p>Dein Angebot an <b>${E(sp(h.b).name)}</b> wartet auf Antwort.</p><p>${angebotText(h)}</p>
    <div class="rb-knoepfe"><button class="k-btn leise klein" id="rb-zurueckziehen">Zurückziehen</button></div></div>`;
  return '';
}
function angebotVerbinden() {
  const q = id => MITTE.querySelector('#' + id);
  if (q('rb-annehmen')) q('rb-annehmen').onclick = () => sende('antwort', {ja: true});
  if (q('rb-ablehnen')) q('rb-ablehnen').onclick = () => sende('antwort', {ja: false});
  if (q('rb-zurueckziehen')) q('rb-zurueckziehen').onclick = () => sende('zurueckziehen');
}
// Züge, die an S.akt hängen: Art des erwarteten Schritts und Ausführung
const NETZ_AKT = {
  wurf: ['wurf', sitz => wuerfelnUndZiehen(R.wuerfeln, sitz)],
  turmWurf: ['turm', sitz => wuerfelnUndZiehen(R.turmWuerfeln, sitz)],
  turmZahlen: ['turm', sitz => tu(() => R.turmZahlen(S), sitz)],
  turmKarte: ['turm', sitz => tu(() => R.turmKarte(S), sitz)],
  kaufen: ['kauf', sitz => tu(() => { R.kaufen(S); Kern.ton('punkt'); }, sitz)],
  versteigern: ['kauf', sitz => tu(() => R.versteigern(S), sitz)],
  zahlen: ['zahlen', sitz => tu(() => { R.zahlen(S); Kern.ton('legen'); }, sitz)],
  bankrott: ['zahlen', sitz => tu(() => { R.bankrott(S); Kern.ton('fehler'); }, sitz)],
  werkWurf: ['werk', sitz => wuerfelnUndZiehen(R.werkWuerfeln, sitz)],
  karteOk: ['karte', sitz => tu(() => R.karteOk(S), sitz)],
  uebernehmen: ['uebernahme', (sitz, d) => tu(() => R.uebernehmen(S, d.wahl === 'abloesen' ? 'abloesen' : 'zinsen'), sitz)],
  gutschein: ['gutschein', (sitz, d) => tu(() => { R.gutscheinSetzen(S, +d.f); Kern.ton('legen'); }, sitz)],
  gutscheinVerzichten: ['gutschein', sitz => tu(() => R.gutscheinVerzichten(S), sitz)],
  weiter: ['fertig', sitz => tu(() => { R.weiter(S); Kern.ton('tipp'); }, sitz)],
  nochmal: ['fertig', sitz => tu(() => R.weiter(S), sitz).then(() => { if (S.akt && S.akt.t === 'wurf') return wuerfelnUndZiehen(R.wuerfeln, sitz); })],
};
// Verwalten der eigenen Grundstücke (jederzeit, auch außerhalb des eigenen Zuges)
const NETZ_VERW = {
  bauen: d => R.hausKaufen(S, d.sp, +d.f), verkaufen: d => R.hausVerkaufen(S, d.sp, +d.f), hypothek: d => R.hypothek(S, d.sp, +d.f),
  abloesen: d => R.abloesen(S, d.sp, +d.f), gruppe: d => R.gruppeVerkaufen(S, d.sp, String(d.g)),
};
function netzAktion(name, d, sitz) {
  if (!S) return;
  const netz = sitz !== null;
  const nein = () => { if (netz) Netz.melden(sitz); };
  if (NETZ_AKT[name]) {
    const [art, run] = NETZ_AKT[name];
    if (S.ende || !S.akt || S.akt.t !== art || (netz && sitz !== handelnde())) return nein();
    return run(sitz, d);
  }
  if (NETZ_VERW[name]) {
    if (netz && sitz !== +d.sp) return nein();
    try { NETZ_VERW[name](Object.assign({}, d, {sp: +d.sp})); Kern.ton('legen'); speichern(); zeichnen(); Netz.melden(); }
    catch (e) { if (e.regel) meldeFehler(e.message, sitz); else throw e; }
    return;
  }
  switch (name) {
    case 'bieten': if (netz && sitz !== +d.sp) return nein(); return tu(() => { R.bieten(S, +d.sp, +d.v); Kern.ton('stein'); }, sitz);
    case 'aussteigen': if (netz && sitz !== +d.sp) return nein(); return tu(() => R.aussteigen(S, +d.sp), sitz);
    case 'mangel': {
      const t = (d.teilnehmer || []).map(Number);
      if (!['haus', 'hotel'].includes(d.art) || !t.length || (netz && sitz !== t[0])) return nein();
      return tu(() => R.mangelAuktion(S, d.art, t), sitz);
    }
    case 'handeln':   // am selben Gerät: beide haben am Gerät zugestimmt
      if (netz) return nein();
      return tu(() => { R.handeln(S, d); Kern.ton('punkt'); Kern.hinweis('Handel abgeschlossen'); });
    case 'angebot': {
      if (!netz || sitz !== +d.a) return nein();
      if (S.angebot && S.angebot.a !== sitz) { meldeFehler('Gerade läuft schon ein anderes Handelsangebot.', sitz); return; }
      const h = {a: +d.a, b: +d.b, gibA: d.gibA || {}, gibB: d.gibB || {}};
      const w = R.warumNichtHandeln(S, h); if (w) { meldeFehler(w, sitz); return; }
      S.angebot = h; zeichnen(); Netz.melden();
      if (h.b === Netz.meinSitz) { Kern.ton('tipp'); Kern.hinweis(`${sp(h.a).name} bietet dir einen Handel an.`); }
      return;
    }
    case 'zurueckziehen':
      if (!S.angebot || (netz && sitz !== S.angebot.a)) return nein();
      S.angebot = null; zeichnen(); Netz.melden(); return;
    case 'antwort': {
      const h = S.angebot;
      if (!h || (netz && sitz !== h.b)) return nein();
      if (!d.ja) { S.angebot = null; zeichnen(); Netz.melden(); meldeFehler(`${sp(h.b).name} lehnt dein Angebot ab.`, h.a); return; }
      const w = R.warumNichtHandeln(S, h); if (w) { meldeFehler(w, sitz); return; }
      S.angebot = null;
      return tu(() => { R.handeln(S, h); Kern.ton('punkt'); }, sitz).then(() => meldeFehler(`Handel mit ${sp(h.b).name} abgeschlossen.`, h.a));
    }
    case 'neustart':
      if (!S.ende || (netz && sitz !== 0)) return nein();
      nochmal(); Netz.melden(); return;
  }
}
async function standAnwenden(d) {
  if (!d || d.warte) return;
  WARTE = false;
  if (d.hinweis && d.hinweis.nr > HINW_GESEHEN) { HINW_GESEHEN = d.hinweis.nr; Kern.hinweis(d.hinweis.text, 2800); }
  const alt = S;
  if (SETUP) { SETUP.ziel.remove(); SETUP = null; }
  const wechsel = !!AUSGABEN.length && ausgabeVon(d.ausgabe || 'rheinlahn') !== A;   // Ausgabe des Gastgebers übernehmen
  if (wechsel) ausgabeAnwenden(d.ausgabe || 'rheinlahn');
  if (!alt || alt.netzId !== d.netzId || !BRETT || wechsel) {   // neues Spiel
    S = d; ANZEIGE = []; aufbauen(); zeichnen(); if (S.zug === 1 && !S.wurf) startwurfZeigen(); return;
  }
  if (d.angebot && d.angebot.b === Netz.meinSitz && !(alt.angebot && alt.angebot.b === Netz.meinSitz)) { Kern.ton('tipp'); Kern.hinweis(`${d.spieler[d.angebot.a].name} bietet dir einen Handel an.`); }
  if (d.wurfAnim && d.animNr === alt.animNr && (!alt.wurfAnim || alt.wurfAnim.nr !== d.wurfAnim.nr)) {   // Würfel rollen
    S = d; zeichnen(); Kern.ton('wuerfel');
    BUSY = true;
    try { await Promise.all([Kern.wuerfelRollen(WUERFEL[0], d.wurfAnim.w[0]), Kern.wuerfelRollen(WUERFEL[1], d.wurfAnim.w[1])]); } finally { BUSY = false; }
    return;
  }
  if (d.animNr !== alt.animNr) {   // Figuren ziehen wie beim Gastgeber
    const vorher = alt.spieler.map(p => p.pos);
    S = d; ANZEIGE = vorher.slice(); zeichnen();
    BUSY = true;
    try { await animieren(vorher); } finally { BUSY = false; }
    zeichnen();
    S.anim.filter(an => an.art === 'geld').forEach(geldBlitz);
    if (S.ende && !alt.ende) spielVorbei();
    return;
  }
  S = d; zeichnen();
  if (S.ende && !alt.ende) spielVorbei();
}
Netz.einrichten({
  spiel: 'rheinbaron', min: 2, max: 6,
  starten(spieler, optionen) { neuesSpiel(spieler.map(p => p.name), spieler.map(p => p.farbe), {zeit: Number(optionen.zeit) || 0}); },
  aktion: netzAktion,
  zustand(sitz) {
    if (!S) return {warte: true};
    const k = JSON.parse(JSON.stringify(S));
    k.stapelAnz = {E: S.stapel.E.length, G: S.stapel.G.length}; k.stapel = {E: [], G: []};   // Reihenfolge der Karten bleibt geheim
    if (HINW[sitz]) k.hinweis = HINW[sitz];
    return k;
  },
  stand(d) { STAND_Q = STAND_Q.then(() => standAnwenden(d)).catch(e => console.error(e)); },
  beendet() { S = null; startseite(); },
});
startseite();
</script>
