<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<link rel="icon" href="../icons/icon-192.png">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c2430">
<title>Zehn Etappen · Spieltisch</title>
<link rel="stylesheet" href="../gemeinsam/kern.css">
<style>
/* Zehn Etappen: helle Papierkarten mit farbiger Zahl und Rahmen; Joker = Stern, Aussetzen = Sprungpfeil.
   Oben die Plätze, links die Stapel, daneben die Auslagen aller Personen, unten die eigene Hand. */
.et-buehne{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:8px}
.et-oben{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 12px 0 118px;min-height:56px;align-content:flex-start}
.et-platz{display:flex;align-items:center;gap:9px;padding:6px 12px 6px 7px;border-radius:14px;background:var(--panel);border:1px solid var(--line);position:relative}
.et-platz.dran{background:rgba(9,32,42,.92);box-shadow:inset 0 0 0 2px var(--pc),0 0 22px color-mix(in srgb,var(--pc) 35%,transparent)}
.et-platz.raus{opacity:.45}
.et-platz .k-dot{width:30px;height:30px;font-size:14px}
.et-platz b{display:block;font-size:15px;max-width:8em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.et-platz small{display:flex;gap:9px;color:var(--ink2);font-size:13px;white-space:nowrap}
.et-platz small i{font-style:normal;color:var(--ink);font-weight:700}
.et-platz .et-aus{position:absolute;right:-6px;top:-8px;background:var(--fehler);color:#2a0d08;font:800 11px var(--f-ui);border-radius:99px;padding:1px 7px}
.et-mini{display:inline-block;width:10px;height:14px;border-radius:2px;background:#e8f1ee;opacity:.8;vertical-align:-2px;margin-right:4px;box-shadow:3px -2px 0 -1px rgba(232,241,238,.45)}
.et-platz .et-etp{background:var(--pc);color:#0f2229;border-radius:7px;padding:0 6px;font-weight:800}
.et-platz .et-etp.ok{outline:2px solid var(--gut)}

.et-mitte{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;min-height:0;align-items:stretch}
.et-hoch .et-mitte{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
.et-hoch .et-auslagen{align-content:start}
.et-links{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:0 8px;min-width:0}
.et-satz{font-size:clamp(16px,1.8vw,20px);text-align:center;line-height:1.3;max-width:20em;text-wrap:balance}
.et-hoch .et-satz{max-width:32em}
.et-satz b{color:var(--pc,var(--akzent));font-family:var(--f-disp);font-weight:800}
.et-stapel-reihe{display:flex;gap:calc(var(--pw)*.35)}
.et-pile{position:relative;width:var(--pw);height:calc(var(--pw)*1.45);--w:var(--pw);border-radius:calc(var(--pw)*.12)}
.et-pile .et-k{position:absolute;left:0;top:0}
.et-pile.leer{box-shadow:inset 0 0 0 1px var(--line)}
.et-pile.ziel{cursor:pointer}
.et-pile.ziel::after,.et-gruppe.ziel::after{content:"";position:absolute;inset:-6px;border-radius:14px;box-shadow:0 0 0 3px var(--akzent);animation:et-puls 1.5s ease-in-out infinite;pointer-events:none}
.et-pile.ueber::after,.et-gruppe.ueber::after{content:"";position:absolute;inset:-8px;border-radius:15px;box-shadow:0 0 0 5px var(--akzent);pointer-events:none}
@keyframes et-puls{0%,100%{opacity:1}50%{opacity:.35}}
.et-pile .et-cap{position:absolute;left:50%;top:calc(100% + 8px);transform:translateX(-50%);font:700 12px var(--f-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);white-space:nowrap}
.et-cnt{position:absolute;right:-9px;top:-9px;z-index:3;min-width:28px;height:28px;padding:0 6px;border-radius:99px;background:#e8f1ee;color:#132f4a;font:700 13px var(--f-ui);display:grid;place-items:center}
.et-log{font-size:14px;color:var(--ink2);text-align:center;max-width:22em;min-height:2.6em;margin-top:18px}
.et-hoch .et-log{max-width:40em;min-height:1.3em}
.et-auslagen{display:grid;grid-template-columns:repeat(var(--sp,2),minmax(0,1fr));gap:10px;align-content:center;min-height:0;overflow:hidden}
.et-person{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:9px 11px;min-width:0;display:flex;flex-direction:column;gap:6px}
.et-person.dran{box-shadow:inset 0 0 0 2px var(--pc)}
.et-person h4{margin:0;font:700 14px var(--f-ui);display:flex;gap:8px;align-items:center;white-space:nowrap;overflow:hidden}
.et-person h4 .k-dot{width:20px;height:20px;font-size:11px}
.et-person h4 span.t{color:var(--ink2);font-weight:400;overflow:hidden;text-overflow:ellipsis}
.et-gruppen{display:flex;gap:10px;flex-wrap:wrap;min-height:calc(var(--mw)*1.45 + 18px);align-items:flex-start}
.et-gruppe{position:relative;display:flex;flex-direction:column;gap:3px;padding:4px;border-radius:10px;--w:var(--mw)}
.et-gruppe.ziel{cursor:pointer}
.et-gruppe .reihe{display:flex}
.et-gruppe .reihe .et-k:not(:first-child){margin-left:calc(var(--mw)*-.56)}
.et-k.mini .mi,.et-k.mini .ix.u{display:none}
.et-k.mini .ix{left:calc(var(--w)*.1);top:calc(var(--w)*.1);font-size:calc(var(--w)*.4)}
.et-k.mini.sonder .ix{display:none}
.et-k.mini.sonder .mi{display:grid;place-items:start;padding:calc(var(--w)*.1)}
.et-k.mini.sonder svg{width:calc(var(--w)*.4);height:calc(var(--w)*.4)}
.et-k.mini .als{left:calc(var(--w)*.1);right:auto;bottom:calc(var(--w)*.1);font-size:calc(var(--w)*.4)}
.et-gruppe small{font-size:11px;color:var(--ink2);white-space:nowrap}
.et-noch{font-size:13px;color:var(--ink3);align-self:center}

.et-unten{display:flex;flex-direction:column;gap:8px}
.et-leiste{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:52px}
.et-leiste .et-ziel{font-size:15px;color:var(--ink2);max-width:28em;text-align:center}
.et-leiste .et-ziel b{color:var(--ink)}
.et-hand{position:relative;height:calc(var(--hw)*1.45 + 22px);--w:var(--hw)}
.et-hand .et-k{position:absolute;top:18px;transition:transform .16s, left .3s cubic-bezier(.3,.7,.3,1);touch-action:none;cursor:pointer}
.et-hand .et-k.wahl{transform:translateY(-18px);outline:3px solid var(--akzent);outline-offset:2px}
.et-hand .et-k.neu{outline:3px solid var(--gut);outline-offset:2px}
.et-hand .et-k.weg{opacity:.25}
.et-hand.zu .et-k{cursor:default}
.et-hand .et-k.matt{filter:brightness(.55)}
.et-geist{position:fixed;left:0;top:0;z-index:120;pointer-events:none}

/* ---------- Karte ---------- */
.et-k{position:relative;width:var(--w);height:calc(var(--w)*1.45);border-radius:calc(var(--w)*.12);background:#fbf8f1;color:var(--fc);flex:none;overflow:hidden;
  font-family:var(--f-disp);font-weight:800;box-shadow:inset 0 0 0 calc(var(--w)*.06) var(--fc),inset 0 0 0 calc(var(--w)*.085) #fbf8f1,
  inset 0 0 0 calc(var(--w)*.095) color-mix(in srgb,var(--fc) 40%,transparent),0 calc(var(--w)*.03) calc(var(--w)*.08) rgba(0,0,0,.35)}
.et-k .ix{position:absolute;left:calc(var(--w)*.15);top:calc(var(--w)*.12);font-size:calc(var(--w)*.22);line-height:1;letter-spacing:-.04em}
.et-k .ix.u{left:auto;top:auto;right:calc(var(--w)*.15);bottom:calc(var(--w)*.12);transform:rotate(180deg)}
.et-k .mi{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--w)*.58);letter-spacing:-.06em;line-height:1}
.et-k .mi.ul span{text-decoration:underline;text-decoration-thickness:calc(var(--w)*.045);text-underline-offset:calc(var(--w)*.05)}
.et-k .mi::before{content:"";position:absolute;left:50%;top:50%;width:calc(var(--w)*.78);height:calc(var(--w)*.78);transform:translate(-50%,-50%) rotate(45deg);
  border-radius:calc(var(--w)*.12);background:color-mix(in srgb,var(--fc) 13%,transparent)}
.et-k .mi span{position:relative}
.et-k.sonder{background:#2a1f4a;color:#fff;box-shadow:inset 0 0 0 calc(var(--w)*.06) #fbf8f1,0 calc(var(--w)*.03) calc(var(--w)*.08) rgba(0,0,0,.35)}
.et-k.sonder .mi::before{display:none}
.et-k.sonder svg{width:calc(var(--w)*.56);height:calc(var(--w)*.56)}
.et-k.sonder .ix{font-size:calc(var(--w)*.13);letter-spacing:.02em}
.et-k.aus{background:#3a1d22}
.et-k .als{position:absolute;right:calc(var(--w)*.1);bottom:calc(var(--w)*.08);font:800 calc(var(--w)*.26) var(--f-disp);color:#f5d27a}
.et-k.zu{background:linear-gradient(160deg,#3a2c78,#1d1640);box-shadow:inset 0 0 0 calc(var(--w)*.05) #e8f1ee,0 2px 6px rgba(0,0,0,.35)}
.et-k.zu > *{display:none}
.et-k.zu::after{content:"10";position:absolute;inset:0;display:grid;place-items:center;font:800 calc(var(--w)*.34) var(--f-disp);color:rgba(232,241,238,.85);
  background:repeating-linear-gradient(135deg,transparent 0 calc(var(--w)*.09),rgba(255,255,255,.07) calc(var(--w)*.09) calc(var(--w)*.18))}

.et-tab{width:100%;border-collapse:collapse;margin:10px 0 4px;font-size:15px}
.et-tab td,.et-tab th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.et-tab th{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.et-tab .r{text-align:right;font-variant-numeric:tabular-nums}
.et-tab .sieg td{color:var(--akzent);font-weight:700}
.et-reste{display:flex;gap:2px;flex-wrap:wrap;--w:24px}
.et-reste .et-k .ix{display:none}
.et-liste{list-style:none;padding:0;margin:8px 0 0;display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:16px}
.et-liste b{color:var(--akzent);font-family:var(--f-disp)}
.et-meldung{position:fixed;left:50%;top:40%;transform:translateX(-50%);z-index:300;pointer-events:none;background:#f4efe4;color:#14262b;font-weight:700;
  padding:11px 20px;border-radius:99px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:calc(100% - 40px);text-align:center;animation:k-hoch .25s cubic-bezier(.2,.8,.3,1)}
.et-start{display:flex}
.et-start .et-k{--w:70px}
@media (prefers-reduced-motion:reduce){.et-hand .et-k{transition:none!important}}
.et-pinfo{display:none}
/* ---------- Telefon hoch: keine eigene Platzleiste – Etappe, Handkarten, Punkte stehen in den Auslagen;
   Satz neben den Kopfknöpfen, Stapel daneben das Protokoll; die Auslagen rollen, wenn sie nicht passen. ---------- */
@media (max-width:700px){
  .et-buehne{gap:6px;grid-template-rows:minmax(0,1fr) auto}
  .et-oben{display:none}
  .et-mitte,.et-hoch .et-mitte{gap:8px}
  .et-links{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:6px 14px;padding:0}
  .et-satz,.et-hoch .et-satz{grid-column:1/-1;font-size:16px;text-align:left;max-width:none;min-height:46px;display:flex;align-items:center;padding-left:104px}
  .et-stapel-reihe{padding:9px 0 22px 4px}
  .et-log,.et-hoch .et-log{font-size:13px;text-align:left;margin:0;min-height:0;max-width:none;line-height:1.35}
  .et-auslagen{overflow-y:auto;align-content:start;touch-action:pan-y;-webkit-overflow-scrolling:touch;gap:8px;padding:2px 2px 4px}
  .et-person{padding:8px 9px;gap:5px;border-radius:14px}
  .et-person h4{font-size:14px;gap:6px}
  .et-person h4 span.t{display:none}
  .et-pinfo{display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--ink2);line-height:1.3}
  .et-pinfo > span{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .et-pinfo i{font-style:normal;color:var(--ink);font-weight:700}
  .et-pinfo .et-etp{background:var(--pc);color:#0f2229;border-radius:7px;padding:0 6px;font-weight:800}
  .et-pinfo .et-etp.ok{outline:2px solid var(--gut)}
  .et-pinfo .et-aus{background:var(--fehler);color:#2a0d08;font-weight:800;border-radius:99px;padding:0 7px}
  .et-gruppen{gap:6px 8px;min-height:0}
  .et-gruppe{padding:3px}
  .et-gruppe small{font-size:12px}
  .et-noch{font-size:13px;align-self:flex-start}
  .et-unten{gap:10px}
  .et-leiste{gap:8px;min-height:46px}
  .et-leiste .et-ziel{flex:1 1 100%;font-size:14px;line-height:1.3;max-width:none}
  .et-leiste > .k-btn{flex:1 1 0;min-height:46px;padding:4px 10px;font-size:15px;white-space:normal;line-height:1.15;border-radius:12px}
  /* nur ein Knopf (Ziehphase): Text und Knopf in einer Zeile */
  .et-leiste:not(:has(> .k-btn ~ .k-btn)) > .et-ziel{flex:1 1 0;text-align:left}
  .et-leiste:not(:has(> .k-btn ~ .k-btn)) > .k-btn{flex:none}
  .et-tab{font-size:13px}
  .et-tab td,.et-tab th{padding:6px 2px}
  .et-tab th{font-size:11px;letter-spacing:.02em}
  .et-tab td:first-child{white-space:nowrap}
  .et-tab td:first-child .k-dot{margin-right:5px!important}
  .et-tab .et-tn{display:inline-block;max-width:6.2em;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
  .et-reste{--w:22px}
  .et-netz .et-satz{padding-right:96px} /* Netzspiel: Platz für die Verbindungsplakette oben rechts */
}
.et-netz .et-oben{padding-right:118px}
</style>
</head>
<body class="chart">
<script src="../gemeinsam/kern.js"></script>
<script src="../gemeinsam/netz.js"></script>
<script src="etappen.logik.js"></script>
<script>
"use strict";
(() => {
const E = window.Etappen;
const AKZENT = '#a68cf5';
const FC = {rot: '#cf3e35', blau: '#2c69bd', gelb: '#c48a0c', gruen: '#2a8a4d'};
const esc = Kern.esc;
const TEST = {rnd: null};
const R = n => TEST.rnd ? TEST.rnd(n) : Kern.zufall(n);
const EINST = Kern.einst.laden({sort: 'zahl'});
const HANDY = matchMedia('(max-width:700px)');
let S = null, OFFEN = null, BUSY = false, SEL = new Set(), NEU = new Set(), START = null, B = null;

const REGELN = `
<p>Zehn Etappen, eine nach der anderen. In jeder Runde versuchst du, deine aktuelle Etappe auszulegen. Wer zuerst Etappe 10 geschafft hat, gewinnt.</p>
<h3>Karten</h3>
<p>108 Karten: die Zahlen 1 bis 12 je zweimal in Rot, Blau, Gelb und Grün, dazu 8 <b>Joker</b> (Stern) und 4 <b>Aussetzen</b>-Karten (Sprungpfeil).</p>
<h3>Die zehn Etappen</h3>
<ol>${E.PHASEN.map((_, i) => `<li>${E.phaseText(i)}</li>`).join('')}</ol>
<p><b>Drilling, Vierling …</b>: gleiche Zahl, Farben egal. <b>Folge</b>: lückenlos aufsteigende Zahlen, Farben egal, nur 1 bis 12 (nach der 12 kommt keine 1). <b>Farbe</b>: gleiche Farbe, Zahlen egal.</p>
<h3>Dein Zug</h3>
<ol><li>Ziehe eine Karte: vom Stapel oder die oberste Karte der Ablage (eine Aussetzen-Karte darf nie von der Ablage genommen werden).</li>
<li>Hast du deine Etappe komplett auf der Hand, tippe ihre Karten an und lege sie aus. Du darfst mehr Karten auslegen, als verlangt sind, wenn sie direkt in die Gruppen passen – aber keine zusätzliche Gruppe.</li>
<li>Liegt deine Etappe, darfst du <b>anlegen</b>: einzelne Karten an deine oder fremde Gruppen. Folgen werden nur an den Enden verlängert.</li>
<li>Wirf eine Karte ab – damit endet dein Zug.</li></ol>
<h3>Joker und Aussetzen</h3>
<p>Ein Joker ersetzt jede Zahl und jede Farbe. Jede Gruppe braucht mindestens eine echte Karte. Ein ausgelegter Joker bleibt bis zum Rundenende, was er ist. Wirfst du ein Aussetzen ab, wählst du eine andere Person: Sie verliert ihren nächsten Zug. Wer schon ein offenes Aussetzen hat, kann kein zweites bekommen. Liegt als erste Ablagekarte ein Aussetzen, verliert die erste Person ihren ersten Zug.</p>
<h3>Rundenende</h3>
<p>Wer alle Handkarten los ist (durch Abwerfen oder Anlegen), beendet die Runde. Alle, die ihre Etappe ausgelegt haben, gehen zur nächsten weiter; die anderen versuchen dieselbe noch einmal. Für die Karten auf der Hand gibt es Strafpunkte: 1–9 je 5, 10–12 je 10, Aussetzen 15, Joker 25. Danach gibt die nächste Person.</p>
<h3>Spielende</h3>
<p>Wer am Ende einer Runde Etappe 10 geschafft hat, gewinnt. Schaffen es mehrere, gewinnt, wer insgesamt die wenigsten Punkte hat. Stehen sie gleich, spielen nur sie Etappe 10 noch einmal – wer zuerst alle Karten los ist, gewinnt.</p>`;

Kern.init({id: 'etappen', name: 'Zehn Etappen', akzent: AKZENT, regeln: REGELN,
  onNeu: () => { Kern.speicher.loeschen(); startseite(); }, menue: [{text: 'Punktestand', aktion: () => punkteFenster()}, {text: 'Die zehn Etappen', aktion: () => etappenFenster()}]});

/* ---------- Karten ---------- */
const SYM = {
  J: '<svg viewBox="0 0 24 24"><path d="M12 2.5l2.7 6.3 6.8.6-5.2 4.5 1.6 6.7L12 17.1 6.1 20.6l1.6-6.7-5.2-4.5 6.8-.6z" fill="#f5d27a"/></svg>',
  A: '<svg viewBox="0 0 24 24" fill="none" stroke="#f3a596" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17c2-7 13-9 17-3"/><path d="M20.5 9.5l-.4 4.8-4.6-1.2"/><circle cx="11" cy="18.5" r="2.2" fill="#f3a596" stroke="none"/></svg>'
};
function karteHtml(k, cls = '', als = null) {
  if (!k) return '';
  if (k.w === 'J') return `<div class="et-k sonder ${cls}" data-id="${k.id}" aria-label="Joker"><div class="ix">JOKER</div><div class="mi">${SYM.J}</div>${als != null ? `<span class="als">${als}</span>` : ''}</div>`;
  if (k.w === 'A') return `<div class="et-k sonder aus ${cls}" data-id="${k.id}" aria-label="Aussetzen"><div class="ix">AUSSETZEN</div><div class="mi">${SYM.A}</div></div>`;
  const ul = k.w === 6 || k.w === 9;
  return `<div class="et-k ${cls}" style="--fc:${FC[k.f]}" data-id="${k.id}" aria-label="${E.FARBNAME[k.f]} ${k.w}">
    <div class="ix">${k.w}</div><div class="mi${ul ? ' ul' : ''}"><span>${k.w}</span></div><div class="ix u">${k.w}</div></div>`;
}
const rueck = () => '<div class="et-k zu"></div>';

/* ---------- Hilfen ---------- */
function hinweis(text, ms = 2600) {
  document.querySelectorAll('.et-meldung').forEach(e => e.remove());
  const m = Kern.el('div', 'et-meldung', esc(text)); document.body.appendChild(m);
  const h = B && B.querySelector('.et-leiste'); if (h) m.style.top = Math.max(70, h.getBoundingClientRect().top - 60) + 'px';
  setTimeout(() => m.remove(), ms);
}
/* Rückfrage (eigene Fassung: Kern.frage liefert beim Knopf null, siehe Abschlussbericht). */
function frage({titel = '', text = '', knoepfe = []}) {
  return new Promise(res => {
    const box = Kern.el('div'); box.innerHTML = `<h2>${esc(titel)}</h2>${text ? `<p>${text}</p>` : ''}<div class="k-knoepfe"></div>`;
    let wert = null; const fe = Kern.fenster(box, {schliessbar: true, beimSchliessen: () => res(wert)});
    knoepfe.forEach(b => { const k = Kern.el('button', 'k-btn ' + (b.art || ''), esc(b.text)); if (b.id) k.id = b.id; k.onclick = () => { wert = b.wert; fe.schliessen(); }; box.querySelector('.k-knoepfe').appendChild(k); });
  });
}

/* ---------- Netzspiel: Hilfen ----------
   Am selben Gerät gilt die Sicht der Person hinter dem Sichtschutz (OFFEN), im Netzspiel immer der eigene Sitz.
   Der Gastgeber führt S; Mitspieler bekommen einen gekürzten Stand (fremde Hände und Stapel nur als Anzahl). */
const NETZ = () => Netz.laeuft;
const meins = sitz => sitz == null || !Netz.laeuft || sitz === Netz.meinSitz;
/** Hinweis für die Person, die gehandelt hat – auf ihrem eigenen Gerät. */
function sag(sitz, text, ms) { if (meins(sitz)) hinweis(text, ms); else Netz.ereignis({daten: {an: sitz, hinweis: text, ms}}); }
const ich = () => (NETZ() ? Netz.meinSitz : OFFEN);
const amEnde = () => S.phase === 'rundenende' || S.phase === 'spielende';
function nichtDran() { if (NETZ() && S && !amEnde()) { Kern.ton('fehler'); hinweis(`${S.namen[S.dran]} ist dran.`); } }
let WERT_FE = null, WERT_MARKE = '', LETZTE_HAND = null;

/* ---------- Startseite ---------- */
function startseite() {

  const r = k ? E.abwerfen(S, id, ziel) : {ok: false};
  if (!r.ok) { sag(sitz, r.grund || 'Geht nicht.'); Netz.melden(); return; }
  Kern.ton(k.w === 'A' ? 'warn' : 'karte'); if (meins(sitz)) { SEL.clear(); NEU.clear(); }
  return nachZug(sitz);
}
async function nachZug(sitz = null) {
  speichern();
  if (NETZ()) { // kein Weitergeben: Stand melden, Wertung zeigt der Gastgeber
    zeichnen(); Netz.melden();
    if (amEnde()) { await Kern.warte(700); if (S && amEnde() && NETZ()) wertung(); }
    return;
  }
  OFFEN = null; zeichnen();
  if (S.phase === 'rundenende' || S.phase === 'spielende') { await Kern.warte(700); wertung(); return; }
  await Kern.warte(700); weiterAn();
}
async function weiterAn() {
  if (S.phase === 'rundenende' || S.phase === 'spielende') { wertung(); return; }
  OFFEN = null; SEL.clear(); NEU.clear(); zeichnen();
  const sp = S.dran, was = S.log.slice(-2).join(' ');
  await Kern.sichtschutz({name: S.namen[sp], farbe: farbe(sp), text: (was ? esc(was) + '<br>' : '') + `Deine Etappe ${S.etappe[sp] + 1}: ${E.phaseText(S.etappe[sp])}.`});
  OFFEN = sp; zeichnen();
  // Telefon: die eigene Auslage in den sichtbaren Teil der rollenden Auslagen holen
  if (HANDY.matches) { const p = B.querySelector('.et-person.dran'); if (p) p.scrollIntoView({block: 'nearest'}); }
}

/* ---------- Wertung ---------- */
function wertung() {
  document.querySelectorAll('.et-meldung').forEach(m => m.remove());
  if (WERT_FE) { WERT_FE.schliessen(); WERT_FE = null; }
  const netz = NETZ(), gast = Netz.istGast;
  const e = S.ergebnis, ende = S.phase === 'spielende', box = Kern.el('div');
  const titel = ende ? `${nm(e.spielSieger)} gewinnt!` : e.stechen ? 'Gleichstand nach Etappe 10' : `${nm(e.sieger)} ist alle Karten los`;
  let text = ende ? (e.warStechen ? `${nm(e.spielSieger)} war im Stechen zuerst alle Karten los.` : e.zehn.length > 1 ? `Mehrere haben Etappe 10 geschafft – ${nm(e.spielSieger)} hat die wenigsten Punkte.` : `${nm(e.spielSieger)} hat als erste Person alle zehn Etappen geschafft.`)
    : e.stechen ? `${e.stechen.map(nm).join(' und ')} haben Etappe 10 geschafft und gleich viele Punkte. Sie spielen Etappe 10 noch einmal – wer zuerst alle Karten los ist, gewinnt.`
    : 'Wer seine Etappe ausgelegt hat, geht weiter. Strafpunkte für die Handkarten: 1–9 je 5, 10–12 je 10, Aussetzen 15, Joker 25.';
  const zeilen = e.einzel.map(x => x.sp);
  box.innerHTML = `<h2>${titel}</h2><p>${text}</p>
    <table class="et-tab"><tr><th>Name</th><th>Etappe</th><th>Handkarten</th><th class="r">Runde</th><th class="r">Gesamt</th></tr>
    ${zeilen.map(i => { const x = e.einzel.find(y => y.sp === i); return `<tr class="${e.spielSieger === i ? 'sieg' : ''}"><td><span class="k-dot" style="--pc:${farbe(i)};display:inline-grid;margin-right:8px;vertical-align:-5px">${esc(S.namen[i].charAt(0))}</span><span class="et-tn">${nm(i)}</span></td>
      <td>${x.geschafft ? `<span style="color:var(--gut)">✓ ${x.etappe + 1}</span>${x.etappe < 9 ? ` → ${x.etappe + 2}` : ''}` : `${x.etappe + 1} (nochmal)`}</td>
      <td>${S.haende[i].length ? `<div class="et-reste">${S.haende[i].map(k => karteHtml(k)).join('')}</div>` : '<span style="color:var(--akzent)">alle los</span>'}</td>
      <td class="r">${x.wert ? '+' + x.wert : '0'}</td><td class="r"><b>${S.punkte[i]}</b></td></tr>`; }).join('')}</table><div class="k-knoepfe"></div>`;
  const fe = Kern.fenster(box, {breit: true, schliessbar: gast, beimSchliessen: () => { if (WERT_FE === fe) WERT_FE = null; }}), kn = box.querySelector('.k-knoepfe');
  WERT_FE = fe;
  const knopf = (t, id, art, fn) => { const b = Kern.el('button', 'k-btn ' + art, t); b.id = id; b.onclick = () => { fe.schliessen(); fn(); }; kn.appendChild(b); };
  // Im Netzspiel entscheidet nur der Gastgeber, wie es weitergeht.
  if (gast) kn.innerHTML = `<p class="et-wartet" style="margin:0;color:var(--ink2)">${nm(0)} entscheidet, wie es weitergeht.</p>`;
  if (ende) {
    Kern.speicher.loeschen(); Kern.ton('sieg'); Kern.feier();
    if (!gast) {
      knopf(netz ? 'Spiel beenden' : 'Neues Spiel', 'et-neu', 'leise', () => { if (NETZ()) Netz.verlassen(); startseite(); });
      knopf('Nochmal', 'et-nochmal', '', () => neuesSpiel(S.namen, S.farben));
    }
  } else {
    Kern.ton('runde');
    if (!gast) knopf(e.stechen ? 'Stechen beginnen' : 'Nächste Runde', 'et-weiter', '', () => {
      E.naechsteRunde(S, R); speichern();
      if (NETZ()) { SEL.clear(); NEU.clear(); zeichnen(); Netz.melden(); } else weiterAn();
    });
  }
}
function punkteFenster() {
  if (!S) return;
  const z = S.namen.map((n, i) => i).sort((a, b) => S.etappe[b] - S.etappe[a] || S.punkte[a] - S.punkte[b]);
  Kern.fenster(`<h2>Punktestand</h2><p>Runde ${S.runde}${S.stechen ? ' · Stechen um den Sieg' : ''}</p><table class="et-tab"><tr><th>Name</th><th>Etappe</th><th class="r">Punkte</th></tr>
    ${z.map(i => `<tr><td>${nm(i)}</td><td>${S.etappe[i] + 1}: ${E.phaseText(S.etappe[i])}</td><td class="r">${S.punkte[i]}</td></tr>`).join('')}</table>`);
}
function etappenFenster() {
  Kern.fenster(`<h2>Die zehn Etappen</h2><ul class="et-liste">${E.PHASEN.map((_, i) => `<b>${i + 1}</b><span>${E.phaseText(i)}</span>`).join('')}</ul>`);
}

window.__test = {
  S: () => S, offen: () => OFFEN, logik: E,
  zufall(seed) { let s = seed >>> 0; TEST.rnd = n => { s = (s * 1664525 + 1013904223) >>> 0; return s % n; }; },
  setze(fn) { fn(S); speichern(); zeichnen(); Netz.melden(); }
};

/* ---------- Netzspiel ----------
   Sitz 0 = Gastgeber. Karten markieren bleibt auf dem eigenen Gerät; geschickt wird erst der fertige Zug
   (ziehen, Etappe auslegen samt Joker-Lage, anlegen samt Ende, abwerfen samt Aussetzen-Ziel). */
Netz.einrichten({
  spiel: 'etappen', min: 2, max: 6,
  starten(spieler) { neuesSpiel(spieler.map(p => p.name), spieler.map(p => p.farbe)); },
  aktion(name, d, sitz) {
    if (!S || amEnde() || (sitz !== null && sitz !== S.dran)) return Netz.melden();
    const ids = Array.isArray(d.ids) ? d.ids.map(Number) : [];
    switch (name) {
      case 'ziehe': return ziehAus(d.q === 'ablage' ? 'ablage' : 'stapel', sitz);
      case 'auslegen': return auslegenAus(ids, Number(d.wahl) || 0, sitz);
      case 'anlegen': return anlegenAus(Number(d.id), Number(d.gid), d.ende || null, sitz);
      case 'abwerfen': return abwerfenAus(Number(d.id), d.ziel == null ? null : Number(d.ziel), sitz);
    }
    Netz.melden();
  },
  zustand(sitz) {
    const ende = amEnde();
    return {s: Object.assign({}, S, {
      haende: S.haende.map((h, i) => (i === sitz || ende) ? h : h.length),
      stapel: S.stapel.length, ablage: S.ablage.slice(-1),
    })};
  },
  stand(d) {
    const alt = S, altOben = alt ? (E.oben(alt) || {}).id : undefined, warDran = alt && alt.dran;
    const s = Object.assign({}, d.s); // den empfangenen Stand selbst nicht verändern
    s.haende = s.haende.map(h => Array.isArray(h) ? h : Array.from({length: h}, (_, j) => ({id: -1 - j, f: null, w: '?'})));
    s.stapel = Array.from({length: s.stapel}, () => null);
    S = s;
    if (!B || !document.body.contains(B)) buehneBauen(); else zeichnen();
    if (alt && (E.oben(S) || {}).id !== altOben && S.dran !== warDran) Kern.ton('karte');
    if (alt && warDran !== S.dran && S.dran === Netz.meinSitz) Kern.ton('tipp');
    if (amEnde()) {
      const m = S.runde + S.phase;
      if (WERT_MARKE !== m) { WERT_MARKE = m; setTimeout(() => { if (S && amEnde() && WERT_MARKE === m && Netz.laeuft) wertung(); }, 700); }
    } else { WERT_MARKE = ''; if (WERT_FE) { WERT_FE.schliessen(); WERT_FE = null; } }
  },
  ereignis(d) {
    if (d.an != null && d.an !== Netz.meinSitz) return;
    if (d.hinweis) hinweis(d.hinweis, d.ms);
  },
  beendet: () => startseite(),
});
startseite();
})();
</script>
